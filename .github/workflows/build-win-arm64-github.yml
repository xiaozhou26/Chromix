# Generated by tools/gen_windows_arm64_workflow.py; edit the generator or x64 template.
# x64-host cross-build; success requires the separate native ARM64 verification job.
name: build-win-arm64-github
'on':
  push:
    branches:
    - main
    paths:
    - build/*
    - build/windows/**
    - patches/**
    - assets/fonts/**
    - tools/*upstream_cache.py
    - tools/upstream_object_cache.py
    - tools/upstream_script_identity.py
    - tools/apply_restored_patches.py
    - tools/prepare_restored_build.py
    - tools/restore_ninja.py
    - tools/bootstrap_gn.py
    - tools/restored_reuse_evidence.py
    - tools/merge_gn_args.py
    - tools/build_resources.py
    - tools/tests/test_ci_stage.py
    - tools/tests/test_windows_cleanup_gate.py
    - tools/fingerprint*
    - tools/verify_patch_stack.py
    - tools/device_p0_audit.py
    - tools/canvas_chain_audit.py
    - tools/collect_device.py
    - tools/device_pool.py
    - sdk/python/chromix/_device*.py
    - sdk/python/chromix/device_pool.py
    - sdk/python/chromix/_canvas_chain.py
    - sdk/python/chromix/_render_integration.py
    - sdk/python/chromix/*.js
    - sdk/python/pyproject.toml
    - .github/workflows/build-win-arm64-github.yml
    - CHROMIUM_VERSION
    - CHROMIUM_WINDOWS_VERSION
    - tools/platform_pins.py
    - tools/tests/test_windows_platform_pins.py
    - UNGOOGLED_VERSION
    - UNGOOGLED_WINDOWS_VERSION
    - .github/workflows/build-win-x64-github.yml
    - tools/gen_windows_arm64_workflow.py
    - tools/verify_windows_bundle.py
    - tools/tests/test_windows_arm64_workflow.py
    - tools/tests/test_windows_arm64_build.py
    - tools/tests/test_windows_upstream_cache.py
    - tools/tests/test_verify_windows_bundle.py
  workflow_call:
    inputs:
      build_profile:
        required: false
        type: string
        default: native
      compile_jobs:
        required: false
        type: string
        default: auto
      use_upstream_cache:
        required: false
        type: boolean
        default: false
      upstream_run_id:
        required: false
        type: string
        default: ''
    secrets:
      UPSTREAM_ACTIONS_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      build_profile:
        description: native keeps existing flags; fast reduces ThinLTO optimization; release enables it
        type: choice
        options:
        - native
        - fast
        - release
        default: native
      compile_jobs:
        description: 'Ninja jobs: auto uses CPU/memory limits, or a positive integer'
        type: string
        default: auto
      use_upstream_cache:
        description: Require pinned full upstream source + out/Default reuse; false permits cold builds
        required: false
        default: false
        type: boolean
      upstream_run_id:
        description: Optional upstream run ID; must match the pinned cache manifest
        required: false
        default: ''
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: build-win-arm64-github-${{ github.ref }}
  cancel-in-progress: false
env:
  CHROMIX_BUILD_PROFILE: ${{ inputs.build_profile || 'native' }}
  CHROMIX_JOBS: ${{ inputs.compile_jobs || 'auto' }}
  CHROMIX_USE_UPSTREAM_CACHE: ${{ (inputs.use_upstream_cache || inputs.upstream_run_id != '') && '1' || '0' }}
  CHROMIX_PREFER_UPSTREAM_CACHE: '0'
  DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
  DEPOT_TOOLS_METRICS: '0'
  DEPOT_TOOLS_COLLECT_METRICS: '0'
  CHROMIX_TARGET_ARCH: arm64
jobs:
  build-1:
    name: stage 1 (fetch + sync + first compile)
    runs-on: windows-2022
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      snapshot_attempt: ${{ steps.snapshot_origin.outputs.attempt }}
    steps:
    - name: Record snapshot producer attempt
      id: snapshot_origin
      shell: powershell
      run: Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "attempt=$env:GITHUB_RUN_ATTEMPT"
    - uses: actions/checkout@v4
    - name: Verify native process-tree cleanup
      shell: powershell
      timeout-minutes: 5
      run: 'python -m pip install --disable-pip-version-check PyYAML==6.0.2

        if ($LASTEXITCODE -ne 0) { throw "process cleanup test dependency install failed" }

        python -m unittest tools.tests.test_ci_stage.InvokeTrackedRegressionTest tools.tests.test_ci_stage.InvokeTrackedPowerShellTest
        -v

        if ($LASTEXITCODE -ne 0) { throw "native process-tree cleanup regression failed" }

        '
    - name: Verify generated Windows ARM64 workflow
      shell: powershell
      timeout-minutes: 2
      run: 'python tools/gen_windows_arm64_workflow.py --check

        if ($LASTEXITCODE -ne 0) { throw "Windows ARM64 workflow generation is stale" }'
    - name: Select compile parallelism
      shell: powershell
      run: python tools/build_resources.py --github-env
    - name: Run stage 1
      id: stage
      shell: powershell
      env:
        GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN || github.token }}
        USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache }}
        UPSTREAM_RUN_ID: ${{ inputs.upstream_run_id }}
      run: "$stageArgs = @{\n  StageIndex = 1\n  MaxStages = 12\n  UseUpstreamCache = ($env:USE_UPSTREAM_CACHE -eq 'true')\n\
        }\nif ($env:UPSTREAM_RUN_ID) { $stageArgs.UpstreamRunId = $env:UPSTREAM_RUN_ID }\n& build\\windows\\ci-stage.ps1 @stageArgs\n"
    - name: Upload upstream cache diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: upstream-cache-win-arm64-s1-attempt-${{ github.run_attempt }}
        include-hidden-files: true
        path: 'C:\u\result.json

          C:\c\chromix\upstream-cache-restore.json

          C:\c\chromix\upstream-cache-ninja.json

          C:\c\chromix\upstream-cache-preparation.json

          C:\c\chromix\src\.chromix-upstream-restored.json

          C:\c\chromix\src\.chromix-restored-patches.json

          C:\c\chromix\src\out\Default\args.gn

          C:\c\chromix\upstream-cache-import.json

          C:\c\chromix\upstream-cache-plan.log

          C:\c\chromix\upstream-reuse\baseline.json

          C:\c\chromix\upstream-reuse\result.json

          '
        if-no-files-found: ignore
        retention-days: 3
    - name: Ensure build tree snapshot
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.upload_parts != 'true' && steps.stage.outputs.finished
        != 'true' }}
      shell: powershell
      run: 'New-Item -ItemType Directory -Force -Path C:\c\chromix | Out-Null

        . build\windows\ci-parts.ps1 -Root C:\c -PartsDir C:\parts -Mode Synced

        '
    - name: Upload tree part 1
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.finished != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: win-arm64-tree-s1-attempt-${{ github.run_attempt }}-part1
        path: C:\parts\p1\*
        if-no-files-found: warn
        retention-days: 3
        compression-level: 0
    - name: Upload tree part 2

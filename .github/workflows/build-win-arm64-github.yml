  complete:
    name: ensure build finished
    needs:
    - build-1
    - build-2
    - build-3
    - build-4
    - build-5
    - build-6
    - build-7
    - build-8
    - build-9
    - build-10
    - build-11
    - build-12
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
    - name: Assert some stage reported finished
      run: "f=\"${{ join(needs.*.outputs.finished) }}\"\ncase \"$f\" in\n  *true*) echo \"Build finished; win-arm64 artifact\
        \ uploaded.\" ;;\n  *) echo \"Build did not finish within 12 stages.\"; exit 1 ;;\nesac\n"
  verify-arm64:
    name: native Windows ARM64 bundle and fingerprint verification
    needs: complete
    if: ${{ !cancelled() && needs.complete.result == 'success' }}
    runs-on: windows-11-arm
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        architecture: x64
    - name: Download this run's compiled ARM64 bundle
      uses: actions/download-artifact@v4
      with:
        name: win-arm64
        path: dist
    - name: Download this run's source receipt
      uses: actions/download-artifact@v4
      with:
        name: chromix-win-arm64-source-receipt
        path: source-receipt
    - name: Verify checksum, PE architecture, version and native headless exit
      shell: pwsh
      timeout-minutes: 5
      run: 'python tools/verify_windows_bundle.py --archive dist/chromix-win-arm64.zip --sha256-file dist/SHA256SUMS --dest
        smoke --arch arm64 --native --report diagnostics/native-smoke.json

        if ($LASTEXITCODE -ne 0) { throw "native ARM64 bundle verification failed" }'
    - name: Install fingerprint verification dependencies
      shell: pwsh
      timeout-minutes: 10
      run: 'python -m pip install --disable-pip-version-check --timeout 30 --retries 1 -r tools/fingerprint-requirements.txt

        if ($LASTEXITCODE -ne 0) { throw "fingerprint dependency installation failed" }'
    - name: Verify native ARM64 fingerprint behavior
      shell: pwsh
      timeout-minutes: 40
      run: '$browser = (Resolve-Path smoke/chromix/chrome.exe).Path

        $hash = (Get-FileHash -LiteralPath $browser -Algorithm SHA256).Hash.ToLowerInvariant()

        $pins = & build/windows/read-platform-pins.ps1 -Repo $env:GITHUB_WORKSPACE

        $version = $pins.ChromiumVersion

        python -X utf8 tools/fingerprint_acceptance.py --browser $browser --expected-sha256 $hash --expected-version $version
        --source-report source-receipt/source-verification.json --output-dir diagnostics/fingerprint

        if ($LASTEXITCODE -ne 0) { throw "native ARM64 fingerprint acceptance failed" }'
    - name: Upload native verification diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: native-win-arm64-attempt-${{ github.run_attempt }}
        path: diagnostics/
        if-no-files-found: warn
        retention-days: 7

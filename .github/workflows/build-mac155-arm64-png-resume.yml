name: build-mac155-arm64-png-resume
run-name: mac155 arm64 compiled stage1 PNG recovery

on:
  workflow_dispatch:
    inputs:
      compile_jobs:
        description: 'Ninja jobs: auto or a positive integer; reviewed source migration and GN arguments are fixed'
        type: string
        default: auto

permissions:
  actions: read
  contents: read

concurrency:
  group: mac155-arm64-png-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resume:
    name: mac155 arm64 (compiled donor + PNG migration 1..8)
    uses: ./.github/workflows/build-posix-github.yml
    with:
      platform: macos
      arch: arm64
      runner: macos-15
      artifact: chromix-mac-arm64
      max-stages: 8
      build_profile: fast
      compile_jobs: ${{ inputs.compile_jobs || 'auto' }}
      resume_run_id: '39435546134'
      resume_tree_stage: '1'
      resume_attempt: '1'
      resume_artifact_ids: '12277390323,12277060649'
      use_upstream_cache: true
    secrets: inherit

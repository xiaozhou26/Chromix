            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-logs/stage-8.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve latest failed Linux source/output checkpoint
        id: linux_runtime_checkpoint
        if: ${{ !cancelled() && inputs.platform == 'linux' && steps.stage.outcome == 'failure' }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          python3 - "$WORK" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          work = Path(sys.argv[1])
          if work.is_symlink() or not work.is_dir() or work.resolve() != work:
              raise SystemExit("unsafe Linux checkpoint work directory")
          if (work / "src").is_symlink() or not (work / "src").is_dir():
              raise SystemExit("Linux checkpoint source directory is missing or unsafe")
          # Only redundant copies; retain the bundle, source, objects and caches.
          copies = [work / "smoke", work / "dist/chromix"]
          snapshots = [work / f".snapshot-stage-{stage}" for stage in range(1, 9)]
          for path in [*copies, *snapshots]:
              if path.is_symlink() or path.resolve() != path:
                  raise SystemExit(f"unsafe Linux checkpoint cleanup path: {path}")
          for path in [*copies, *snapshots]:
              if path.is_dir():
                  shutil.rmtree(path)
          PY
          if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
            CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
              --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s8.json"
          else
            python3 tools/verify_linux_checkpoint.py --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s8.json"
          fi
          bash build/posix/ci-parts.sh "$WORK" "$WORK/.snapshot-stage-8"
          echo "upload_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Verify handoff snapshot
        id: checkpoint
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        run: |
          set -euo pipefail
          SNAP="${RUNNER_TEMP}/chromix-build/.snapshot-stage-8"
          UPLOAD_IDENTITY="${RUNNER_TEMP}/chromix-logs/checkpoint-upload-identity-s8.json"
          LINUX157_UPLOAD=0
          if [ '${{ inputs.platform }}' = linux ]; then
            if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "${RUNNER_TEMP}/chromix-logs/checkpoint-upload-source-s8.json"
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/verify_linux157_upload.py \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' > "$UPLOAD_IDENTITY"
              LINUX157_UPLOAD=1
            else
              python3 tools/verify_linux_checkpoint.py --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "$UPLOAD_IDENTITY"
            fi
          fi
          test -d "$SNAP/p1"
          if [ "$LINUX157_UPLOAD" = 1 ]; then
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_linux157_upload.py --archive-report "$UPLOAD_IDENTITY"
          else
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_snapshot_tar.py
          fi

      - name: Upload tree part 1
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s8-attempt-${{ github.run_attempt }}-part1
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-8/p1/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 2
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:

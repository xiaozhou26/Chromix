          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 4
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s8-attempt-${{ github.run_attempt }}-part4
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-8/p4/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload final bundle
        if: steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy != 'macos-compile-release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: always() && !(inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-logs-s8-attempt-${{ github.run_attempt }}

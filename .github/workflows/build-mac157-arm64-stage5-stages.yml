# GitHub-hosted POSIX (Linux x64/arm64, macOS x64/arm64) build, modeled on
# ungoogled-chromium-portablelinux's prep/build_part_01..10 chain and
# ungoogled-chromium-macos' retrieve-resources/build_job_01..20 chain: a full
# Chromium build exceeds the 6h single-job limit, so posix-1..posix-8 run
# under a self-imposed ~5h budget via `timeout -k`, then snapshot the work
# tree with tar|zstd (mtimes preserved for ninja) uploaded as artifacts; the
# next stage restores and resumes ninja incrementally until it returns 0.
name: build-mac157-arm64-stage5-stages

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      artifact:
        required: true
        type: string
      max-stages:
        required: false
        type: number
        default: 8
      build_profile:
        required: false
        type: string
        default: fast
      compile_jobs:
        required: false
        type: string
        default: auto
      resume_migration:
        required: false
        type: string
        default: ''
      resume_run_id:
        required: false
        type: string
        default: ''
      resume_tree_stage:
        required: false
        type: string
        default: '7'
      resume_artifact_ids:
        required: false
        type: string
        default: ''
      resume_attempt:
        required: false
        type: string
        default: '1'
      linux157_locale_recovery:
        description: 'Restore only compiled x64 run44578881741 and migrate only reviewed0236/0237 locale additions (226 to228)'
        required: false
        type: boolean
        default: false
      linux157_post_gn_recovery:
        description: 'Restore only the latest reviewed Linux157 post-GN donor for tool-only libclang repair'
        required: false
        type: boolean
        default: false
      linux157_pre_gn_recovery:
        description: 'Restore only the reviewed Linux157 stage1 pre-GN donor; no fresh fallback'
        required: false
        type: boolean
        default: false
      macos_compile_release:
        description: 'macOS only: publish integrity-verified compiled bundles; runtime diagnostics are nonblocking (automatic for 157, never for frozen mac156 recovery)'
        required: false
        type: boolean
        default: false
      use_upstream_cache:
        required: false
        type: boolean
        default: true
    secrets:
      UPSTREAM_ACTIONS_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  # Isolate caller workflows without cancelling the legacy aggregate run.
  group: build-posix-${{ github.workflow }}-${{ inputs.platform }}-${{ inputs.arch }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DEPOT_TOOLS_METRICS: '0'
  DEPOT_TOOLS_COLLECT_METRICS: '0'
  CHROMIX_JOBS: ${{ inputs.compile_jobs }}

jobs:
  posix-1:
    name: ${{ inputs.platform }}-${{ inputs.arch }} stage 1 (prepare + first compile)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      snapshot_attempt: ${{ steps.snapshot_origin.outputs.attempt }}
    steps:
      - name: Record runner resources
        run: |
          set -euo pipefail
          echo "CHROMIX_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/chromix-logs"
          {
            uname -a
            case "$(uname -s)" in
              Linux) getconf _NPROCESSORS_ONLN; free -h ;;
              Darwin) sysctl hw.ncpu hw.memsize ;;
            esac
            df -h
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/runner.log"

      - uses: actions/checkout@v4

      - name: Require exact mac157 ARM64 stage5 route
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.runner }}' = macos:arm64:macos-26
          test '${{ inputs.artifact }}:${{ inputs.max-stages }}' = chromix-mac157-arm64-stage5-resume:8
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_tree_stage }}:${{ inputs.resume_attempt }}:${{ inputs.resume_artifact_ids }}' = mac157-arm64-stage5:44567777209:5:1:14626292942
          test '${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}:${{ inputs.macos_compile_release }}' = fast:true:true
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' = false:false:false

      - name: Record snapshot producer attempt
        id: snapshot_origin
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Require exact mac156 Intel stage3 continuation inputs
        if: inputs.resume_migration == 'mac156-x64-stage3'
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.runner }}' = macos:x64:macos-26-intel
          test '${{ inputs.artifact }}' = chromix-mac156-x64-stage3-resume
          test '${{ inputs.max-stages }}' = 8
          test '${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = fast:true
          test '${{ inputs.resume_run_id }}:${{ inputs.resume_tree_stage }}:${{ inputs.resume_attempt }}:${{ inputs.resume_artifact_ids }}' = 42735558594:3:1:13757361205
      - name: Require exact mac156 Intel stage2 continuation inputs
        if: inputs.resume_migration == 'mac156-x64-stage2'
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.runner }}' = macos:x64:macos-26-intel
          test '${{ inputs.artifact }}' = chromix-mac156-x64-stage2-resume
          test '${{ inputs.max-stages }}' = 8
          test '${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = fast:true
          test '${{ inputs.resume_run_id }}:${{ inputs.resume_tree_stage }}:${{ inputs.resume_attempt }}:${{ inputs.resume_artifact_ids }}' = 42683707985:2:1:13724617338
      - name: Require exact mac157 ARM64 ICU/UA migration inputs
        if: inputs.resume_migration == 'mac157-arm64-stage5'
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.runner }}' = macos:arm64:macos-26
          test '${{ inputs.artifact }}' = chromix-mac157-arm64-stage5-resume
          test '${{ inputs.max-stages }}' = 8
          test '${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = fast:true
          test '${{ inputs.resume_run_id }}:${{ inputs.resume_tree_stage }}:${{ inputs.resume_attempt }}:${{ inputs.resume_artifact_ids }}' = 44567777209:5:1:14626292942
      - name: Require exact mac156 ARM64 stage1 continuation inputs
        if: inputs.resume_migration == 'mac156-arm64-stage1'
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.runner }}' = macos:arm64:macos-26
          test '${{ inputs.artifact }}' = chromix-mac156-arm64-stage1-resume
          test '${{ inputs.max-stages }}' = 8
          test '${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = fast:true
          test '${{ inputs.resume_run_id }}:${{ inputs.resume_tree_stage }}:${{ inputs.resume_attempt }}:${{ inputs.resume_artifact_ids }}' = 42652225672:1:1:13706643929,13707496932
      - name: Require exact mac156 ARM64 stage8 continuation inputs
        if: inputs.resume_migration == 'mac156-arm64-stage8'
        run: |
          set -euo pipefail
          test '${{ github.repository }}' = xiaozhou26/Chromix
          test '${{ github.event_name }}' = workflow_dispatch
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.runner }}' = macos:arm64:macos-26
          test '${{ inputs.artifact }}' = chromix-mac156-arm64-stage8-resume
          test '${{ inputs.max-stages }}' = 8
          test '${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = fast:true
          test '${{ inputs.resume_run_id }}:${{ inputs.resume_tree_stage }}:${{ inputs.resume_attempt }}:${{ inputs.resume_artifact_ids }}' = 42455180503:8:1:13675184448
      - name: Require exact mac156 Intel stage8 continuation inputs
        if: inputs.resume_migration == 'mac156-x64-stage8'
        run: |
          set -euo pipefail
          test '${{ github.repository }}' = xiaozhou26/Chromix
          test '${{ github.event_name }}' = workflow_dispatch
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.runner }}' = macos:x64:macos-26-intel
          test '${{ inputs.artifact }}' = chromix-mac156-x64-stage8-resume
          test '${{ inputs.max-stages }}' = 8
          test '${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = fast:true
          test '${{ inputs.resume_run_id }}:${{ inputs.resume_tree_stage }}:${{ inputs.resume_attempt }}:${{ inputs.resume_artifact_ids }}' = 42455177686:8:2:13701073762
      - name: Require exact Linux156 recovery inputs
        if: inputs.resume_migration != '' && inputs.resume_migration != 'mac156-arm64-stage8' && inputs.resume_migration != 'mac156-x64-stage8' && inputs.resume_migration != 'mac156-arm64-stage1' && inputs.resume_migration != 'mac156-x64-stage2' && inputs.resume_migration != 'mac156-x64-stage3' && inputs.resume_migration != 'mac157-arm64-stage5'
        run: |
          set -euo pipefail
          test '${{ inputs.resume_migration }}' = linux156-ts
          test '${{ inputs.platform }}' = linux
          test '${{ inputs.use_upstream_cache }}' = true
          test '${{ inputs.build_profile }}' = fast
          test '${{ inputs.resume_tree_stage }}' = 1
          test '${{ inputs.resume_attempt }}' = 1
          case '${{ inputs.arch }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' in
            x64:42457985068:13608199661|arm64:42457987604:13609217709) ;;
            *) echo 'Exact latest Linux156 failed checkpoint is required' >&2; exit 1 ;;
          esac

      - name: Enable fixed unchanged mac156 Intel stage3 continuation
        if: inputs.resume_migration == 'mac156-x64-stage3'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage3' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel stage2 continuation
        if: inputs.resume_migration == 'mac156-x64-stage2'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage2' >> "$GITHUB_ENV"
      - name: Enable fixed mac157 ICU/UA source migration
        if: inputs.resume_migration == 'mac157-arm64-stage5'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac157-arm64-stage5' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 stage1 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage1'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage1' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage8' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel continuation
        if: inputs.resume_migration == 'mac156-x64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage8' >> "$GITHUB_ENV"

      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /usr/lib/jvm \
            /usr/local/share/boost /usr/share/swift \
            /usr/lib/dotnet /usr/lib/google-cloud-sdk
          sudo docker system prune -af || true
          df -h

      # Match Chromium's install-build-deps; Go is pinned by setup-go below.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            apparmor-utils bison clang clang-format cmake curl flex g++ git gperf \
            libasound2-dev libatk1.0-dev libcups2-dev libdrm-dev libegl1-mesa-dev \
            libevent-dev libflac-dev libgbm-dev libglib2.0-dev libgtk-3-dev \
            libjpeg-dev libnss3-dev libopus-dev libpam0g-dev libpci-dev \
            libpipewire-0.3-dev libpulse-dev libspeechd-dev libudev-dev \
            libva-dev libvpx-dev libwebp-dev libx11-xcb-dev libxcb-dri3-dev \
            libxshmfence-dev libxslt1-dev libxss-dev libxtst-dev mesa-common-dev \
            ninja-build pkg-config python3-jinja2 python3-pyparsing \
            python3-setuptools python3-six rsync uuid-dev xz-utils yasm zip unzip \
            zstd patch file

      - name: Install restored-build Ninja v6
        if: runner.os == 'Linux' && inputs.use_upstream_cache
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              NINJA_ARCHIVE=ninja-linux.zip
              NINJA_SHA256=6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255 ;;
            aarch64)
              NINJA_ARCHIVE=ninja-linux-aarch64.zip
              NINJA_SHA256=5c25c6570b0155e95fce5918cb95f1ad9870df5768653afe128db822301a05a1 ;;
            *) exit 1 ;;
          esac
          NINJA_DIR="$(mktemp -d "${RUNNER_TEMP}/chromix-ninja-v6.XXXXXX")"
          curl --fail --location --retry 3 --max-time 120 --max-filesize 2097152 \
            "https://github.com/ninja-build/ninja/releases/download/v1.12.1/${NINJA_ARCHIVE}" \
            -o "${NINJA_DIR}/ninja.zip"
          printf '%s  %s\n' "$NINJA_SHA256" "${NINJA_DIR}/ninja.zip" | sha256sum --check --strict
          unzip -q "${NINJA_DIR}/ninja.zip" ninja -d "$NINJA_DIR"
          rm "${NINJA_DIR}/ninja.zip"
          chmod +x "${NINJA_DIR}/ninja"
          test "$("${NINJA_DIR}/ninja" --version)" = 1.12.1
          printf '%s\n' "$NINJA_DIR" >> "$GITHUB_PATH"
      - name: Select compatible Xcode
        if: runner.os == 'macOS'
        run: bash build/macos/select-xcode.sh

      - name: Free macOS disk space
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          python3 build/macos/free-disk-space.py 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/disk-cleanup.log"

      - name: Inspect macOS toolchain
        if: runner.os == 'macOS'
        run: |
          {
            sw_vers
            xcode-select -p
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-path
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/xcode.log"

      - name: Disable Spotlight indexing
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          volume=/System/Volumes/Data
          for attempt in 1 2 3; do
            if sudo mdutil -i off "$volume"; then
              echo "Requested indexing disable on $volume"
            fi
            if status=$(sudo mdutil -s "$volume"); then
              printf '%s\n' "$status"
              if printf '%s\n' "$status" | grep -Eq '^[[:space:]]*Indexing( and searching)? disabled\.[[:space:]]*$'; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo "::error::Unable to verify Spotlight indexing is disabled on $volume"
          exit 1

      # Chromium supplies clang; Homebrew supplies the remaining build tools.
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja coreutils gpatch zstd
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify Go version
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve platform Chromium version
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          CHROMIUM_VERSION="$(python3 tools/platform_pins.py --platform "$BUILD_PLATFORM" --field ChromiumVersion)"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> "$GITHUB_ENV"
      - name: Verify complete Mac SDK contents
        if: runner.os == 'macOS' && inputs.use_upstream_cache
        run: python3 tools/inspect_macos_sdk.py --report "${RUNNER_TEMP}/chromix-logs/sdk-content.json"
      - name: Guard exact Linux157 compiled locale recovery
        if: inputs.linux157_locale_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:x64:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}' = false:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64

      - name: Guard exact Linux157 post-GN recovery request
        if: inputs.linux157_post_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}' = false
          test '${{ inputs.linux157_locale_recovery }}' = false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Guard exact Linux157 pre-GN recovery request
        if: inputs.linux157_pre_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Validate exact Linux157 fresh source route
        if: inputs.platform == 'linux' && env.CHROMIUM_VERSION == '157.0.8103.78'
        env:
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
        run: |
          set -euo pipefail
          case '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' in
            true:false:false|false:true:false|false:false:true) ;;
            *) echo 'Select exactly one reviewed Linux157 recovery route' >&2; exit 1 ;;
          esac
          test '${{ inputs.resume_migration }}' = ''
          test '${{ inputs.resume_run_id }}' = ''
          test "$(uname -m)" = x86_64
          python3 tools/linux157_source.py --phase route --arch '${{ inputs.arch }}' \
            > "${RUNNER_TEMP}/chromix-logs/linux157-recipe.json"

      - name: Restore latest compiled Linux157 locale checkpoint
        if: inputs.linux157_locale_recovery
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN || github.token }}
          CHROMIX_USE_UPSTREAM_CACHE: '0'
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          test ! -e "$WORK"
          test ! -L "$WORK"
          python3 tools/linux157_locale.py --phase restore --arch x64 --workdir "$WORK" \
            > "${RUNNER_TEMP}/chromix-logs/linux157-locale-admission.json"
          python3 tools/linux157_source.py --phase checkpoint --arch x64 --workdir "$WORK" \
            > "${RUNNER_TEMP}/chromix-logs/linux157-locale-source.json"
          python3 tools/verify_linux157_upload.py --workdir "$WORK" --arch x64 \
            > "${RUNNER_TEMP}/chromix-logs/linux157-locale-upload-admission.json"

      - name: Restore exact Linux157 latest post-GN checkpoint
        if: inputs.linux157_post_gn_recovery
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN || github.token }}
          CHROMIX_USE_UPSTREAM_CACHE: '0'
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          test ! -e "$WORK"
          test ! -L "$WORK"
          python3 tools/linux157_postgn.py --phase restore --arch '${{ inputs.arch }}' --workdir "$WORK" \
            > "${RUNNER_TEMP}/chromix-logs/linux157-postgn-admission.json"
          python3 tools/linux157_source.py --phase checkpoint --arch '${{ inputs.arch }}' --workdir "$WORK" \
            > "${RUNNER_TEMP}/chromix-logs/linux157-postgn-source.json"
          PROOF="$WORK/fingerprint-diagnostics/source-after-postgn-admission.json"
          python3 tools/verify_patch_stack.py --src "$WORK/src" --repo "$GITHUB_WORKSPACE" \
            --core "$WORK/tooling/ungoogled-chromium" \
            --platform-tooling "$WORK/tooling/ungoogled-chromium-portablelinux" \
            --platform linux --output "$PROOF"
          cp "$PROOF" "$WORK/fingerprint-diagnostics/source-final.json"
          python3 tools/verify_linux157_upload.py --workdir "$WORK" --arch '${{ inputs.arch }}' \
            > "${RUNNER_TEMP}/chromix-logs/linux157-postgn-upload-admission.json"

      - name: Restore exact Linux157 prepared stage1 checkpoint
        if: inputs.linux157_pre_gn_recovery
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN || github.token }}
          CHROMIX_USE_UPSTREAM_CACHE: '0'
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          test ! -e "$WORK"
          test ! -L "$WORK"
          python3 tools/linux157_checkpoint.py --phase restore --arch '${{ inputs.arch }}' --workdir "$WORK" \
            > "${RUNNER_TEMP}/chromix-logs/linux157-pre-gn-admission.json"
          python3 tools/linux157_source.py --phase checkpoint --arch '${{ inputs.arch }}' --workdir "$WORK" \
            > "${RUNNER_TEMP}/chromix-logs/linux157-pre-gn-source.json"
          python3 - "$WORK" '${{ inputs.arch }}' <<'PY'
          from pathlib import Path
          import sys
          from tools.linux157_checkpoint import prepare_args, verify_migrated
          work, arch = Path(sys.argv[1]), sys.argv[2]
          verify_migrated(work, arch)
          prepare_args(work, arch)
          PY
          PROOF="$WORK/fingerprint-diagnostics/source-after-pre-gn-admission.json"
          python3 tools/verify_patch_stack.py --src "$WORK/src" --repo "$GITHUB_WORKSPACE" \
            --core "$WORK/tooling/ungoogled-chromium" \
            --platform-tooling "$WORK/tooling/ungoogled-chromium-portablelinux" \
            --platform linux --output "$PROOF"
          cp "$PROOF" "$WORK/fingerprint-diagnostics/source-final.json"

      - name: Validate selected POSIX checkpoint
        id: resume
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SNAPSHOT_RUN_ID: ${{ inputs.resume_run_id }}
          SNAPSHOT_STAGE: ${{ inputs.resume_tree_stage }}
          SNAPSHOT_ATTEMPT: ${{ inputs.resume_attempt }}
          SNAPSHOT_ARTIFACT_IDS: ${{ inputs.resume_artifact_ids }}
          BUILD_PLATFORM: ${{ inputs.platform }}
          BUILD_PROFILE: ${{ inputs.build_profile }}
          CACHE_REQUIRED: ${{ inputs.use_upstream_cache }}
          RECOVERY_BRANCH: ${{ github.ref_name }}
          RECOVERY_EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$CACHE_REQUIRED" = true
          if [ "$BUILD_PLATFORM" = linux ] && [ '${{ inputs.arch }}' = x64 ] &&
             [ "$RECOVERY_EVENT" = workflow_dispatch ] &&
             [ "$SNAPSHOT_RUN_ID" = 38149695142 ] && [ "$SNAPSHOT_STAGE" = 2 ] &&
             [ "$SNAPSHOT_ATTEMPT" = 1 ] && [ "$SNAPSHOT_ARTIFACT_IDS" = 11718904327 ] &&
             [ "$RECOVERY_BRANCH" = build/linux155-stage2-controller-link ]; then
            RECOVERY_BRANCH=build/chromium155-donors-20261011
          elif [ "$BUILD_PLATFORM" = linux ] && [ '${{ inputs.arch }}' = x64 ] &&
               [ "$RECOVERY_EVENT" = workflow_dispatch ] &&
               [ "$SNAPSHOT_RUN_ID" = 38204495350 ] && [ "$SNAPSHOT_STAGE" = 1 ] &&
               [ "$SNAPSHOT_ATTEMPT" = 1 ] && [ "$SNAPSHOT_ARTIFACT_IDS" = 11733517946 ] &&
               [ "$RECOVERY_BRANCH" = build/linux155-compiled-png-recovery ]; then
            RECOVERY_BRANCH=build/linux155-stage2-controller-link
          elif [ "$BUILD_PLATFORM" = linux ] && [ '${{ inputs.arch }}' = arm64 ] &&
               [ "$RECOVERY_EVENT" = workflow_dispatch ] && [ "${BUILD_PROFILE:-}" = fast ] &&
               [ "$SNAPSHOT_RUN_ID" = 38147746377 ] && [ "$SNAPSHOT_STAGE" = 4 ] &&
               [ "$SNAPSHOT_ATTEMPT" = 1 ] && [ "$SNAPSHOT_ARTIFACT_IDS" = 11734746823 ] &&
               [ "$RECOVERY_BRANCH" = build/linux155-arm64-stage4-recovery ]; then
            RECOVERY_BRANCH=build/chromium155-donors-20261011
          fi
          if [ '${{ inputs.resume_migration }}' = mac156-x64-stage3 ]; then
            python3 tools/validate_macos156_x64_stage3_checkpoint.py --mode metadata \
              --report "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json"
          elif [ '${{ inputs.resume_migration }}' = mac156-x64-stage2 ]; then
            python3 tools/validate_macos156_x64_stage2_checkpoint.py --mode metadata \
              --report "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json"
          elif [ '${{ inputs.resume_migration }}' = mac157-arm64-stage5 ]; then
            python3 tools/migrate_macos157_arm64_stage5.py --mode metadata \
              --report "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json"
          elif [ '${{ inputs.resume_migration }}' = mac156-arm64-stage1 ]; then
            python3 tools/validate_macos156_arm64_stage1_checkpoint.py --mode metadata \
              --report "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json"
          elif [ '${{ inputs.resume_migration }}' = mac156-arm64-stage8 ]; then
            python3 tools/validate_macos156_arm64_stage8_checkpoint.py --mode metadata \
              --report "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json"
          elif [ '${{ inputs.resume_migration }}' = mac156-x64-stage8 ]; then
            python3 tools/validate_macos156_x64_stage8_checkpoint.py --mode metadata \
              --report "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json"
          elif [ '${{ inputs.resume_migration }}' = linux156-ts ]; then
            test "$BUILD_PLATFORM" = linux
            test "$BUILD_PROFILE" = fast
            test "$SNAPSHOT_STAGE" = 1
            test "$SNAPSHOT_ATTEMPT" = 1
            if [ '${{ inputs.arch }}' = x64 ]; then
              test "$SNAPSHOT_RUN_ID:$SNAPSHOT_ARTIFACT_IDS" = 42457985068:13608199661
            else
              test "$SNAPSHOT_RUN_ID:$SNAPSHOT_ARTIFACT_IDS" = 42457987604:13609217709
            fi
            python3 tools/validate_linux156_ts_checkpoint.py --arch '${{ inputs.arch }}' \
              --report "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json"
          else
            test -z '${{ inputs.resume_migration }}'
            python3 tools/validate_posix_snapshot.py --platform "$BUILD_PLATFORM" --arch '${{ inputs.arch }}' \
              --recovery-branch "$RECOVERY_BRANCH" \
              --report "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json"
          fi
      - name: Check out checkpoint patch definitions
        if: inputs.resume_run_id != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resume.outputs.head_sha }}
          path: .chromix-previous-repo
          persist-credentials: false
      - name: Download selected POSIX checkpoint
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/download_posix_snapshot.py \
            --manifest "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json" \
            --destination "${RUNNER_TEMP}/chromix-restore" \
            --report "${RUNNER_TEMP}/chromix-logs/snapshot-download.json"
      - name: Restore and migrate selected POSIX checkpoint
        if: inputs.resume_run_id != ''
        run: |
          set -euo pipefail
          RESTORE="${RUNNER_TEMP}/chromix-restore"
          WORK="${RUNNER_TEMP}/chromix-build"
          test ! -e "$WORK/src"
          bash build/posix/restore-snapshot.sh "$RESTORE" "$WORK"
          if [ '${{ inputs.resume_migration }}' = mac156-x64-stage3 ]; then
            python3 tools/validate_macos156_x64_stage3_checkpoint.py --mode admit --workdir "$WORK" \
              --previous-repo "$GITHUB_WORKSPACE/.chromix-previous-repo" --repo "$GITHUB_WORKSPACE" \
              --origin "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json" \
              --download-report "${RUNNER_TEMP}/chromix-logs/snapshot-download.json"
          elif [ '${{ inputs.resume_migration }}' = mac156-x64-stage2 ]; then
            python3 tools/validate_macos156_x64_stage2_checkpoint.py --mode admit --workdir "$WORK" \
              --previous-repo "$GITHUB_WORKSPACE/.chromix-previous-repo" --repo "$GITHUB_WORKSPACE" \
              --origin "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json" \
              --download-report "${RUNNER_TEMP}/chromix-logs/snapshot-download.json"
          elif [ '${{ inputs.resume_migration }}' = mac157-arm64-stage5 ]; then
            python3 tools/migrate_macos157_arm64_stage5.py --mode admit --workdir "$WORK" \
              --previous-repo "$GITHUB_WORKSPACE/.chromix-previous-repo" --repo "$GITHUB_WORKSPACE" \
              --origin "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json" \
              --download-report "${RUNNER_TEMP}/chromix-logs/snapshot-download.json"
          elif [ '${{ inputs.resume_migration }}' = mac156-arm64-stage1 ]; then
            python3 tools/validate_macos156_arm64_stage1_checkpoint.py --mode admit --workdir "$WORK" \
              --previous-repo "$GITHUB_WORKSPACE/.chromix-previous-repo" --repo "$GITHUB_WORKSPACE" \
              --origin "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json" \
              --download-report "${RUNNER_TEMP}/chromix-logs/snapshot-download.json"
          elif [ '${{ inputs.resume_migration }}' = mac156-arm64-stage8 ]; then
            python3 tools/validate_macos156_arm64_stage8_checkpoint.py --mode admit --workdir "$WORK" \
              --previous-repo "$GITHUB_WORKSPACE/.chromix-previous-repo" --repo "$GITHUB_WORKSPACE" \
              --origin "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json" \
              --download-report "${RUNNER_TEMP}/chromix-logs/snapshot-download.json"
          elif [ '${{ inputs.resume_migration }}' = mac156-x64-stage8 ]; then
            python3 tools/validate_macos156_x64_stage8_checkpoint.py --mode admit --workdir "$WORK" \
              --previous-repo "$GITHUB_WORKSPACE/.chromix-previous-repo" --repo "$GITHUB_WORKSPACE" \
              --origin "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json" \
              --download-report "${RUNNER_TEMP}/chromix-logs/snapshot-download.json"
          elif [ '${{ inputs.resume_migration }}' = linux156-ts ]; then
            python3 tools/migrate_linux156_ts_snapshot.py --workdir "$WORK" \
              --previous-repo "$GITHUB_WORKSPACE/.chromix-previous-repo" --repo "$GITHUB_WORKSPACE" \
              --arch '${{ inputs.arch }}' --origin "${RUNNER_TEMP}/chromix-logs/snapshot-origin.json" \
              --download-report "${RUNNER_TEMP}/chromix-logs/snapshot-download.json" \
              2>&1 | tee "${RUNNER_TEMP}/chromix-logs/snapshot-migration.log"
          else
            test -z '${{ inputs.resume_migration }}'
            python3 tools/migrate_restored_snapshot.py --workdir "$WORK" \
              --previous-repo "$GITHUB_WORKSPACE/.chromix-previous-repo" \
              --repo "$GITHUB_WORKSPACE" --platform '${{ inputs.platform }}' --arch '${{ inputs.arch }}' \
              2>&1 | tee "${RUNNER_TEMP}/chromix-logs/snapshot-migration.log"
          fi
      # The pinned download cache is deliberately outside the tree snapshot;
      # re-warm it first so a resumed preparation does not redownload archives.
      - name: Restore pinned source downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/chromix-build/download_cache
          key: ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-${{ env.CHROMIUM_VERSION }}-${{ hashFiles('CHROMIUM_VERSION', 'CHROMIUM_LINUX_VERSION', 'CHROMIUM_MACOS_VERSION', 'build/ungoogled-revisions.psd1', 'tools/platform_pins.py', 'build/prepare-ungoogled.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-
      - name: Select compile parallelism
        run: python3 tools/build_resources.py --github-env

      - name: Run stage 1
        id: stage
        env:
          CHROMIX_BUILD_PROFILE: ${{ inputs.build_profile }}
          CHROMIX_LINUX157_PRE_GN_RECOVERY: ${{ inputs.linux157_pre_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_POST_GN_RECOVERY: ${{ inputs.linux157_post_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_LOCALE_RECOVERY: ${{ inputs.linux157_locale_recovery && '1' || '0' }}
          CHROMIX_MACOS_COMPILE_RELEASE: ${{ inputs.platform == 'macos' && inputs.macos_compile_release && '1' || '0' }}
          # Mac runtime gates need 45m in addition to packaging/checkpoint reserve.
          CHROMIX_RESERVE_MINUTES: ${{ inputs.platform == 'macos' && '90' || inputs['max-stages'] == 1 && '15' || '45' }}
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
          GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          NOW_EPOCH="$(date +%s)"
          DEADLINE_EPOCH=$(( NOW_EPOCH + 300 * 60 ))
          JOB_DEADLINE_EPOCH=$(( CHROMIX_JOB_START_EPOCH + 330 * 60 ))
          if [ "$DEADLINE_EPOCH" -gt "$JOB_DEADLINE_EPOCH" ]; then
            DEADLINE_EPOCH="$JOB_DEADLINE_EPOCH"
          fi
          if build/posix/ci-stage-mac157-arm64-stage5.sh \
            --platform '${{ inputs.platform }}' --arch '${{ inputs.arch }}' \
            --workdir "${RUNNER_TEMP}/chromix-build" \
            --stage-index 1 --max-stages '${{ inputs['max-stages'] }}' --deadline-epoch "$DEADLINE_EPOCH" \
            2>&1 | tee "${RUNNER_TEMP}/chromix-logs/stage-1.log"; then
            exit 0
          else
            # Capture both statuses before any command overwrites PIPESTATUS.
            codes=("${PIPESTATUS[@]}")
            if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
            exit "${codes[1]}"
          fi
      - name: Upload final bundle (compile-release)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fingerprint source receipt (compile-release)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-fingerprint-source
          path: ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/source-final.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics (compile-release)
        if: ${{ !cancelled() && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-logs-s1-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/chromix-logs/
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-1/
            ${{ runner.temp }}/chromix-build/src/out/Chromix/args.gn
            ${{ runner.temp }}/chromix-build/src/out/Default/args.gn
            ${{ runner.temp }}/chromix-build/src/.chromix-upstream-restored.json
            ${{ runner.temp }}/chromix-build/src/.chromix-restored-patches.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-*.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-in-progress
            ${{ runner.temp }}/chromix-build/linux157-failed.json
            ${{ runner.temp }}/chromix-build/linux157-compiled.json
            ${{ runner.temp }}/chromix-build/linux157-checkpoint-download.json
            ${{ runner.temp }}/chromix-build/linux157-pre-gn-origin/
            ${{ runner.temp }}/chromix-build/linux157-postgn-download.json
            ${{ runner.temp }}/chromix-build/linux157-postgn-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-download.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-locale-migration-in-progress
            ${{ runner.temp }}/chromix-build/upstream-cache-restore.json
            ${{ runner.temp }}/chromix-build/upstream-cache-preparation.json
            ${{ runner.temp }}/chromix-build/upstream-cache-ninja.json
            ${{ runner.temp }}/chromix-build/upstream-cache-import.json
            ${{ runner.temp }}/chromix-build/upstream-cache-plan.log
            ${{ runner.temp }}/chromix-build/upstream-reuse/
            ${{ runner.temp }}/chromix-build/upstream-object-cache.json
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-upstream/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed macOS runtime bundle
        if: ${{ !cancelled() && inputs.platform == 'macos' && steps.stage.outcome == 'failure' && steps.stage.outputs.package_ready == 'true' && steps.stage.outputs.runtime_failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-failed-runtime-s1-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-1/
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-logs/stage-1.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve latest macOS compiled checkpoint
        id: runtime_checkpoint
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        if: ${{ !cancelled() && inputs.platform == 'macos' && (steps.stage.outputs.compiled_ready == 'true' || (inputs.resume_migration == 'mac156-x64-stage8' && failure()) || (inputs.resume_migration == 'mac156-x64-stage2' && failure()) || (inputs.resume_migration == 'mac156-x64-stage3' && failure())) }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          test -d "$WORK/src"
          if { [ '${{ inputs.resume_migration }}' != mac156-x64-stage8 ] &&
               [ '${{ inputs.resume_migration }}' != mac156-x64-stage2 ] &&
               [ '${{ inputs.resume_migration }}' != mac156-x64-stage3 ]; } ||
             [ '${{ steps.stage.outputs.upload_snapshot }}' != true ]; then
            bash build/posix/ci-parts.sh "$WORK" "$WORK/.snapshot-stage-1"
          fi
          echo "upload_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Upload failed Linux runtime bundle
        if: ${{ !cancelled() && inputs.platform == 'linux' && steps.stage.outcome == 'failure' && steps.stage.outputs.package_ready == 'true' && steps.stage.outputs.runtime_failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-failed-runtime-s1-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-logs/stage-1.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve latest failed Linux source/output checkpoint
        id: linux_runtime_checkpoint
        if: ${{ !cancelled() && inputs.platform == 'linux' && steps.stage.outcome == 'failure' }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          python3 - "$WORK" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          work = Path(sys.argv[1])
          if work.is_symlink() or not work.is_dir() or work.resolve() != work:
              raise SystemExit("unsafe Linux checkpoint work directory")
          if (work / "src").is_symlink() or not (work / "src").is_dir():
              raise SystemExit("Linux checkpoint source directory is missing or unsafe")
          # Only redundant copies; retain the bundle, source, objects and caches.
          copies = [work / "smoke", work / "dist/chromix"]
          snapshots = [work / f".snapshot-stage-{stage}" for stage in range(1, 9)]
          for path in [*copies, *snapshots]:
              if path.is_symlink() or path.resolve() != path:
                  raise SystemExit(f"unsafe Linux checkpoint cleanup path: {path}")
          for path in [*copies, *snapshots]:
              if path.is_dir():
                  shutil.rmtree(path)
          PY
          if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
            CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
              --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s1.json"
          else
            python3 tools/verify_linux_checkpoint.py --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s1.json"
          fi
          bash build/posix/ci-parts.sh "$WORK" "$WORK/.snapshot-stage-1"
          echo "upload_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Verify handoff snapshot
        id: checkpoint
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        run: |
          set -euo pipefail
          SNAP="${RUNNER_TEMP}/chromix-build/.snapshot-stage-1"
          UPLOAD_IDENTITY="${RUNNER_TEMP}/chromix-logs/checkpoint-upload-identity-s1.json"
          LINUX157_UPLOAD=0
          if [ '${{ inputs.platform }}' = linux ]; then
            if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "${RUNNER_TEMP}/chromix-logs/checkpoint-upload-source-s1.json"
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/verify_linux157_upload.py \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' > "$UPLOAD_IDENTITY"
              LINUX157_UPLOAD=1
            else
              python3 tools/verify_linux_checkpoint.py --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "$UPLOAD_IDENTITY"
            fi
          fi
          test -d "$SNAP/p1"
          if [ "$LINUX157_UPLOAD" = 1 ]; then
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_linux157_upload.py --archive-report "$UPLOAD_IDENTITY"
          else
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_snapshot_tar.py
          fi

      - name: Upload tree part 1
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s1-attempt-${{ github.run_attempt }}-part1
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-1/p1/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 2
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s1-attempt-${{ github.run_attempt }}-part2
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-1/p2/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 3
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s1-attempt-${{ github.run_attempt }}-part3
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-1/p3/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 4
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s1-attempt-${{ github.run_attempt }}-part4
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-1/p4/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload final bundle
        if: steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy != 'macos-compile-release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: always() && !(inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-logs-s1-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/chromix-logs/
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-1/
            ${{ runner.temp }}/chromix-build/src/out/Chromix/args.gn
            ${{ runner.temp }}/chromix-build/src/out/Default/args.gn
            ${{ runner.temp }}/chromix-build/src/.chromix-upstream-restored.json
            ${{ runner.temp }}/chromix-build/src/.chromix-restored-patches.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-*.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-in-progress
            ${{ runner.temp }}/chromix-build/linux157-failed.json
            ${{ runner.temp }}/chromix-build/linux157-compiled.json
            ${{ runner.temp }}/chromix-build/linux157-checkpoint-download.json
            ${{ runner.temp }}/chromix-build/linux157-pre-gn-origin/
            ${{ runner.temp }}/chromix-build/linux157-postgn-download.json
            ${{ runner.temp }}/chromix-build/linux157-postgn-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-download.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-locale-migration-in-progress
            ${{ runner.temp }}/chromix-build/upstream-cache-restore.json
            ${{ runner.temp }}/chromix-build/upstream-cache-preparation.json
            ${{ runner.temp }}/chromix-build/upstream-cache-ninja.json
            ${{ runner.temp }}/chromix-build/upstream-cache-import.json
            ${{ runner.temp }}/chromix-build/upstream-cache-plan.log
            ${{ runner.temp }}/chromix-build/upstream-reuse/
            ${{ runner.temp }}/chromix-build/upstream-object-cache.json
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-upstream/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload fingerprint source receipt
        if: steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy != 'macos-compile-release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-fingerprint-source
          path: ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/source-final.json
          if-no-files-found: error
          retention-days: 14

  posix-2:
    name: ${{ inputs.platform }}-${{ inputs.arch }} stage 2 (resume compile)
    needs: posix-1
    if: >-
      always() && inputs['max-stages'] >= 2 &&
      needs.posix-1.result == 'success' &&
      needs.posix-1.outputs.finished != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      snapshot_attempt: ${{ steps.snapshot_origin.outputs.attempt }}
    steps:
      - name: Record runner resources
        run: |
          set -euo pipefail
          echo "CHROMIX_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/chromix-logs"
          {
            uname -a
            case "$(uname -s)" in
              Linux) getconf _NPROCESSORS_ONLN; free -h ;;
              Darwin) sysctl hw.ncpu hw.memsize ;;
            esac
            df -h
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/runner.log"

      - uses: actions/checkout@v4

      - name: Require exact mac157 ARM64 stage5 route
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.runner }}' = macos:arm64:macos-26
          test '${{ inputs.artifact }}:${{ inputs.max-stages }}' = chromix-mac157-arm64-stage5-resume:8
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_tree_stage }}:${{ inputs.resume_attempt }}:${{ inputs.resume_artifact_ids }}' = mac157-arm64-stage5:44567777209:5:1:14626292942
          test '${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}:${{ inputs.macos_compile_release }}' = fast:true:true
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' = false:false:false

      - name: Record snapshot producer attempt
        id: snapshot_origin
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Enable fixed unchanged mac156 Intel stage3 continuation
        if: inputs.resume_migration == 'mac156-x64-stage3'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage3' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel stage2 continuation
        if: inputs.resume_migration == 'mac156-x64-stage2'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage2' >> "$GITHUB_ENV"
      - name: Enable fixed mac157 ICU/UA source migration
        if: inputs.resume_migration == 'mac157-arm64-stage5'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac157-arm64-stage5' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 stage1 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage1'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage1' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage8' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel continuation
        if: inputs.resume_migration == 'mac156-x64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage8' >> "$GITHUB_ENV"

      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /usr/lib/jvm \
            /usr/local/share/boost /usr/share/swift \
            /usr/lib/dotnet /usr/lib/google-cloud-sdk
          sudo docker system prune -af || true
          df -h

      # Match Chromium's install-build-deps; Go is pinned by setup-go below.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            apparmor-utils bison clang clang-format cmake curl flex g++ git gperf \
            libasound2-dev libatk1.0-dev libcups2-dev libdrm-dev libegl1-mesa-dev \
            libevent-dev libflac-dev libgbm-dev libglib2.0-dev libgtk-3-dev \
            libjpeg-dev libnss3-dev libopus-dev libpam0g-dev libpci-dev \
            libpipewire-0.3-dev libpulse-dev libspeechd-dev libudev-dev \
            libva-dev libvpx-dev libwebp-dev libx11-xcb-dev libxcb-dri3-dev \
            libxshmfence-dev libxslt1-dev libxss-dev libxtst-dev mesa-common-dev \
            ninja-build pkg-config python3-jinja2 python3-pyparsing \
            python3-setuptools python3-six rsync uuid-dev xz-utils yasm zip unzip \
            zstd patch file

      - name: Install restored-build Ninja v6
        if: runner.os == 'Linux' && inputs.use_upstream_cache
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              NINJA_ARCHIVE=ninja-linux.zip
              NINJA_SHA256=6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255 ;;
            aarch64)
              NINJA_ARCHIVE=ninja-linux-aarch64.zip
              NINJA_SHA256=5c25c6570b0155e95fce5918cb95f1ad9870df5768653afe128db822301a05a1 ;;
            *) exit 1 ;;
          esac
          NINJA_DIR="$(mktemp -d "${RUNNER_TEMP}/chromix-ninja-v6.XXXXXX")"
          curl --fail --location --retry 3 --max-time 120 --max-filesize 2097152 \
            "https://github.com/ninja-build/ninja/releases/download/v1.12.1/${NINJA_ARCHIVE}" \
            -o "${NINJA_DIR}/ninja.zip"
          printf '%s  %s\n' "$NINJA_SHA256" "${NINJA_DIR}/ninja.zip" | sha256sum --check --strict
          unzip -q "${NINJA_DIR}/ninja.zip" ninja -d "$NINJA_DIR"
          rm "${NINJA_DIR}/ninja.zip"
          chmod +x "${NINJA_DIR}/ninja"
          test "$("${NINJA_DIR}/ninja" --version)" = 1.12.1
          printf '%s\n' "$NINJA_DIR" >> "$GITHUB_PATH"
      - name: Select compatible Xcode
        if: runner.os == 'macOS'
        run: bash build/macos/select-xcode.sh

      - name: Free macOS disk space
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          python3 build/macos/free-disk-space.py 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/disk-cleanup.log"

      - name: Inspect macOS toolchain
        if: runner.os == 'macOS'
        run: |
          {
            sw_vers
            xcode-select -p
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-path
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/xcode.log"

      - name: Disable Spotlight indexing
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          volume=/System/Volumes/Data
          for attempt in 1 2 3; do
            if sudo mdutil -i off "$volume"; then
              echo "Requested indexing disable on $volume"
            fi
            if status=$(sudo mdutil -s "$volume"); then
              printf '%s\n' "$status"
              if printf '%s\n' "$status" | grep -Eq '^[[:space:]]*Indexing( and searching)? disabled\.[[:space:]]*$'; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo "::error::Unable to verify Spotlight indexing is disabled on $volume"
          exit 1

      # Chromium supplies clang; Homebrew supplies the remaining build tools.
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja coreutils gpatch zstd
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify Go version
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve platform Chromium version
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          CHROMIUM_VERSION="$(python3 tools/platform_pins.py --platform "$BUILD_PLATFORM" --field ChromiumVersion)"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> "$GITHUB_ENV"
      - name: Verify complete Mac SDK contents
        if: runner.os == 'macOS' && inputs.use_upstream_cache
        run: python3 tools/inspect_macos_sdk.py --report "${RUNNER_TEMP}/chromix-logs/sdk-content.json"
      - name: Guard exact Linux157 compiled locale recovery
        if: inputs.linux157_locale_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:x64:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}' = false:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64

      - name: Guard exact Linux157 post-GN recovery request
        if: inputs.linux157_post_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}' = false
          test '${{ inputs.linux157_locale_recovery }}' = false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Guard exact Linux157 pre-GN recovery request
        if: inputs.linux157_pre_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Validate exact Linux157 fresh source route
        if: inputs.platform == 'linux' && env.CHROMIUM_VERSION == '157.0.8103.78'
        env:
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
        run: |
          set -euo pipefail
          case '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' in
            true:false:false|false:true:false|false:false:true) ;;
            *) echo 'Select exactly one reviewed Linux157 recovery route' >&2; exit 1 ;;
          esac
          test '${{ inputs.resume_migration }}' = ''
          test '${{ inputs.resume_run_id }}' = ''
          test "$(uname -m)" = x86_64
          python3 tools/linux157_source.py --phase route --arch '${{ inputs.arch }}' \
            > "${RUNNER_TEMP}/chromix-logs/linux157-recipe.json"

      - name: Record exact mac156 handoff producer attempt
        if: inputs.resume_migration == 'mac157-arm64-stage5' || inputs.resume_migration == 'mac156-x64-stage3' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-x64-stage8'
        env:
          PRODUCER_ATTEMPT: ${{ needs.posix-1.outputs.snapshot_attempt }}
        run: echo "CHROMIX_PREVIOUS_ATTEMPT=$PRODUCER_ATTEMPT" >> "$GITHUB_ENV"
      - name: Download tree from previous stage
        if: success()
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact }}-tree-s1-attempt-${{ needs.posix-1.outputs.snapshot_attempt }}-part*
          merge-multiple: true
          path: ${{ runner.temp }}/chromix-restore

      # The pinned download cache is deliberately outside the tree snapshot;
      # re-warm it first so a resumed preparation does not redownload archives.
      - name: Restore pinned source downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/chromix-build/download_cache
          key: ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-${{ env.CHROMIUM_VERSION }}-${{ hashFiles('CHROMIUM_VERSION', 'CHROMIUM_LINUX_VERSION', 'CHROMIUM_MACOS_VERSION', 'build/ungoogled-revisions.psd1', 'tools/platform_pins.py', 'build/prepare-ungoogled.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-
      - name: Select compile parallelism
        run: python3 tools/build_resources.py --github-env

      - name: Run stage 2
        id: stage
        env:
          CHROMIX_BUILD_PROFILE: ${{ inputs.build_profile }}
          CHROMIX_LINUX157_PRE_GN_RECOVERY: ${{ inputs.linux157_pre_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_POST_GN_RECOVERY: ${{ inputs.linux157_post_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_LOCALE_RECOVERY: ${{ inputs.linux157_locale_recovery && '1' || '0' }}
          CHROMIX_MACOS_COMPILE_RELEASE: ${{ inputs.platform == 'macos' && inputs.macos_compile_release && '1' || '0' }}
          # Mac runtime gates need 45m in addition to packaging/checkpoint reserve.
          CHROMIX_RESERVE_MINUTES: ${{ inputs.platform == 'macos' && '90' || inputs['max-stages'] == 1 && '15' || '45' }}
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
          GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          NOW_EPOCH="$(date +%s)"
          DEADLINE_EPOCH=$(( NOW_EPOCH + 300 * 60 ))
          JOB_DEADLINE_EPOCH=$(( CHROMIX_JOB_START_EPOCH + 330 * 60 ))
          if [ "$DEADLINE_EPOCH" -gt "$JOB_DEADLINE_EPOCH" ]; then
            DEADLINE_EPOCH="$JOB_DEADLINE_EPOCH"
          fi
          if build/posix/ci-stage-mac157-arm64-stage5.sh \
            --platform '${{ inputs.platform }}' --arch '${{ inputs.arch }}' \
            --workdir "${RUNNER_TEMP}/chromix-build" \
            --stage-index 2 --max-stages '${{ inputs['max-stages'] }}' --from-snapshot "${RUNNER_TEMP}/chromix-restore" \
            --deadline-epoch "$DEADLINE_EPOCH" \
            2>&1 | tee "${RUNNER_TEMP}/chromix-logs/stage-2.log"; then
            exit 0
          else
            # Capture both statuses before any command overwrites PIPESTATUS.
            codes=("${PIPESTATUS[@]}")
            if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
            exit "${codes[1]}"
          fi
      - name: Upload final bundle (compile-release)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fingerprint source receipt (compile-release)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-fingerprint-source
          path: ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/source-final.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics (compile-release)
        if: ${{ !cancelled() && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-logs-s2-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/chromix-logs/
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-2/
            ${{ runner.temp }}/chromix-build/src/out/Chromix/args.gn
            ${{ runner.temp }}/chromix-build/src/out/Default/args.gn
            ${{ runner.temp }}/chromix-build/src/.chromix-upstream-restored.json
            ${{ runner.temp }}/chromix-build/src/.chromix-restored-patches.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-*.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-in-progress
            ${{ runner.temp }}/chromix-build/linux157-failed.json
            ${{ runner.temp }}/chromix-build/linux157-compiled.json
            ${{ runner.temp }}/chromix-build/linux157-checkpoint-download.json
            ${{ runner.temp }}/chromix-build/linux157-pre-gn-origin/
            ${{ runner.temp }}/chromix-build/linux157-postgn-download.json
            ${{ runner.temp }}/chromix-build/linux157-postgn-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-download.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-locale-migration-in-progress
            ${{ runner.temp }}/chromix-build/upstream-cache-restore.json
            ${{ runner.temp }}/chromix-build/upstream-cache-preparation.json
            ${{ runner.temp }}/chromix-build/upstream-cache-ninja.json
            ${{ runner.temp }}/chromix-build/upstream-cache-import.json
            ${{ runner.temp }}/chromix-build/upstream-cache-plan.log
            ${{ runner.temp }}/chromix-build/upstream-reuse/
            ${{ runner.temp }}/chromix-build/upstream-object-cache.json
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-upstream/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed macOS runtime bundle
        if: ${{ !cancelled() && inputs.platform == 'macos' && steps.stage.outcome == 'failure' && steps.stage.outputs.package_ready == 'true' && steps.stage.outputs.runtime_failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-failed-runtime-s2-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-2/
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-logs/stage-2.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve latest macOS compiled checkpoint
        id: runtime_checkpoint
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        if: ${{ !cancelled() && inputs.platform == 'macos' && (steps.stage.outputs.compiled_ready == 'true' || (inputs.resume_migration == 'mac156-x64-stage8' && failure()) || (inputs.resume_migration == 'mac156-x64-stage2' && failure()) || (inputs.resume_migration == 'mac156-x64-stage3' && failure())) }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          test -d "$WORK/src"
          if { [ '${{ inputs.resume_migration }}' != mac156-x64-stage8 ] &&
               [ '${{ inputs.resume_migration }}' != mac156-x64-stage2 ] &&
               [ '${{ inputs.resume_migration }}' != mac156-x64-stage3 ]; } ||
             [ '${{ steps.stage.outputs.upload_snapshot }}' != true ]; then
            bash build/posix/ci-parts.sh "$WORK" "$WORK/.snapshot-stage-2"
          fi
          echo "upload_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Upload failed Linux runtime bundle
        if: ${{ !cancelled() && inputs.platform == 'linux' && steps.stage.outcome == 'failure' && steps.stage.outputs.package_ready == 'true' && steps.stage.outputs.runtime_failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-failed-runtime-s2-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-logs/stage-2.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve latest failed Linux source/output checkpoint
        id: linux_runtime_checkpoint
        if: ${{ !cancelled() && inputs.platform == 'linux' && steps.stage.outcome == 'failure' }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          python3 - "$WORK" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          work = Path(sys.argv[1])
          if work.is_symlink() or not work.is_dir() or work.resolve() != work:
              raise SystemExit("unsafe Linux checkpoint work directory")
          if (work / "src").is_symlink() or not (work / "src").is_dir():
              raise SystemExit("Linux checkpoint source directory is missing or unsafe")
          # Only redundant copies; retain the bundle, source, objects and caches.
          copies = [work / "smoke", work / "dist/chromix"]
          snapshots = [work / f".snapshot-stage-{stage}" for stage in range(1, 9)]
          for path in [*copies, *snapshots]:
              if path.is_symlink() or path.resolve() != path:
                  raise SystemExit(f"unsafe Linux checkpoint cleanup path: {path}")
          for path in [*copies, *snapshots]:
              if path.is_dir():
                  shutil.rmtree(path)
          PY
          if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
            CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
              --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s2.json"
          else
            python3 tools/verify_linux_checkpoint.py --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s2.json"
          fi
          bash build/posix/ci-parts.sh "$WORK" "$WORK/.snapshot-stage-2"
          echo "upload_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Verify handoff snapshot
        id: checkpoint
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        run: |
          set -euo pipefail
          SNAP="${RUNNER_TEMP}/chromix-build/.snapshot-stage-2"
          UPLOAD_IDENTITY="${RUNNER_TEMP}/chromix-logs/checkpoint-upload-identity-s2.json"
          LINUX157_UPLOAD=0
          if [ '${{ inputs.platform }}' = linux ]; then
            if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "${RUNNER_TEMP}/chromix-logs/checkpoint-upload-source-s2.json"
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/verify_linux157_upload.py \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' > "$UPLOAD_IDENTITY"
              LINUX157_UPLOAD=1
            else
              python3 tools/verify_linux_checkpoint.py --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "$UPLOAD_IDENTITY"
            fi
          fi
          test -d "$SNAP/p1"
          if [ "$LINUX157_UPLOAD" = 1 ]; then
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_linux157_upload.py --archive-report "$UPLOAD_IDENTITY"
          else
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_snapshot_tar.py
          fi

      - name: Upload tree part 1
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s2-attempt-${{ github.run_attempt }}-part1
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-2/p1/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 2
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s2-attempt-${{ github.run_attempt }}-part2
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-2/p2/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 3
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s2-attempt-${{ github.run_attempt }}-part3
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-2/p3/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 4
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s2-attempt-${{ github.run_attempt }}-part4
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-2/p4/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload final bundle
        if: steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy != 'macos-compile-release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: always() && !(inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-logs-s2-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/chromix-logs/
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-2/
            ${{ runner.temp }}/chromix-build/src/out/Chromix/args.gn
            ${{ runner.temp }}/chromix-build/src/out/Default/args.gn
            ${{ runner.temp }}/chromix-build/src/.chromix-upstream-restored.json
            ${{ runner.temp }}/chromix-build/src/.chromix-restored-patches.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-*.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-in-progress
            ${{ runner.temp }}/chromix-build/linux157-failed.json
            ${{ runner.temp }}/chromix-build/linux157-compiled.json
            ${{ runner.temp }}/chromix-build/linux157-checkpoint-download.json
            ${{ runner.temp }}/chromix-build/linux157-pre-gn-origin/
            ${{ runner.temp }}/chromix-build/linux157-postgn-download.json
            ${{ runner.temp }}/chromix-build/linux157-postgn-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-download.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-locale-migration-in-progress
            ${{ runner.temp }}/chromix-build/upstream-cache-restore.json
            ${{ runner.temp }}/chromix-build/upstream-cache-preparation.json
            ${{ runner.temp }}/chromix-build/upstream-cache-ninja.json
            ${{ runner.temp }}/chromix-build/upstream-cache-import.json
            ${{ runner.temp }}/chromix-build/upstream-cache-plan.log
            ${{ runner.temp }}/chromix-build/upstream-reuse/
            ${{ runner.temp }}/chromix-build/upstream-object-cache.json
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-upstream/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload fingerprint source receipt
        if: steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy != 'macos-compile-release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-fingerprint-source
          path: ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/source-final.json
          if-no-files-found: error
          retention-days: 14

  posix-3:
    name: ${{ inputs.platform }}-${{ inputs.arch }} stage 3 (resume compile)
    needs: posix-2
    if: >-
      always() && inputs['max-stages'] >= 3 &&
      needs.posix-2.result == 'success' &&
      needs.posix-2.outputs.finished != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      snapshot_attempt: ${{ steps.snapshot_origin.outputs.attempt }}
    steps:
      - name: Record runner resources
        run: |
          set -euo pipefail
          echo "CHROMIX_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/chromix-logs"
          {
            uname -a
            case "$(uname -s)" in
              Linux) getconf _NPROCESSORS_ONLN; free -h ;;
              Darwin) sysctl hw.ncpu hw.memsize ;;
            esac
            df -h
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/runner.log"

      - uses: actions/checkout@v4

      - name: Require exact mac157 ARM64 stage5 route
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.runner }}' = macos:arm64:macos-26
          test '${{ inputs.artifact }}:${{ inputs.max-stages }}' = chromix-mac157-arm64-stage5-resume:8
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_tree_stage }}:${{ inputs.resume_attempt }}:${{ inputs.resume_artifact_ids }}' = mac157-arm64-stage5:44567777209:5:1:14626292942
          test '${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}:${{ inputs.macos_compile_release }}' = fast:true:true
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' = false:false:false

      - name: Record snapshot producer attempt
        id: snapshot_origin
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Enable fixed unchanged mac156 Intel stage3 continuation
        if: inputs.resume_migration == 'mac156-x64-stage3'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage3' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel stage2 continuation
        if: inputs.resume_migration == 'mac156-x64-stage2'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage2' >> "$GITHUB_ENV"
      - name: Enable fixed mac157 ICU/UA source migration
        if: inputs.resume_migration == 'mac157-arm64-stage5'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac157-arm64-stage5' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 stage1 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage1'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage1' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage8' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel continuation
        if: inputs.resume_migration == 'mac156-x64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage8' >> "$GITHUB_ENV"

      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /usr/lib/jvm \
            /usr/local/share/boost /usr/share/swift \
            /usr/lib/dotnet /usr/lib/google-cloud-sdk
          sudo docker system prune -af || true
          df -h

      # Match Chromium's install-build-deps; Go is pinned by setup-go below.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            apparmor-utils bison clang clang-format cmake curl flex g++ git gperf \
            libasound2-dev libatk1.0-dev libcups2-dev libdrm-dev libegl1-mesa-dev \
            libevent-dev libflac-dev libgbm-dev libglib2.0-dev libgtk-3-dev \
            libjpeg-dev libnss3-dev libopus-dev libpam0g-dev libpci-dev \
            libpipewire-0.3-dev libpulse-dev libspeechd-dev libudev-dev \
            libva-dev libvpx-dev libwebp-dev libx11-xcb-dev libxcb-dri3-dev \
            libxshmfence-dev libxslt1-dev libxss-dev libxtst-dev mesa-common-dev \
            ninja-build pkg-config python3-jinja2 python3-pyparsing \
            python3-setuptools python3-six rsync uuid-dev xz-utils yasm zip unzip \
            zstd patch file

      - name: Install restored-build Ninja v6
        if: runner.os == 'Linux' && inputs.use_upstream_cache
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              NINJA_ARCHIVE=ninja-linux.zip
              NINJA_SHA256=6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255 ;;
            aarch64)
              NINJA_ARCHIVE=ninja-linux-aarch64.zip
              NINJA_SHA256=5c25c6570b0155e95fce5918cb95f1ad9870df5768653afe128db822301a05a1 ;;
            *) exit 1 ;;
          esac
          NINJA_DIR="$(mktemp -d "${RUNNER_TEMP}/chromix-ninja-v6.XXXXXX")"
          curl --fail --location --retry 3 --max-time 120 --max-filesize 2097152 \
            "https://github.com/ninja-build/ninja/releases/download/v1.12.1/${NINJA_ARCHIVE}" \
            -o "${NINJA_DIR}/ninja.zip"
          printf '%s  %s\n' "$NINJA_SHA256" "${NINJA_DIR}/ninja.zip" | sha256sum --check --strict
          unzip -q "${NINJA_DIR}/ninja.zip" ninja -d "$NINJA_DIR"
          rm "${NINJA_DIR}/ninja.zip"
          chmod +x "${NINJA_DIR}/ninja"
          test "$("${NINJA_DIR}/ninja" --version)" = 1.12.1
          printf '%s\n' "$NINJA_DIR" >> "$GITHUB_PATH"
      - name: Select compatible Xcode
        if: runner.os == 'macOS'
        run: bash build/macos/select-xcode.sh

      - name: Free macOS disk space
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          python3 build/macos/free-disk-space.py 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/disk-cleanup.log"

      - name: Inspect macOS toolchain
        if: runner.os == 'macOS'
        run: |
          {
            sw_vers
            xcode-select -p
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-path
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/xcode.log"

      - name: Disable Spotlight indexing
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          volume=/System/Volumes/Data
          for attempt in 1 2 3; do
            if sudo mdutil -i off "$volume"; then
              echo "Requested indexing disable on $volume"
            fi
            if status=$(sudo mdutil -s "$volume"); then
              printf '%s\n' "$status"
              if printf '%s\n' "$status" | grep -Eq '^[[:space:]]*Indexing( and searching)? disabled\.[[:space:]]*$'; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo "::error::Unable to verify Spotlight indexing is disabled on $volume"
          exit 1

      # Chromium supplies clang; Homebrew supplies the remaining build tools.
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja coreutils gpatch zstd
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify Go version
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve platform Chromium version
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          CHROMIUM_VERSION="$(python3 tools/platform_pins.py --platform "$BUILD_PLATFORM" --field ChromiumVersion)"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> "$GITHUB_ENV"
      - name: Verify complete Mac SDK contents
        if: runner.os == 'macOS' && inputs.use_upstream_cache
        run: python3 tools/inspect_macos_sdk.py --report "${RUNNER_TEMP}/chromix-logs/sdk-content.json"
      - name: Guard exact Linux157 compiled locale recovery
        if: inputs.linux157_locale_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:x64:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}' = false:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64

      - name: Guard exact Linux157 post-GN recovery request
        if: inputs.linux157_post_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}' = false
          test '${{ inputs.linux157_locale_recovery }}' = false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Guard exact Linux157 pre-GN recovery request
        if: inputs.linux157_pre_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Validate exact Linux157 fresh source route
        if: inputs.platform == 'linux' && env.CHROMIUM_VERSION == '157.0.8103.78'
        env:
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
        run: |
          set -euo pipefail
          case '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' in
            true:false:false|false:true:false|false:false:true) ;;
            *) echo 'Select exactly one reviewed Linux157 recovery route' >&2; exit 1 ;;
          esac
          test '${{ inputs.resume_migration }}' = ''
          test '${{ inputs.resume_run_id }}' = ''
          test "$(uname -m)" = x86_64
          python3 tools/linux157_source.py --phase route --arch '${{ inputs.arch }}' \
            > "${RUNNER_TEMP}/chromix-logs/linux157-recipe.json"

      - name: Record exact mac156 handoff producer attempt
        if: inputs.resume_migration == 'mac157-arm64-stage5' || inputs.resume_migration == 'mac156-x64-stage3' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-x64-stage8'
        env:
          PRODUCER_ATTEMPT: ${{ needs.posix-2.outputs.snapshot_attempt }}
        run: echo "CHROMIX_PREVIOUS_ATTEMPT=$PRODUCER_ATTEMPT" >> "$GITHUB_ENV"
      - name: Download tree from previous stage
        if: success()
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact }}-tree-s2-attempt-${{ needs.posix-2.outputs.snapshot_attempt }}-part*
          merge-multiple: true
          path: ${{ runner.temp }}/chromix-restore

      # The pinned download cache is deliberately outside the tree snapshot;
      # re-warm it first so a resumed preparation does not redownload archives.
      - name: Restore pinned source downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/chromix-build/download_cache
          key: ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-${{ env.CHROMIUM_VERSION }}-${{ hashFiles('CHROMIUM_VERSION', 'CHROMIUM_LINUX_VERSION', 'CHROMIUM_MACOS_VERSION', 'build/ungoogled-revisions.psd1', 'tools/platform_pins.py', 'build/prepare-ungoogled.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-
      - name: Select compile parallelism
        run: python3 tools/build_resources.py --github-env

      - name: Run stage 3
        id: stage
        env:
          CHROMIX_BUILD_PROFILE: ${{ inputs.build_profile }}
          CHROMIX_LINUX157_PRE_GN_RECOVERY: ${{ inputs.linux157_pre_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_POST_GN_RECOVERY: ${{ inputs.linux157_post_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_LOCALE_RECOVERY: ${{ inputs.linux157_locale_recovery && '1' || '0' }}
          CHROMIX_MACOS_COMPILE_RELEASE: ${{ inputs.platform == 'macos' && inputs.macos_compile_release && '1' || '0' }}
          # Mac runtime gates need 45m in addition to packaging/checkpoint reserve.
          CHROMIX_RESERVE_MINUTES: ${{ inputs.platform == 'macos' && '90' || inputs['max-stages'] == 1 && '15' || '45' }}
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
          GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          NOW_EPOCH="$(date +%s)"
          DEADLINE_EPOCH=$(( NOW_EPOCH + 300 * 60 ))
          JOB_DEADLINE_EPOCH=$(( CHROMIX_JOB_START_EPOCH + 330 * 60 ))
          if [ "$DEADLINE_EPOCH" -gt "$JOB_DEADLINE_EPOCH" ]; then
            DEADLINE_EPOCH="$JOB_DEADLINE_EPOCH"
          fi
          if build/posix/ci-stage-mac157-arm64-stage5.sh \
            --platform '${{ inputs.platform }}' --arch '${{ inputs.arch }}' \
            --workdir "${RUNNER_TEMP}/chromix-build" \
            --stage-index 3 --max-stages '${{ inputs['max-stages'] }}' --from-snapshot "${RUNNER_TEMP}/chromix-restore" \
            --deadline-epoch "$DEADLINE_EPOCH" \
            2>&1 | tee "${RUNNER_TEMP}/chromix-logs/stage-3.log"; then
            exit 0
          else
            # Capture both statuses before any command overwrites PIPESTATUS.
            codes=("${PIPESTATUS[@]}")
            if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
            exit "${codes[1]}"
          fi
      - name: Upload final bundle (compile-release)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fingerprint source receipt (compile-release)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-fingerprint-source
          path: ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/source-final.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics (compile-release)
        if: ${{ !cancelled() && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-logs-s3-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/chromix-logs/
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-3/
            ${{ runner.temp }}/chromix-build/src/out/Chromix/args.gn
            ${{ runner.temp }}/chromix-build/src/out/Default/args.gn
            ${{ runner.temp }}/chromix-build/src/.chromix-upstream-restored.json
            ${{ runner.temp }}/chromix-build/src/.chromix-restored-patches.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-*.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-in-progress
            ${{ runner.temp }}/chromix-build/linux157-failed.json
            ${{ runner.temp }}/chromix-build/linux157-compiled.json
            ${{ runner.temp }}/chromix-build/linux157-checkpoint-download.json
            ${{ runner.temp }}/chromix-build/linux157-pre-gn-origin/
            ${{ runner.temp }}/chromix-build/linux157-postgn-download.json
            ${{ runner.temp }}/chromix-build/linux157-postgn-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-download.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-locale-migration-in-progress
            ${{ runner.temp }}/chromix-build/upstream-cache-restore.json
            ${{ runner.temp }}/chromix-build/upstream-cache-preparation.json
            ${{ runner.temp }}/chromix-build/upstream-cache-ninja.json
            ${{ runner.temp }}/chromix-build/upstream-cache-import.json
            ${{ runner.temp }}/chromix-build/upstream-cache-plan.log
            ${{ runner.temp }}/chromix-build/upstream-reuse/
            ${{ runner.temp }}/chromix-build/upstream-object-cache.json
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-upstream/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed macOS runtime bundle
        if: ${{ !cancelled() && inputs.platform == 'macos' && steps.stage.outcome == 'failure' && steps.stage.outputs.package_ready == 'true' && steps.stage.outputs.runtime_failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-failed-runtime-s3-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-3/
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-logs/stage-3.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve latest macOS compiled checkpoint
        id: runtime_checkpoint
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        if: ${{ !cancelled() && inputs.platform == 'macos' && (steps.stage.outputs.compiled_ready == 'true' || (inputs.resume_migration == 'mac156-x64-stage8' && failure()) || (inputs.resume_migration == 'mac156-x64-stage2' && failure()) || (inputs.resume_migration == 'mac156-x64-stage3' && failure())) }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          test -d "$WORK/src"
          if { [ '${{ inputs.resume_migration }}' != mac156-x64-stage8 ] &&
               [ '${{ inputs.resume_migration }}' != mac156-x64-stage2 ] &&
               [ '${{ inputs.resume_migration }}' != mac156-x64-stage3 ]; } ||
             [ '${{ steps.stage.outputs.upload_snapshot }}' != true ]; then
            bash build/posix/ci-parts.sh "$WORK" "$WORK/.snapshot-stage-3"
          fi
          echo "upload_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Upload failed Linux runtime bundle
        if: ${{ !cancelled() && inputs.platform == 'linux' && steps.stage.outcome == 'failure' && steps.stage.outputs.package_ready == 'true' && steps.stage.outputs.runtime_failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-failed-runtime-s3-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-logs/stage-3.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve latest failed Linux source/output checkpoint
        id: linux_runtime_checkpoint
        if: ${{ !cancelled() && inputs.platform == 'linux' && steps.stage.outcome == 'failure' }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          python3 - "$WORK" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          work = Path(sys.argv[1])
          if work.is_symlink() or not work.is_dir() or work.resolve() != work:
              raise SystemExit("unsafe Linux checkpoint work directory")
          if (work / "src").is_symlink() or not (work / "src").is_dir():
              raise SystemExit("Linux checkpoint source directory is missing or unsafe")
          # Only redundant copies; retain the bundle, source, objects and caches.
          copies = [work / "smoke", work / "dist/chromix"]
          snapshots = [work / f".snapshot-stage-{stage}" for stage in range(1, 9)]
          for path in [*copies, *snapshots]:
              if path.is_symlink() or path.resolve() != path:
                  raise SystemExit(f"unsafe Linux checkpoint cleanup path: {path}")
          for path in [*copies, *snapshots]:
              if path.is_dir():
                  shutil.rmtree(path)
          PY
          if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
            CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
              --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s3.json"
          else
            python3 tools/verify_linux_checkpoint.py --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s3.json"
          fi
          bash build/posix/ci-parts.sh "$WORK" "$WORK/.snapshot-stage-3"
          echo "upload_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Verify handoff snapshot
        id: checkpoint
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        run: |
          set -euo pipefail
          SNAP="${RUNNER_TEMP}/chromix-build/.snapshot-stage-3"
          UPLOAD_IDENTITY="${RUNNER_TEMP}/chromix-logs/checkpoint-upload-identity-s3.json"
          LINUX157_UPLOAD=0
          if [ '${{ inputs.platform }}' = linux ]; then
            if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "${RUNNER_TEMP}/chromix-logs/checkpoint-upload-source-s3.json"
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/verify_linux157_upload.py \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' > "$UPLOAD_IDENTITY"
              LINUX157_UPLOAD=1
            else
              python3 tools/verify_linux_checkpoint.py --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "$UPLOAD_IDENTITY"
            fi
          fi
          test -d "$SNAP/p1"
          if [ "$LINUX157_UPLOAD" = 1 ]; then
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_linux157_upload.py --archive-report "$UPLOAD_IDENTITY"
          else
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_snapshot_tar.py
          fi

      - name: Upload tree part 1
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s3-attempt-${{ github.run_attempt }}-part1
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-3/p1/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 2
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s3-attempt-${{ github.run_attempt }}-part2
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-3/p2/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 3
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s3-attempt-${{ github.run_attempt }}-part3
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-3/p3/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 4
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s3-attempt-${{ github.run_attempt }}-part4
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-3/p4/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload final bundle
        if: steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy != 'macos-compile-release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: always() && !(inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-logs-s3-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/chromix-logs/
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-3/
            ${{ runner.temp }}/chromix-build/src/out/Chromix/args.gn
            ${{ runner.temp }}/chromix-build/src/out/Default/args.gn
            ${{ runner.temp }}/chromix-build/src/.chromix-upstream-restored.json
            ${{ runner.temp }}/chromix-build/src/.chromix-restored-patches.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-*.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-in-progress
            ${{ runner.temp }}/chromix-build/linux157-failed.json
            ${{ runner.temp }}/chromix-build/linux157-compiled.json
            ${{ runner.temp }}/chromix-build/linux157-checkpoint-download.json
            ${{ runner.temp }}/chromix-build/linux157-pre-gn-origin/
            ${{ runner.temp }}/chromix-build/linux157-postgn-download.json
            ${{ runner.temp }}/chromix-build/linux157-postgn-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-download.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-locale-migration-in-progress
            ${{ runner.temp }}/chromix-build/upstream-cache-restore.json
            ${{ runner.temp }}/chromix-build/upstream-cache-preparation.json
            ${{ runner.temp }}/chromix-build/upstream-cache-ninja.json
            ${{ runner.temp }}/chromix-build/upstream-cache-import.json
            ${{ runner.temp }}/chromix-build/upstream-cache-plan.log
            ${{ runner.temp }}/chromix-build/upstream-reuse/
            ${{ runner.temp }}/chromix-build/upstream-object-cache.json
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-upstream/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload fingerprint source receipt
        if: steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy != 'macos-compile-release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-fingerprint-source
          path: ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/source-final.json
          if-no-files-found: error
          retention-days: 14

  posix-4:
    name: ${{ inputs.platform }}-${{ inputs.arch }} stage 4 (resume compile)
    needs: posix-3
    if: >-
      always() && inputs['max-stages'] >= 4 &&
      needs.posix-3.result == 'success' &&
      needs.posix-3.outputs.finished != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      snapshot_attempt: ${{ steps.snapshot_origin.outputs.attempt }}
    steps:
      - name: Record runner resources
        run: |
          set -euo pipefail
          echo "CHROMIX_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/chromix-logs"
          {
            uname -a
            case "$(uname -s)" in
              Linux) getconf _NPROCESSORS_ONLN; free -h ;;
              Darwin) sysctl hw.ncpu hw.memsize ;;
            esac
            df -h
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/runner.log"

      - uses: actions/checkout@v4

      - name: Require exact mac157 ARM64 stage5 route
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.runner }}' = macos:arm64:macos-26
          test '${{ inputs.artifact }}:${{ inputs.max-stages }}' = chromix-mac157-arm64-stage5-resume:8
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_tree_stage }}:${{ inputs.resume_attempt }}:${{ inputs.resume_artifact_ids }}' = mac157-arm64-stage5:44567777209:5:1:14626292942
          test '${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}:${{ inputs.macos_compile_release }}' = fast:true:true
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' = false:false:false

      - name: Record snapshot producer attempt
        id: snapshot_origin
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Enable fixed unchanged mac156 Intel stage3 continuation
        if: inputs.resume_migration == 'mac156-x64-stage3'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage3' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel stage2 continuation
        if: inputs.resume_migration == 'mac156-x64-stage2'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage2' >> "$GITHUB_ENV"
      - name: Enable fixed mac157 ICU/UA source migration
        if: inputs.resume_migration == 'mac157-arm64-stage5'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac157-arm64-stage5' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 stage1 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage1'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage1' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage8' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel continuation
        if: inputs.resume_migration == 'mac156-x64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage8' >> "$GITHUB_ENV"

      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /usr/lib/jvm \
            /usr/local/share/boost /usr/share/swift \
            /usr/lib/dotnet /usr/lib/google-cloud-sdk
          sudo docker system prune -af || true
          df -h

      # Match Chromium's install-build-deps; Go is pinned by setup-go below.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            apparmor-utils bison clang clang-format cmake curl flex g++ git gperf \
            libasound2-dev libatk1.0-dev libcups2-dev libdrm-dev libegl1-mesa-dev \
            libevent-dev libflac-dev libgbm-dev libglib2.0-dev libgtk-3-dev \
            libjpeg-dev libnss3-dev libopus-dev libpam0g-dev libpci-dev \
            libpipewire-0.3-dev libpulse-dev libspeechd-dev libudev-dev \
            libva-dev libvpx-dev libwebp-dev libx11-xcb-dev libxcb-dri3-dev \
            libxshmfence-dev libxslt1-dev libxss-dev libxtst-dev mesa-common-dev \
            ninja-build pkg-config python3-jinja2 python3-pyparsing \
            python3-setuptools python3-six rsync uuid-dev xz-utils yasm zip unzip \
            zstd patch file

      - name: Install restored-build Ninja v6
        if: runner.os == 'Linux' && inputs.use_upstream_cache
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              NINJA_ARCHIVE=ninja-linux.zip
              NINJA_SHA256=6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255 ;;
            aarch64)
              NINJA_ARCHIVE=ninja-linux-aarch64.zip
              NINJA_SHA256=5c25c6570b0155e95fce5918cb95f1ad9870df5768653afe128db822301a05a1 ;;
            *) exit 1 ;;
          esac
          NINJA_DIR="$(mktemp -d "${RUNNER_TEMP}/chromix-ninja-v6.XXXXXX")"
          curl --fail --location --retry 3 --max-time 120 --max-filesize 2097152 \
            "https://github.com/ninja-build/ninja/releases/download/v1.12.1/${NINJA_ARCHIVE}" \
            -o "${NINJA_DIR}/ninja.zip"
          printf '%s  %s\n' "$NINJA_SHA256" "${NINJA_DIR}/ninja.zip" | sha256sum --check --strict
          unzip -q "${NINJA_DIR}/ninja.zip" ninja -d "$NINJA_DIR"
          rm "${NINJA_DIR}/ninja.zip"
          chmod +x "${NINJA_DIR}/ninja"
          test "$("${NINJA_DIR}/ninja" --version)" = 1.12.1
          printf '%s\n' "$NINJA_DIR" >> "$GITHUB_PATH"
      - name: Select compatible Xcode
        if: runner.os == 'macOS'
        run: bash build/macos/select-xcode.sh

      - name: Free macOS disk space
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          python3 build/macos/free-disk-space.py 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/disk-cleanup.log"

      - name: Inspect macOS toolchain
        if: runner.os == 'macOS'
        run: |
          {
            sw_vers
            xcode-select -p
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-path
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/xcode.log"

      - name: Disable Spotlight indexing
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          volume=/System/Volumes/Data
          for attempt in 1 2 3; do
            if sudo mdutil -i off "$volume"; then
              echo "Requested indexing disable on $volume"
            fi
            if status=$(sudo mdutil -s "$volume"); then
              printf '%s\n' "$status"
              if printf '%s\n' "$status" | grep -Eq '^[[:space:]]*Indexing( and searching)? disabled\.[[:space:]]*$'; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo "::error::Unable to verify Spotlight indexing is disabled on $volume"
          exit 1

      # Chromium supplies clang; Homebrew supplies the remaining build tools.
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja coreutils gpatch zstd
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify Go version
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve platform Chromium version
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          CHROMIUM_VERSION="$(python3 tools/platform_pins.py --platform "$BUILD_PLATFORM" --field ChromiumVersion)"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> "$GITHUB_ENV"
      - name: Verify complete Mac SDK contents
        if: runner.os == 'macOS' && inputs.use_upstream_cache
        run: python3 tools/inspect_macos_sdk.py --report "${RUNNER_TEMP}/chromix-logs/sdk-content.json"
      - name: Guard exact Linux157 compiled locale recovery
        if: inputs.linux157_locale_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:x64:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}' = false:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64

      - name: Guard exact Linux157 post-GN recovery request
        if: inputs.linux157_post_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}' = false
          test '${{ inputs.linux157_locale_recovery }}' = false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Guard exact Linux157 pre-GN recovery request
        if: inputs.linux157_pre_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Validate exact Linux157 fresh source route
        if: inputs.platform == 'linux' && env.CHROMIUM_VERSION == '157.0.8103.78'
        env:
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
        run: |
          set -euo pipefail
          case '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' in
            true:false:false|false:true:false|false:false:true) ;;
            *) echo 'Select exactly one reviewed Linux157 recovery route' >&2; exit 1 ;;
          esac
          test '${{ inputs.resume_migration }}' = ''
          test '${{ inputs.resume_run_id }}' = ''
          test "$(uname -m)" = x86_64
          python3 tools/linux157_source.py --phase route --arch '${{ inputs.arch }}' \
            > "${RUNNER_TEMP}/chromix-logs/linux157-recipe.json"

      - name: Record exact mac156 handoff producer attempt
        if: inputs.resume_migration == 'mac157-arm64-stage5' || inputs.resume_migration == 'mac156-x64-stage3' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-x64-stage8'
        env:
          PRODUCER_ATTEMPT: ${{ needs.posix-3.outputs.snapshot_attempt }}
        run: echo "CHROMIX_PREVIOUS_ATTEMPT=$PRODUCER_ATTEMPT" >> "$GITHUB_ENV"
      - name: Download tree from previous stage
        if: success()
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact }}-tree-s3-attempt-${{ needs.posix-3.outputs.snapshot_attempt }}-part*
          merge-multiple: true
          path: ${{ runner.temp }}/chromix-restore

      # The pinned download cache is deliberately outside the tree snapshot;
      # re-warm it first so a resumed preparation does not redownload archives.
      - name: Restore pinned source downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/chromix-build/download_cache
          key: ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-${{ env.CHROMIUM_VERSION }}-${{ hashFiles('CHROMIUM_VERSION', 'CHROMIUM_LINUX_VERSION', 'CHROMIUM_MACOS_VERSION', 'build/ungoogled-revisions.psd1', 'tools/platform_pins.py', 'build/prepare-ungoogled.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-
      - name: Select compile parallelism
        run: python3 tools/build_resources.py --github-env

      - name: Run stage 4
        id: stage
        env:
          CHROMIX_BUILD_PROFILE: ${{ inputs.build_profile }}
          CHROMIX_LINUX157_PRE_GN_RECOVERY: ${{ inputs.linux157_pre_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_POST_GN_RECOVERY: ${{ inputs.linux157_post_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_LOCALE_RECOVERY: ${{ inputs.linux157_locale_recovery && '1' || '0' }}
          CHROMIX_MACOS_COMPILE_RELEASE: ${{ inputs.platform == 'macos' && inputs.macos_compile_release && '1' || '0' }}
          # Mac runtime gates need 45m in addition to packaging/checkpoint reserve.
          CHROMIX_RESERVE_MINUTES: ${{ inputs.platform == 'macos' && '90' || inputs['max-stages'] == 1 && '15' || '45' }}
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
          GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          NOW_EPOCH="$(date +%s)"
          DEADLINE_EPOCH=$(( NOW_EPOCH + 300 * 60 ))
          JOB_DEADLINE_EPOCH=$(( CHROMIX_JOB_START_EPOCH + 330 * 60 ))
          if [ "$DEADLINE_EPOCH" -gt "$JOB_DEADLINE_EPOCH" ]; then
            DEADLINE_EPOCH="$JOB_DEADLINE_EPOCH"
          fi
          if build/posix/ci-stage-mac157-arm64-stage5.sh \
            --platform '${{ inputs.platform }}' --arch '${{ inputs.arch }}' \
            --workdir "${RUNNER_TEMP}/chromix-build" \
            --stage-index 4 --max-stages '${{ inputs['max-stages'] }}' --from-snapshot "${RUNNER_TEMP}/chromix-restore" \
            --deadline-epoch "$DEADLINE_EPOCH" \
            2>&1 | tee "${RUNNER_TEMP}/chromix-logs/stage-4.log"; then
            exit 0
          else
            # Capture both statuses before any command overwrites PIPESTATUS.
            codes=("${PIPESTATUS[@]}")
            if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
            exit "${codes[1]}"
          fi
      - name: Upload final bundle (compile-release)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fingerprint source receipt (compile-release)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-fingerprint-source
          path: ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/source-final.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics (compile-release)
        if: ${{ !cancelled() && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-logs-s4-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/chromix-logs/
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-4/
            ${{ runner.temp }}/chromix-build/src/out/Chromix/args.gn
            ${{ runner.temp }}/chromix-build/src/out/Default/args.gn
            ${{ runner.temp }}/chromix-build/src/.chromix-upstream-restored.json
            ${{ runner.temp }}/chromix-build/src/.chromix-restored-patches.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-*.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-in-progress
            ${{ runner.temp }}/chromix-build/linux157-failed.json
            ${{ runner.temp }}/chromix-build/linux157-compiled.json
            ${{ runner.temp }}/chromix-build/linux157-checkpoint-download.json
            ${{ runner.temp }}/chromix-build/linux157-pre-gn-origin/
            ${{ runner.temp }}/chromix-build/linux157-postgn-download.json
            ${{ runner.temp }}/chromix-build/linux157-postgn-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-download.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-locale-migration-in-progress
            ${{ runner.temp }}/chromix-build/upstream-cache-restore.json
            ${{ runner.temp }}/chromix-build/upstream-cache-preparation.json
            ${{ runner.temp }}/chromix-build/upstream-cache-ninja.json
            ${{ runner.temp }}/chromix-build/upstream-cache-import.json
            ${{ runner.temp }}/chromix-build/upstream-cache-plan.log
            ${{ runner.temp }}/chromix-build/upstream-reuse/
            ${{ runner.temp }}/chromix-build/upstream-object-cache.json
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-upstream/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed macOS runtime bundle
        if: ${{ !cancelled() && inputs.platform == 'macos' && steps.stage.outcome == 'failure' && steps.stage.outputs.package_ready == 'true' && steps.stage.outputs.runtime_failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-failed-runtime-s4-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-4/
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-logs/stage-4.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve latest macOS compiled checkpoint
        id: runtime_checkpoint
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        if: ${{ !cancelled() && inputs.platform == 'macos' && (steps.stage.outputs.compiled_ready == 'true' || (inputs.resume_migration == 'mac156-x64-stage8' && failure()) || (inputs.resume_migration == 'mac156-x64-stage2' && failure()) || (inputs.resume_migration == 'mac156-x64-stage3' && failure())) }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          test -d "$WORK/src"
          if { [ '${{ inputs.resume_migration }}' != mac156-x64-stage8 ] &&
               [ '${{ inputs.resume_migration }}' != mac156-x64-stage2 ] &&
               [ '${{ inputs.resume_migration }}' != mac156-x64-stage3 ]; } ||
             [ '${{ steps.stage.outputs.upload_snapshot }}' != true ]; then
            bash build/posix/ci-parts.sh "$WORK" "$WORK/.snapshot-stage-4"
          fi
          echo "upload_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Upload failed Linux runtime bundle
        if: ${{ !cancelled() && inputs.platform == 'linux' && steps.stage.outcome == 'failure' && steps.stage.outputs.package_ready == 'true' && steps.stage.outputs.runtime_failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-failed-runtime-s4-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-logs/stage-4.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve latest failed Linux source/output checkpoint
        id: linux_runtime_checkpoint
        if: ${{ !cancelled() && inputs.platform == 'linux' && steps.stage.outcome == 'failure' }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          python3 - "$WORK" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          work = Path(sys.argv[1])
          if work.is_symlink() or not work.is_dir() or work.resolve() != work:
              raise SystemExit("unsafe Linux checkpoint work directory")
          if (work / "src").is_symlink() or not (work / "src").is_dir():
              raise SystemExit("Linux checkpoint source directory is missing or unsafe")
          # Only redundant copies; retain the bundle, source, objects and caches.
          copies = [work / "smoke", work / "dist/chromix"]
          snapshots = [work / f".snapshot-stage-{stage}" for stage in range(1, 9)]
          for path in [*copies, *snapshots]:
              if path.is_symlink() or path.resolve() != path:
                  raise SystemExit(f"unsafe Linux checkpoint cleanup path: {path}")
          for path in [*copies, *snapshots]:
              if path.is_dir():
                  shutil.rmtree(path)
          PY
          if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
            CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
              --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s4.json"
          else
            python3 tools/verify_linux_checkpoint.py --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s4.json"
          fi
          bash build/posix/ci-parts.sh "$WORK" "$WORK/.snapshot-stage-4"
          echo "upload_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Verify handoff snapshot
        id: checkpoint
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        run: |
          set -euo pipefail
          SNAP="${RUNNER_TEMP}/chromix-build/.snapshot-stage-4"
          UPLOAD_IDENTITY="${RUNNER_TEMP}/chromix-logs/checkpoint-upload-identity-s4.json"
          LINUX157_UPLOAD=0
          if [ '${{ inputs.platform }}' = linux ]; then
            if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "${RUNNER_TEMP}/chromix-logs/checkpoint-upload-source-s4.json"
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/verify_linux157_upload.py \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' > "$UPLOAD_IDENTITY"
              LINUX157_UPLOAD=1
            else
              python3 tools/verify_linux_checkpoint.py --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "$UPLOAD_IDENTITY"
            fi
          fi
          test -d "$SNAP/p1"
          if [ "$LINUX157_UPLOAD" = 1 ]; then
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_linux157_upload.py --archive-report "$UPLOAD_IDENTITY"
          else
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_snapshot_tar.py
          fi

      - name: Upload tree part 1
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s4-attempt-${{ github.run_attempt }}-part1
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-4/p1/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 2
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s4-attempt-${{ github.run_attempt }}-part2
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-4/p2/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 3
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s4-attempt-${{ github.run_attempt }}-part3
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-4/p3/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 4
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s4-attempt-${{ github.run_attempt }}-part4
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-4/p4/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload final bundle
        if: steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy != 'macos-compile-release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: always() && !(inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-logs-s4-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/chromix-logs/
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-4/
            ${{ runner.temp }}/chromix-build/src/out/Chromix/args.gn
            ${{ runner.temp }}/chromix-build/src/out/Default/args.gn
            ${{ runner.temp }}/chromix-build/src/.chromix-upstream-restored.json
            ${{ runner.temp }}/chromix-build/src/.chromix-restored-patches.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-*.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-in-progress
            ${{ runner.temp }}/chromix-build/linux157-failed.json
            ${{ runner.temp }}/chromix-build/linux157-compiled.json
            ${{ runner.temp }}/chromix-build/linux157-checkpoint-download.json
            ${{ runner.temp }}/chromix-build/linux157-pre-gn-origin/
            ${{ runner.temp }}/chromix-build/linux157-postgn-download.json
            ${{ runner.temp }}/chromix-build/linux157-postgn-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-download.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-locale-migration-in-progress
            ${{ runner.temp }}/chromix-build/upstream-cache-restore.json
            ${{ runner.temp }}/chromix-build/upstream-cache-preparation.json
            ${{ runner.temp }}/chromix-build/upstream-cache-ninja.json
            ${{ runner.temp }}/chromix-build/upstream-cache-import.json
            ${{ runner.temp }}/chromix-build/upstream-cache-plan.log
            ${{ runner.temp }}/chromix-build/upstream-reuse/
            ${{ runner.temp }}/chromix-build/upstream-object-cache.json
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-upstream/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload fingerprint source receipt
        if: steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy != 'macos-compile-release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-fingerprint-source
          path: ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/source-final.json
          if-no-files-found: error
          retention-days: 14

  posix-5:
    name: ${{ inputs.platform }}-${{ inputs.arch }} stage 5 (resume compile)
    needs: posix-4
    if: >-
      always() && inputs['max-stages'] >= 5 &&
      needs.posix-4.result == 'success' &&
      needs.posix-4.outputs.finished != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      snapshot_attempt: ${{ steps.snapshot_origin.outputs.attempt }}
    steps:
      - name: Record runner resources
        run: |
          set -euo pipefail
          echo "CHROMIX_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/chromix-logs"
          {
            uname -a
            case "$(uname -s)" in
              Linux) getconf _NPROCESSORS_ONLN; free -h ;;
              Darwin) sysctl hw.ncpu hw.memsize ;;
            esac
            df -h
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/runner.log"

      - uses: actions/checkout@v4

      - name: Require exact mac157 ARM64 stage5 route
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.runner }}' = macos:arm64:macos-26
          test '${{ inputs.artifact }}:${{ inputs.max-stages }}' = chromix-mac157-arm64-stage5-resume:8
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_tree_stage }}:${{ inputs.resume_attempt }}:${{ inputs.resume_artifact_ids }}' = mac157-arm64-stage5:44567777209:5:1:14626292942
          test '${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}:${{ inputs.macos_compile_release }}' = fast:true:true
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' = false:false:false

      - name: Record snapshot producer attempt
        id: snapshot_origin
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Enable fixed unchanged mac156 Intel stage3 continuation
        if: inputs.resume_migration == 'mac156-x64-stage3'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage3' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel stage2 continuation
        if: inputs.resume_migration == 'mac156-x64-stage2'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage2' >> "$GITHUB_ENV"
      - name: Enable fixed mac157 ICU/UA source migration
        if: inputs.resume_migration == 'mac157-arm64-stage5'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac157-arm64-stage5' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 stage1 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage1'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage1' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage8' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel continuation
        if: inputs.resume_migration == 'mac156-x64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage8' >> "$GITHUB_ENV"

      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /usr/lib/jvm \
            /usr/local/share/boost /usr/share/swift \
            /usr/lib/dotnet /usr/lib/google-cloud-sdk
          sudo docker system prune -af || true
          df -h

      # Match Chromium's install-build-deps; Go is pinned by setup-go below.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            apparmor-utils bison clang clang-format cmake curl flex g++ git gperf \
            libasound2-dev libatk1.0-dev libcups2-dev libdrm-dev libegl1-mesa-dev \
            libevent-dev libflac-dev libgbm-dev libglib2.0-dev libgtk-3-dev \
            libjpeg-dev libnss3-dev libopus-dev libpam0g-dev libpci-dev \
            libpipewire-0.3-dev libpulse-dev libspeechd-dev libudev-dev \
            libva-dev libvpx-dev libwebp-dev libx11-xcb-dev libxcb-dri3-dev \
            libxshmfence-dev libxslt1-dev libxss-dev libxtst-dev mesa-common-dev \
            ninja-build pkg-config python3-jinja2 python3-pyparsing \
            python3-setuptools python3-six rsync uuid-dev xz-utils yasm zip unzip \
            zstd patch file

      - name: Install restored-build Ninja v6
        if: runner.os == 'Linux' && inputs.use_upstream_cache
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              NINJA_ARCHIVE=ninja-linux.zip
              NINJA_SHA256=6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255 ;;
            aarch64)
              NINJA_ARCHIVE=ninja-linux-aarch64.zip
              NINJA_SHA256=5c25c6570b0155e95fce5918cb95f1ad9870df5768653afe128db822301a05a1 ;;
            *) exit 1 ;;
          esac
          NINJA_DIR="$(mktemp -d "${RUNNER_TEMP}/chromix-ninja-v6.XXXXXX")"
          curl --fail --location --retry 3 --max-time 120 --max-filesize 2097152 \
            "https://github.com/ninja-build/ninja/releases/download/v1.12.1/${NINJA_ARCHIVE}" \
            -o "${NINJA_DIR}/ninja.zip"
          printf '%s  %s\n' "$NINJA_SHA256" "${NINJA_DIR}/ninja.zip" | sha256sum --check --strict
          unzip -q "${NINJA_DIR}/ninja.zip" ninja -d "$NINJA_DIR"
          rm "${NINJA_DIR}/ninja.zip"
          chmod +x "${NINJA_DIR}/ninja"
          test "$("${NINJA_DIR}/ninja" --version)" = 1.12.1
          printf '%s\n' "$NINJA_DIR" >> "$GITHUB_PATH"
      - name: Select compatible Xcode
        if: runner.os == 'macOS'
        run: bash build/macos/select-xcode.sh

      - name: Free macOS disk space
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          python3 build/macos/free-disk-space.py 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/disk-cleanup.log"

      - name: Inspect macOS toolchain
        if: runner.os == 'macOS'
        run: |
          {
            sw_vers
            xcode-select -p
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-path
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/xcode.log"

      - name: Disable Spotlight indexing
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          volume=/System/Volumes/Data
          for attempt in 1 2 3; do
            if sudo mdutil -i off "$volume"; then
              echo "Requested indexing disable on $volume"
            fi
            if status=$(sudo mdutil -s "$volume"); then
              printf '%s\n' "$status"
              if printf '%s\n' "$status" | grep -Eq '^[[:space:]]*Indexing( and searching)? disabled\.[[:space:]]*$'; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo "::error::Unable to verify Spotlight indexing is disabled on $volume"
          exit 1

      # Chromium supplies clang; Homebrew supplies the remaining build tools.
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja coreutils gpatch zstd
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify Go version
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve platform Chromium version
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          CHROMIUM_VERSION="$(python3 tools/platform_pins.py --platform "$BUILD_PLATFORM" --field ChromiumVersion)"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> "$GITHUB_ENV"
      - name: Verify complete Mac SDK contents
        if: runner.os == 'macOS' && inputs.use_upstream_cache
        run: python3 tools/inspect_macos_sdk.py --report "${RUNNER_TEMP}/chromix-logs/sdk-content.json"
      - name: Guard exact Linux157 compiled locale recovery
        if: inputs.linux157_locale_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:x64:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}' = false:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64

      - name: Guard exact Linux157 post-GN recovery request
        if: inputs.linux157_post_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}' = false
          test '${{ inputs.linux157_locale_recovery }}' = false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Guard exact Linux157 pre-GN recovery request
        if: inputs.linux157_pre_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Validate exact Linux157 fresh source route
        if: inputs.platform == 'linux' && env.CHROMIUM_VERSION == '157.0.8103.78'
        env:
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
        run: |
          set -euo pipefail
          case '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' in
            true:false:false|false:true:false|false:false:true) ;;
            *) echo 'Select exactly one reviewed Linux157 recovery route' >&2; exit 1 ;;
          esac
          test '${{ inputs.resume_migration }}' = ''
          test '${{ inputs.resume_run_id }}' = ''
          test "$(uname -m)" = x86_64
          python3 tools/linux157_source.py --phase route --arch '${{ inputs.arch }}' \
            > "${RUNNER_TEMP}/chromix-logs/linux157-recipe.json"

      - name: Record exact mac156 handoff producer attempt
        if: inputs.resume_migration == 'mac157-arm64-stage5' || inputs.resume_migration == 'mac156-x64-stage3' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-x64-stage8'
        env:
          PRODUCER_ATTEMPT: ${{ needs.posix-4.outputs.snapshot_attempt }}
        run: echo "CHROMIX_PREVIOUS_ATTEMPT=$PRODUCER_ATTEMPT" >> "$GITHUB_ENV"
      - name: Download tree from previous stage
        if: success()
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact }}-tree-s4-attempt-${{ needs.posix-4.outputs.snapshot_attempt }}-part*
          merge-multiple: true
          path: ${{ runner.temp }}/chromix-restore

      # The pinned download cache is deliberately outside the tree snapshot;
      # re-warm it first so a resumed preparation does not redownload archives.
      - name: Restore pinned source downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/chromix-build/download_cache
          key: ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-${{ env.CHROMIUM_VERSION }}-${{ hashFiles('CHROMIUM_VERSION', 'CHROMIUM_LINUX_VERSION', 'CHROMIUM_MACOS_VERSION', 'build/ungoogled-revisions.psd1', 'tools/platform_pins.py', 'build/prepare-ungoogled.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-
      - name: Select compile parallelism
        run: python3 tools/build_resources.py --github-env

      - name: Run stage 5
        id: stage
        env:
          CHROMIX_BUILD_PROFILE: ${{ inputs.build_profile }}
          CHROMIX_LINUX157_PRE_GN_RECOVERY: ${{ inputs.linux157_pre_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_POST_GN_RECOVERY: ${{ inputs.linux157_post_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_LOCALE_RECOVERY: ${{ inputs.linux157_locale_recovery && '1' || '0' }}
          CHROMIX_MACOS_COMPILE_RELEASE: ${{ inputs.platform == 'macos' && inputs.macos_compile_release && '1' || '0' }}
          # Mac runtime gates need 45m in addition to packaging/checkpoint reserve.
          CHROMIX_RESERVE_MINUTES: ${{ inputs.platform == 'macos' && '90' || inputs['max-stages'] == 1 && '15' || '45' }}
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
          GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          NOW_EPOCH="$(date +%s)"
          DEADLINE_EPOCH=$(( NOW_EPOCH + 300 * 60 ))
          JOB_DEADLINE_EPOCH=$(( CHROMIX_JOB_START_EPOCH + 330 * 60 ))
          if [ "$DEADLINE_EPOCH" -gt "$JOB_DEADLINE_EPOCH" ]; then
            DEADLINE_EPOCH="$JOB_DEADLINE_EPOCH"
          fi
          if build/posix/ci-stage-mac157-arm64-stage5.sh \
            --platform '${{ inputs.platform }}' --arch '${{ inputs.arch }}' \
            --workdir "${RUNNER_TEMP}/chromix-build" \
            --stage-index 5 --max-stages '${{ inputs['max-stages'] }}' --from-snapshot "${RUNNER_TEMP}/chromix-restore" \
            --deadline-epoch "$DEADLINE_EPOCH" \
            2>&1 | tee "${RUNNER_TEMP}/chromix-logs/stage-5.log"; then
            exit 0
          else
            # Capture both statuses before any command overwrites PIPESTATUS.
            codes=("${PIPESTATUS[@]}")
            if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
            exit "${codes[1]}"
          fi
      - name: Upload final bundle (compile-release)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fingerprint source receipt (compile-release)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-fingerprint-source
          path: ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/source-final.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics (compile-release)
        if: ${{ !cancelled() && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-logs-s5-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/chromix-logs/
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-5/
            ${{ runner.temp }}/chromix-build/src/out/Chromix/args.gn
            ${{ runner.temp }}/chromix-build/src/out/Default/args.gn
            ${{ runner.temp }}/chromix-build/src/.chromix-upstream-restored.json
            ${{ runner.temp }}/chromix-build/src/.chromix-restored-patches.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-*.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-in-progress
            ${{ runner.temp }}/chromix-build/linux157-failed.json
            ${{ runner.temp }}/chromix-build/linux157-compiled.json
            ${{ runner.temp }}/chromix-build/linux157-checkpoint-download.json
            ${{ runner.temp }}/chromix-build/linux157-pre-gn-origin/
            ${{ runner.temp }}/chromix-build/linux157-postgn-download.json
            ${{ runner.temp }}/chromix-build/linux157-postgn-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-download.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-locale-migration-in-progress
            ${{ runner.temp }}/chromix-build/upstream-cache-restore.json
            ${{ runner.temp }}/chromix-build/upstream-cache-preparation.json
            ${{ runner.temp }}/chromix-build/upstream-cache-ninja.json
            ${{ runner.temp }}/chromix-build/upstream-cache-import.json
            ${{ runner.temp }}/chromix-build/upstream-cache-plan.log
            ${{ runner.temp }}/chromix-build/upstream-reuse/
            ${{ runner.temp }}/chromix-build/upstream-object-cache.json
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-upstream/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed macOS runtime bundle
        if: ${{ !cancelled() && inputs.platform == 'macos' && steps.stage.outcome == 'failure' && steps.stage.outputs.package_ready == 'true' && steps.stage.outputs.runtime_failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-failed-runtime-s5-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-5/
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-logs/stage-5.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve latest macOS compiled checkpoint
        id: runtime_checkpoint
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        if: ${{ !cancelled() && inputs.platform == 'macos' && (steps.stage.outputs.compiled_ready == 'true' || (inputs.resume_migration == 'mac156-x64-stage8' && failure()) || (inputs.resume_migration == 'mac156-x64-stage2' && failure()) || (inputs.resume_migration == 'mac156-x64-stage3' && failure())) }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          test -d "$WORK/src"
          if { [ '${{ inputs.resume_migration }}' != mac156-x64-stage8 ] &&
               [ '${{ inputs.resume_migration }}' != mac156-x64-stage2 ] &&
               [ '${{ inputs.resume_migration }}' != mac156-x64-stage3 ]; } ||
             [ '${{ steps.stage.outputs.upload_snapshot }}' != true ]; then
            bash build/posix/ci-parts.sh "$WORK" "$WORK/.snapshot-stage-5"
          fi
          echo "upload_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Upload failed Linux runtime bundle
        if: ${{ !cancelled() && inputs.platform == 'linux' && steps.stage.outcome == 'failure' && steps.stage.outputs.package_ready == 'true' && steps.stage.outputs.runtime_failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-failed-runtime-s5-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-logs/stage-5.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve latest failed Linux source/output checkpoint
        id: linux_runtime_checkpoint
        if: ${{ !cancelled() && inputs.platform == 'linux' && steps.stage.outcome == 'failure' }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          python3 - "$WORK" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          work = Path(sys.argv[1])
          if work.is_symlink() or not work.is_dir() or work.resolve() != work:
              raise SystemExit("unsafe Linux checkpoint work directory")
          if (work / "src").is_symlink() or not (work / "src").is_dir():
              raise SystemExit("Linux checkpoint source directory is missing or unsafe")
          # Only redundant copies; retain the bundle, source, objects and caches.
          copies = [work / "smoke", work / "dist/chromix"]
          snapshots = [work / f".snapshot-stage-{stage}" for stage in range(1, 9)]
          for path in [*copies, *snapshots]:
              if path.is_symlink() or path.resolve() != path:
                  raise SystemExit(f"unsafe Linux checkpoint cleanup path: {path}")
          for path in [*copies, *snapshots]:
              if path.is_dir():
                  shutil.rmtree(path)
          PY
          if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
            CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
              --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s5.json"
          else
            python3 tools/verify_linux_checkpoint.py --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s5.json"
          fi
          bash build/posix/ci-parts.sh "$WORK" "$WORK/.snapshot-stage-5"
          echo "upload_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Verify handoff snapshot
        id: checkpoint
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        run: |
          set -euo pipefail
          SNAP="${RUNNER_TEMP}/chromix-build/.snapshot-stage-5"
          UPLOAD_IDENTITY="${RUNNER_TEMP}/chromix-logs/checkpoint-upload-identity-s5.json"
          LINUX157_UPLOAD=0
          if [ '${{ inputs.platform }}' = linux ]; then
            if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "${RUNNER_TEMP}/chromix-logs/checkpoint-upload-source-s5.json"
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/verify_linux157_upload.py \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' > "$UPLOAD_IDENTITY"
              LINUX157_UPLOAD=1
            else
              python3 tools/verify_linux_checkpoint.py --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "$UPLOAD_IDENTITY"
            fi
          fi
          test -d "$SNAP/p1"
          if [ "$LINUX157_UPLOAD" = 1 ]; then
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_linux157_upload.py --archive-report "$UPLOAD_IDENTITY"
          else
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_snapshot_tar.py
          fi

      - name: Upload tree part 1
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s5-attempt-${{ github.run_attempt }}-part1
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-5/p1/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 2
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s5-attempt-${{ github.run_attempt }}-part2
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-5/p2/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 3
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s5-attempt-${{ github.run_attempt }}-part3
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-5/p3/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 4
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s5-attempt-${{ github.run_attempt }}-part4
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-5/p4/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload final bundle
        if: steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy != 'macos-compile-release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: always() && !(inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-logs-s5-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/chromix-logs/
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-5/
            ${{ runner.temp }}/chromix-build/src/out/Chromix/args.gn
            ${{ runner.temp }}/chromix-build/src/out/Default/args.gn
            ${{ runner.temp }}/chromix-build/src/.chromix-upstream-restored.json
            ${{ runner.temp }}/chromix-build/src/.chromix-restored-patches.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-*.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-in-progress
            ${{ runner.temp }}/chromix-build/linux157-failed.json
            ${{ runner.temp }}/chromix-build/linux157-compiled.json
            ${{ runner.temp }}/chromix-build/linux157-checkpoint-download.json
            ${{ runner.temp }}/chromix-build/linux157-pre-gn-origin/
            ${{ runner.temp }}/chromix-build/linux157-postgn-download.json
            ${{ runner.temp }}/chromix-build/linux157-postgn-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-download.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-locale-migration-in-progress
            ${{ runner.temp }}/chromix-build/upstream-cache-restore.json
            ${{ runner.temp }}/chromix-build/upstream-cache-preparation.json
            ${{ runner.temp }}/chromix-build/upstream-cache-ninja.json
            ${{ runner.temp }}/chromix-build/upstream-cache-import.json
            ${{ runner.temp }}/chromix-build/upstream-cache-plan.log
            ${{ runner.temp }}/chromix-build/upstream-reuse/
            ${{ runner.temp }}/chromix-build/upstream-object-cache.json
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-upstream/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload fingerprint source receipt
        if: steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy != 'macos-compile-release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-fingerprint-source
          path: ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/source-final.json
          if-no-files-found: error
          retention-days: 14

  posix-6:
    name: ${{ inputs.platform }}-${{ inputs.arch }} stage 6 (resume compile)
    needs: posix-5
    if: >-
      always() && inputs['max-stages'] >= 6 &&
      needs.posix-5.result == 'success' &&
      needs.posix-5.outputs.finished != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      snapshot_attempt: ${{ steps.snapshot_origin.outputs.attempt }}
    steps:
      - name: Record runner resources
        run: |
          set -euo pipefail
          echo "CHROMIX_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/chromix-logs"
          {
            uname -a
            case "$(uname -s)" in
              Linux) getconf _NPROCESSORS_ONLN; free -h ;;
              Darwin) sysctl hw.ncpu hw.memsize ;;
            esac
            df -h
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/runner.log"

      - uses: actions/checkout@v4

      - name: Require exact mac157 ARM64 stage5 route
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.runner }}' = macos:arm64:macos-26
          test '${{ inputs.artifact }}:${{ inputs.max-stages }}' = chromix-mac157-arm64-stage5-resume:8
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_tree_stage }}:${{ inputs.resume_attempt }}:${{ inputs.resume_artifact_ids }}' = mac157-arm64-stage5:44567777209:5:1:14626292942
          test '${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}:${{ inputs.macos_compile_release }}' = fast:true:true
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' = false:false:false

      - name: Record snapshot producer attempt
        id: snapshot_origin
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Enable fixed unchanged mac156 Intel stage3 continuation
        if: inputs.resume_migration == 'mac156-x64-stage3'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage3' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel stage2 continuation
        if: inputs.resume_migration == 'mac156-x64-stage2'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage2' >> "$GITHUB_ENV"
      - name: Enable fixed mac157 ICU/UA source migration
        if: inputs.resume_migration == 'mac157-arm64-stage5'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac157-arm64-stage5' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 stage1 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage1'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage1' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage8' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel continuation
        if: inputs.resume_migration == 'mac156-x64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage8' >> "$GITHUB_ENV"

      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /usr/lib/jvm \
            /usr/local/share/boost /usr/share/swift \
            /usr/lib/dotnet /usr/lib/google-cloud-sdk
          sudo docker system prune -af || true
          df -h

      # Match Chromium's install-build-deps; Go is pinned by setup-go below.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            apparmor-utils bison clang clang-format cmake curl flex g++ git gperf \
            libasound2-dev libatk1.0-dev libcups2-dev libdrm-dev libegl1-mesa-dev \
            libevent-dev libflac-dev libgbm-dev libglib2.0-dev libgtk-3-dev \
            libjpeg-dev libnss3-dev libopus-dev libpam0g-dev libpci-dev \
            libpipewire-0.3-dev libpulse-dev libspeechd-dev libudev-dev \
            libva-dev libvpx-dev libwebp-dev libx11-xcb-dev libxcb-dri3-dev \
            libxshmfence-dev libxslt1-dev libxss-dev libxtst-dev mesa-common-dev \
            ninja-build pkg-config python3-jinja2 python3-pyparsing \
            python3-setuptools python3-six rsync uuid-dev xz-utils yasm zip unzip \
            zstd patch file

      - name: Install restored-build Ninja v6
        if: runner.os == 'Linux' && inputs.use_upstream_cache
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              NINJA_ARCHIVE=ninja-linux.zip
              NINJA_SHA256=6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255 ;;
            aarch64)
              NINJA_ARCHIVE=ninja-linux-aarch64.zip
              NINJA_SHA256=5c25c6570b0155e95fce5918cb95f1ad9870df5768653afe128db822301a05a1 ;;
            *) exit 1 ;;
          esac
          NINJA_DIR="$(mktemp -d "${RUNNER_TEMP}/chromix-ninja-v6.XXXXXX")"
          curl --fail --location --retry 3 --max-time 120 --max-filesize 2097152 \
            "https://github.com/ninja-build/ninja/releases/download/v1.12.1/${NINJA_ARCHIVE}" \
            -o "${NINJA_DIR}/ninja.zip"
          printf '%s  %s\n' "$NINJA_SHA256" "${NINJA_DIR}/ninja.zip" | sha256sum --check --strict
          unzip -q "${NINJA_DIR}/ninja.zip" ninja -d "$NINJA_DIR"
          rm "${NINJA_DIR}/ninja.zip"
          chmod +x "${NINJA_DIR}/ninja"
          test "$("${NINJA_DIR}/ninja" --version)" = 1.12.1
          printf '%s\n' "$NINJA_DIR" >> "$GITHUB_PATH"
      - name: Select compatible Xcode
        if: runner.os == 'macOS'
        run: bash build/macos/select-xcode.sh

      - name: Free macOS disk space
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          python3 build/macos/free-disk-space.py 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/disk-cleanup.log"

      - name: Inspect macOS toolchain
        if: runner.os == 'macOS'
        run: |
          {
            sw_vers
            xcode-select -p
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-path
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/xcode.log"

      - name: Disable Spotlight indexing
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          volume=/System/Volumes/Data
          for attempt in 1 2 3; do
            if sudo mdutil -i off "$volume"; then
              echo "Requested indexing disable on $volume"
            fi
            if status=$(sudo mdutil -s "$volume"); then
              printf '%s\n' "$status"
              if printf '%s\n' "$status" | grep -Eq '^[[:space:]]*Indexing( and searching)? disabled\.[[:space:]]*$'; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo "::error::Unable to verify Spotlight indexing is disabled on $volume"
          exit 1

      # Chromium supplies clang; Homebrew supplies the remaining build tools.
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja coreutils gpatch zstd
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify Go version
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve platform Chromium version
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          CHROMIUM_VERSION="$(python3 tools/platform_pins.py --platform "$BUILD_PLATFORM" --field ChromiumVersion)"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> "$GITHUB_ENV"
      - name: Verify complete Mac SDK contents
        if: runner.os == 'macOS' && inputs.use_upstream_cache
        run: python3 tools/inspect_macos_sdk.py --report "${RUNNER_TEMP}/chromix-logs/sdk-content.json"
      - name: Guard exact Linux157 compiled locale recovery
        if: inputs.linux157_locale_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:x64:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}' = false:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64

      - name: Guard exact Linux157 post-GN recovery request
        if: inputs.linux157_post_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}' = false
          test '${{ inputs.linux157_locale_recovery }}' = false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Guard exact Linux157 pre-GN recovery request
        if: inputs.linux157_pre_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Validate exact Linux157 fresh source route
        if: inputs.platform == 'linux' && env.CHROMIUM_VERSION == '157.0.8103.78'
        env:
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
        run: |
          set -euo pipefail
          case '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' in
            true:false:false|false:true:false|false:false:true) ;;
            *) echo 'Select exactly one reviewed Linux157 recovery route' >&2; exit 1 ;;
          esac
          test '${{ inputs.resume_migration }}' = ''
          test '${{ inputs.resume_run_id }}' = ''
          test "$(uname -m)" = x86_64
          python3 tools/linux157_source.py --phase route --arch '${{ inputs.arch }}' \
            > "${RUNNER_TEMP}/chromix-logs/linux157-recipe.json"

      - name: Record exact mac156 handoff producer attempt
        if: inputs.resume_migration == 'mac157-arm64-stage5' || inputs.resume_migration == 'mac156-x64-stage3' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-x64-stage8'
        env:
          PRODUCER_ATTEMPT: ${{ needs.posix-5.outputs.snapshot_attempt }}
        run: echo "CHROMIX_PREVIOUS_ATTEMPT=$PRODUCER_ATTEMPT" >> "$GITHUB_ENV"
      - name: Download tree from previous stage
        if: success()
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact }}-tree-s5-attempt-${{ needs.posix-5.outputs.snapshot_attempt }}-part*
          merge-multiple: true
          path: ${{ runner.temp }}/chromix-restore

      # The pinned download cache is deliberately outside the tree snapshot;
      # re-warm it first so a resumed preparation does not redownload archives.
      - name: Restore pinned source downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/chromix-build/download_cache
          key: ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-${{ env.CHROMIUM_VERSION }}-${{ hashFiles('CHROMIUM_VERSION', 'CHROMIUM_LINUX_VERSION', 'CHROMIUM_MACOS_VERSION', 'build/ungoogled-revisions.psd1', 'tools/platform_pins.py', 'build/prepare-ungoogled.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-
      - name: Select compile parallelism
        run: python3 tools/build_resources.py --github-env

      - name: Run stage 6
        id: stage
        env:
          CHROMIX_BUILD_PROFILE: ${{ inputs.build_profile }}
          CHROMIX_LINUX157_PRE_GN_RECOVERY: ${{ inputs.linux157_pre_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_POST_GN_RECOVERY: ${{ inputs.linux157_post_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_LOCALE_RECOVERY: ${{ inputs.linux157_locale_recovery && '1' || '0' }}
          CHROMIX_MACOS_COMPILE_RELEASE: ${{ inputs.platform == 'macos' && inputs.macos_compile_release && '1' || '0' }}
          # Mac runtime gates need 45m in addition to packaging/checkpoint reserve.
          CHROMIX_RESERVE_MINUTES: ${{ inputs.platform == 'macos' && '90' || inputs['max-stages'] == 1 && '15' || '45' }}
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
          GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          NOW_EPOCH="$(date +%s)"
          DEADLINE_EPOCH=$(( NOW_EPOCH + 300 * 60 ))
          JOB_DEADLINE_EPOCH=$(( CHROMIX_JOB_START_EPOCH + 330 * 60 ))
          if [ "$DEADLINE_EPOCH" -gt "$JOB_DEADLINE_EPOCH" ]; then
            DEADLINE_EPOCH="$JOB_DEADLINE_EPOCH"
          fi
          if build/posix/ci-stage-mac157-arm64-stage5.sh \
            --platform '${{ inputs.platform }}' --arch '${{ inputs.arch }}' \
            --workdir "${RUNNER_TEMP}/chromix-build" \
            --stage-index 6 --max-stages '${{ inputs['max-stages'] }}' --from-snapshot "${RUNNER_TEMP}/chromix-restore" \
            --deadline-epoch "$DEADLINE_EPOCH" \
            2>&1 | tee "${RUNNER_TEMP}/chromix-logs/stage-6.log"; then
            exit 0
          else
            # Capture both statuses before any command overwrites PIPESTATUS.
            codes=("${PIPESTATUS[@]}")
            if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
            exit "${codes[1]}"
          fi
      - name: Upload final bundle (compile-release)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fingerprint source receipt (compile-release)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-fingerprint-source
          path: ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/source-final.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics (compile-release)
        if: ${{ !cancelled() && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-logs-s6-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/chromix-logs/
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-6/
            ${{ runner.temp }}/chromix-build/src/out/Chromix/args.gn
            ${{ runner.temp }}/chromix-build/src/out/Default/args.gn
            ${{ runner.temp }}/chromix-build/src/.chromix-upstream-restored.json
            ${{ runner.temp }}/chromix-build/src/.chromix-restored-patches.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-*.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-in-progress
            ${{ runner.temp }}/chromix-build/linux157-failed.json
            ${{ runner.temp }}/chromix-build/linux157-compiled.json
            ${{ runner.temp }}/chromix-build/linux157-checkpoint-download.json
            ${{ runner.temp }}/chromix-build/linux157-pre-gn-origin/
            ${{ runner.temp }}/chromix-build/linux157-postgn-download.json
            ${{ runner.temp }}/chromix-build/linux157-postgn-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-download.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-locale-migration-in-progress
            ${{ runner.temp }}/chromix-build/upstream-cache-restore.json
            ${{ runner.temp }}/chromix-build/upstream-cache-preparation.json
            ${{ runner.temp }}/chromix-build/upstream-cache-ninja.json
            ${{ runner.temp }}/chromix-build/upstream-cache-import.json
            ${{ runner.temp }}/chromix-build/upstream-cache-plan.log
            ${{ runner.temp }}/chromix-build/upstream-reuse/
            ${{ runner.temp }}/chromix-build/upstream-object-cache.json
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-upstream/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed macOS runtime bundle
        if: ${{ !cancelled() && inputs.platform == 'macos' && steps.stage.outcome == 'failure' && steps.stage.outputs.package_ready == 'true' && steps.stage.outputs.runtime_failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-failed-runtime-s6-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-6/
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-logs/stage-6.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve latest macOS compiled checkpoint
        id: runtime_checkpoint
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        if: ${{ !cancelled() && inputs.platform == 'macos' && (steps.stage.outputs.compiled_ready == 'true' || (inputs.resume_migration == 'mac156-x64-stage8' && failure()) || (inputs.resume_migration == 'mac156-x64-stage2' && failure()) || (inputs.resume_migration == 'mac156-x64-stage3' && failure())) }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          test -d "$WORK/src"
          if { [ '${{ inputs.resume_migration }}' != mac156-x64-stage8 ] &&
               [ '${{ inputs.resume_migration }}' != mac156-x64-stage2 ] &&
               [ '${{ inputs.resume_migration }}' != mac156-x64-stage3 ]; } ||
             [ '${{ steps.stage.outputs.upload_snapshot }}' != true ]; then
            bash build/posix/ci-parts.sh "$WORK" "$WORK/.snapshot-stage-6"
          fi
          echo "upload_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Upload failed Linux runtime bundle
        if: ${{ !cancelled() && inputs.platform == 'linux' && steps.stage.outcome == 'failure' && steps.stage.outputs.package_ready == 'true' && steps.stage.outputs.runtime_failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-failed-runtime-s6-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-logs/stage-6.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve latest failed Linux source/output checkpoint
        id: linux_runtime_checkpoint
        if: ${{ !cancelled() && inputs.platform == 'linux' && steps.stage.outcome == 'failure' }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          python3 - "$WORK" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          work = Path(sys.argv[1])
          if work.is_symlink() or not work.is_dir() or work.resolve() != work:
              raise SystemExit("unsafe Linux checkpoint work directory")
          if (work / "src").is_symlink() or not (work / "src").is_dir():
              raise SystemExit("Linux checkpoint source directory is missing or unsafe")
          # Only redundant copies; retain the bundle, source, objects and caches.
          copies = [work / "smoke", work / "dist/chromix"]
          snapshots = [work / f".snapshot-stage-{stage}" for stage in range(1, 9)]
          for path in [*copies, *snapshots]:
              if path.is_symlink() or path.resolve() != path:
                  raise SystemExit(f"unsafe Linux checkpoint cleanup path: {path}")
          for path in [*copies, *snapshots]:
              if path.is_dir():
                  shutil.rmtree(path)
          PY
          if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
            CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
              --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s6.json"
          else
            python3 tools/verify_linux_checkpoint.py --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s6.json"
          fi
          bash build/posix/ci-parts.sh "$WORK" "$WORK/.snapshot-stage-6"
          echo "upload_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Verify handoff snapshot
        id: checkpoint
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        run: |
          set -euo pipefail
          SNAP="${RUNNER_TEMP}/chromix-build/.snapshot-stage-6"
          UPLOAD_IDENTITY="${RUNNER_TEMP}/chromix-logs/checkpoint-upload-identity-s6.json"
          LINUX157_UPLOAD=0
          if [ '${{ inputs.platform }}' = linux ]; then
            if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "${RUNNER_TEMP}/chromix-logs/checkpoint-upload-source-s6.json"
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/verify_linux157_upload.py \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' > "$UPLOAD_IDENTITY"
              LINUX157_UPLOAD=1
            else
              python3 tools/verify_linux_checkpoint.py --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "$UPLOAD_IDENTITY"
            fi
          fi
          test -d "$SNAP/p1"
          if [ "$LINUX157_UPLOAD" = 1 ]; then
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_linux157_upload.py --archive-report "$UPLOAD_IDENTITY"
          else
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_snapshot_tar.py
          fi

      - name: Upload tree part 1
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s6-attempt-${{ github.run_attempt }}-part1
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-6/p1/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 2
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s6-attempt-${{ github.run_attempt }}-part2
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-6/p2/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 3
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s6-attempt-${{ github.run_attempt }}-part3
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-6/p3/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 4
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s6-attempt-${{ github.run_attempt }}-part4
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-6/p4/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload final bundle
        if: steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy != 'macos-compile-release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: always() && !(inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-logs-s6-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/chromix-logs/
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-6/
            ${{ runner.temp }}/chromix-build/src/out/Chromix/args.gn
            ${{ runner.temp }}/chromix-build/src/out/Default/args.gn
            ${{ runner.temp }}/chromix-build/src/.chromix-upstream-restored.json
            ${{ runner.temp }}/chromix-build/src/.chromix-restored-patches.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-*.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-in-progress
            ${{ runner.temp }}/chromix-build/linux157-failed.json
            ${{ runner.temp }}/chromix-build/linux157-compiled.json
            ${{ runner.temp }}/chromix-build/linux157-checkpoint-download.json
            ${{ runner.temp }}/chromix-build/linux157-pre-gn-origin/
            ${{ runner.temp }}/chromix-build/linux157-postgn-download.json
            ${{ runner.temp }}/chromix-build/linux157-postgn-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-download.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-locale-migration-in-progress
            ${{ runner.temp }}/chromix-build/upstream-cache-restore.json
            ${{ runner.temp }}/chromix-build/upstream-cache-preparation.json
            ${{ runner.temp }}/chromix-build/upstream-cache-ninja.json
            ${{ runner.temp }}/chromix-build/upstream-cache-import.json
            ${{ runner.temp }}/chromix-build/upstream-cache-plan.log
            ${{ runner.temp }}/chromix-build/upstream-reuse/
            ${{ runner.temp }}/chromix-build/upstream-object-cache.json
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-upstream/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload fingerprint source receipt
        if: steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy != 'macos-compile-release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-fingerprint-source
          path: ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/source-final.json
          if-no-files-found: error
          retention-days: 14

  posix-7:
    name: ${{ inputs.platform }}-${{ inputs.arch }} stage 7 (resume compile)
    needs: posix-6
    if: >-
      always() && inputs['max-stages'] >= 7 &&
      needs.posix-6.result == 'success' &&
      needs.posix-6.outputs.finished != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      snapshot_attempt: ${{ steps.snapshot_origin.outputs.attempt }}
    steps:
      - name: Record runner resources
        run: |
          set -euo pipefail
          echo "CHROMIX_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/chromix-logs"
          {
            uname -a
            case "$(uname -s)" in
              Linux) getconf _NPROCESSORS_ONLN; free -h ;;
              Darwin) sysctl hw.ncpu hw.memsize ;;
            esac
            df -h
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/runner.log"

      - uses: actions/checkout@v4

      - name: Require exact mac157 ARM64 stage5 route
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.runner }}' = macos:arm64:macos-26
          test '${{ inputs.artifact }}:${{ inputs.max-stages }}' = chromix-mac157-arm64-stage5-resume:8
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_tree_stage }}:${{ inputs.resume_attempt }}:${{ inputs.resume_artifact_ids }}' = mac157-arm64-stage5:44567777209:5:1:14626292942
          test '${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}:${{ inputs.macos_compile_release }}' = fast:true:true
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' = false:false:false

      - name: Record snapshot producer attempt
        id: snapshot_origin
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Enable fixed unchanged mac156 Intel stage3 continuation
        if: inputs.resume_migration == 'mac156-x64-stage3'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage3' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel stage2 continuation
        if: inputs.resume_migration == 'mac156-x64-stage2'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage2' >> "$GITHUB_ENV"
      - name: Enable fixed mac157 ICU/UA source migration
        if: inputs.resume_migration == 'mac157-arm64-stage5'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac157-arm64-stage5' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 stage1 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage1'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage1' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage8' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel continuation
        if: inputs.resume_migration == 'mac156-x64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage8' >> "$GITHUB_ENV"

      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /usr/lib/jvm \
            /usr/local/share/boost /usr/share/swift \
            /usr/lib/dotnet /usr/lib/google-cloud-sdk
          sudo docker system prune -af || true
          df -h

      # Match Chromium's install-build-deps; Go is pinned by setup-go below.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            apparmor-utils bison clang clang-format cmake curl flex g++ git gperf \
            libasound2-dev libatk1.0-dev libcups2-dev libdrm-dev libegl1-mesa-dev \
            libevent-dev libflac-dev libgbm-dev libglib2.0-dev libgtk-3-dev \
            libjpeg-dev libnss3-dev libopus-dev libpam0g-dev libpci-dev \
            libpipewire-0.3-dev libpulse-dev libspeechd-dev libudev-dev \
            libva-dev libvpx-dev libwebp-dev libx11-xcb-dev libxcb-dri3-dev \
            libxshmfence-dev libxslt1-dev libxss-dev libxtst-dev mesa-common-dev \
            ninja-build pkg-config python3-jinja2 python3-pyparsing \
            python3-setuptools python3-six rsync uuid-dev xz-utils yasm zip unzip \
            zstd patch file

      - name: Install restored-build Ninja v6
        if: runner.os == 'Linux' && inputs.use_upstream_cache
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              NINJA_ARCHIVE=ninja-linux.zip
              NINJA_SHA256=6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255 ;;
            aarch64)
              NINJA_ARCHIVE=ninja-linux-aarch64.zip
              NINJA_SHA256=5c25c6570b0155e95fce5918cb95f1ad9870df5768653afe128db822301a05a1 ;;
            *) exit 1 ;;
          esac
          NINJA_DIR="$(mktemp -d "${RUNNER_TEMP}/chromix-ninja-v6.XXXXXX")"
          curl --fail --location --retry 3 --max-time 120 --max-filesize 2097152 \
            "https://github.com/ninja-build/ninja/releases/download/v1.12.1/${NINJA_ARCHIVE}" \
            -o "${NINJA_DIR}/ninja.zip"
          printf '%s  %s\n' "$NINJA_SHA256" "${NINJA_DIR}/ninja.zip" | sha256sum --check --strict
          unzip -q "${NINJA_DIR}/ninja.zip" ninja -d "$NINJA_DIR"
          rm "${NINJA_DIR}/ninja.zip"
          chmod +x "${NINJA_DIR}/ninja"
          test "$("${NINJA_DIR}/ninja" --version)" = 1.12.1
          printf '%s\n' "$NINJA_DIR" >> "$GITHUB_PATH"
      - name: Select compatible Xcode
        if: runner.os == 'macOS'
        run: bash build/macos/select-xcode.sh

      - name: Free macOS disk space
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          python3 build/macos/free-disk-space.py 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/disk-cleanup.log"

      - name: Inspect macOS toolchain
        if: runner.os == 'macOS'
        run: |
          {
            sw_vers
            xcode-select -p
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-path
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/xcode.log"

      - name: Disable Spotlight indexing
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          volume=/System/Volumes/Data
          for attempt in 1 2 3; do
            if sudo mdutil -i off "$volume"; then
              echo "Requested indexing disable on $volume"
            fi
            if status=$(sudo mdutil -s "$volume"); then
              printf '%s\n' "$status"
              if printf '%s\n' "$status" | grep -Eq '^[[:space:]]*Indexing( and searching)? disabled\.[[:space:]]*$'; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo "::error::Unable to verify Spotlight indexing is disabled on $volume"
          exit 1

      # Chromium supplies clang; Homebrew supplies the remaining build tools.
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja coreutils gpatch zstd
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify Go version
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve platform Chromium version
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          CHROMIUM_VERSION="$(python3 tools/platform_pins.py --platform "$BUILD_PLATFORM" --field ChromiumVersion)"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> "$GITHUB_ENV"
      - name: Verify complete Mac SDK contents
        if: runner.os == 'macOS' && inputs.use_upstream_cache
        run: python3 tools/inspect_macos_sdk.py --report "${RUNNER_TEMP}/chromix-logs/sdk-content.json"
      - name: Guard exact Linux157 compiled locale recovery
        if: inputs.linux157_locale_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:x64:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}' = false:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64

      - name: Guard exact Linux157 post-GN recovery request
        if: inputs.linux157_post_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}' = false
          test '${{ inputs.linux157_locale_recovery }}' = false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Guard exact Linux157 pre-GN recovery request
        if: inputs.linux157_pre_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Validate exact Linux157 fresh source route
        if: inputs.platform == 'linux' && env.CHROMIUM_VERSION == '157.0.8103.78'
        env:
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
        run: |
          set -euo pipefail
          case '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' in
            true:false:false|false:true:false|false:false:true) ;;
            *) echo 'Select exactly one reviewed Linux157 recovery route' >&2; exit 1 ;;
          esac
          test '${{ inputs.resume_migration }}' = ''
          test '${{ inputs.resume_run_id }}' = ''
          test "$(uname -m)" = x86_64
          python3 tools/linux157_source.py --phase route --arch '${{ inputs.arch }}' \
            > "${RUNNER_TEMP}/chromix-logs/linux157-recipe.json"

      - name: Record exact mac156 handoff producer attempt
        if: inputs.resume_migration == 'mac157-arm64-stage5' || inputs.resume_migration == 'mac156-x64-stage3' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-x64-stage8'
        env:
          PRODUCER_ATTEMPT: ${{ needs.posix-6.outputs.snapshot_attempt }}
        run: echo "CHROMIX_PREVIOUS_ATTEMPT=$PRODUCER_ATTEMPT" >> "$GITHUB_ENV"
      - name: Download tree from previous stage
        if: success()
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact }}-tree-s6-attempt-${{ needs.posix-6.outputs.snapshot_attempt }}-part*
          merge-multiple: true
          path: ${{ runner.temp }}/chromix-restore

      # The pinned download cache is deliberately outside the tree snapshot;
      # re-warm it first so a resumed preparation does not redownload archives.
      - name: Restore pinned source downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/chromix-build/download_cache
          key: ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-${{ env.CHROMIUM_VERSION }}-${{ hashFiles('CHROMIUM_VERSION', 'CHROMIUM_LINUX_VERSION', 'CHROMIUM_MACOS_VERSION', 'build/ungoogled-revisions.psd1', 'tools/platform_pins.py', 'build/prepare-ungoogled.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-
      - name: Select compile parallelism
        run: python3 tools/build_resources.py --github-env

      - name: Run stage 7
        id: stage
        env:
          CHROMIX_BUILD_PROFILE: ${{ inputs.build_profile }}
          CHROMIX_LINUX157_PRE_GN_RECOVERY: ${{ inputs.linux157_pre_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_POST_GN_RECOVERY: ${{ inputs.linux157_post_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_LOCALE_RECOVERY: ${{ inputs.linux157_locale_recovery && '1' || '0' }}
          CHROMIX_MACOS_COMPILE_RELEASE: ${{ inputs.platform == 'macos' && inputs.macos_compile_release && '1' || '0' }}
          # Mac runtime gates need 45m in addition to packaging/checkpoint reserve.
          CHROMIX_RESERVE_MINUTES: ${{ inputs.platform == 'macos' && '90' || inputs['max-stages'] == 1 && '15' || '45' }}
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
          GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          NOW_EPOCH="$(date +%s)"
          DEADLINE_EPOCH=$(( NOW_EPOCH + 300 * 60 ))
          JOB_DEADLINE_EPOCH=$(( CHROMIX_JOB_START_EPOCH + 330 * 60 ))
          if [ "$DEADLINE_EPOCH" -gt "$JOB_DEADLINE_EPOCH" ]; then
            DEADLINE_EPOCH="$JOB_DEADLINE_EPOCH"
          fi
          if build/posix/ci-stage-mac157-arm64-stage5.sh \
            --platform '${{ inputs.platform }}' --arch '${{ inputs.arch }}' \
            --workdir "${RUNNER_TEMP}/chromix-build" \
            --stage-index 7 --max-stages '${{ inputs['max-stages'] }}' --from-snapshot "${RUNNER_TEMP}/chromix-restore" \
            --deadline-epoch "$DEADLINE_EPOCH" \
            2>&1 | tee "${RUNNER_TEMP}/chromix-logs/stage-7.log"; then
            exit 0
          else
            # Capture both statuses before any command overwrites PIPESTATUS.
            codes=("${PIPESTATUS[@]}")
            if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
            exit "${codes[1]}"
          fi
      - name: Upload final bundle (compile-release)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fingerprint source receipt (compile-release)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-fingerprint-source
          path: ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/source-final.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics (compile-release)
        if: ${{ !cancelled() && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-logs-s7-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/chromix-logs/
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-7/
            ${{ runner.temp }}/chromix-build/src/out/Chromix/args.gn
            ${{ runner.temp }}/chromix-build/src/out/Default/args.gn
            ${{ runner.temp }}/chromix-build/src/.chromix-upstream-restored.json
            ${{ runner.temp }}/chromix-build/src/.chromix-restored-patches.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-*.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-in-progress
            ${{ runner.temp }}/chromix-build/linux157-failed.json
            ${{ runner.temp }}/chromix-build/linux157-compiled.json
            ${{ runner.temp }}/chromix-build/linux157-checkpoint-download.json
            ${{ runner.temp }}/chromix-build/linux157-pre-gn-origin/
            ${{ runner.temp }}/chromix-build/linux157-postgn-download.json
            ${{ runner.temp }}/chromix-build/linux157-postgn-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-download.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-locale-migration-in-progress
            ${{ runner.temp }}/chromix-build/upstream-cache-restore.json
            ${{ runner.temp }}/chromix-build/upstream-cache-preparation.json
            ${{ runner.temp }}/chromix-build/upstream-cache-ninja.json
            ${{ runner.temp }}/chromix-build/upstream-cache-import.json
            ${{ runner.temp }}/chromix-build/upstream-cache-plan.log
            ${{ runner.temp }}/chromix-build/upstream-reuse/
            ${{ runner.temp }}/chromix-build/upstream-object-cache.json
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-upstream/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload failed macOS runtime bundle
        if: ${{ !cancelled() && inputs.platform == 'macos' && steps.stage.outcome == 'failure' && steps.stage.outputs.package_ready == 'true' && steps.stage.outputs.runtime_failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-failed-runtime-s7-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-7/
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-logs/stage-7.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve latest macOS compiled checkpoint
        id: runtime_checkpoint
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        if: ${{ !cancelled() && inputs.platform == 'macos' && (steps.stage.outputs.compiled_ready == 'true' || (inputs.resume_migration == 'mac156-x64-stage8' && failure()) || (inputs.resume_migration == 'mac156-x64-stage2' && failure()) || (inputs.resume_migration == 'mac156-x64-stage3' && failure())) }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          test -d "$WORK/src"
          if { [ '${{ inputs.resume_migration }}' != mac156-x64-stage8 ] &&
               [ '${{ inputs.resume_migration }}' != mac156-x64-stage2 ] &&
               [ '${{ inputs.resume_migration }}' != mac156-x64-stage3 ]; } ||
             [ '${{ steps.stage.outputs.upload_snapshot }}' != true ]; then
            bash build/posix/ci-parts.sh "$WORK" "$WORK/.snapshot-stage-7"
          fi
          echo "upload_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Upload failed Linux runtime bundle
        if: ${{ !cancelled() && inputs.platform == 'linux' && steps.stage.outcome == 'failure' && steps.stage.outputs.package_ready == 'true' && steps.stage.outputs.runtime_failed == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-failed-runtime-s7-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-logs/stage-7.log
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Preserve latest failed Linux source/output checkpoint
        id: linux_runtime_checkpoint
        if: ${{ !cancelled() && inputs.platform == 'linux' && steps.stage.outcome == 'failure' }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/chromix-build"
          python3 - "$WORK" <<'PY'
          from pathlib import Path
          import shutil
          import sys

          work = Path(sys.argv[1])
          if work.is_symlink() or not work.is_dir() or work.resolve() != work:
              raise SystemExit("unsafe Linux checkpoint work directory")
          if (work / "src").is_symlink() or not (work / "src").is_dir():
              raise SystemExit("Linux checkpoint source directory is missing or unsafe")
          # Only redundant copies; retain the bundle, source, objects and caches.
          copies = [work / "smoke", work / "dist/chromix"]
          snapshots = [work / f".snapshot-stage-{stage}" for stage in range(1, 9)]
          for path in [*copies, *snapshots]:
              if path.is_symlink() or path.resolve() != path:
                  raise SystemExit(f"unsafe Linux checkpoint cleanup path: {path}")
          for path in [*copies, *snapshots]:
              if path.is_dir():
                  shutil.rmtree(path)
          PY
          if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
            CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
              --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s7.json"
          else
            python3 tools/verify_linux_checkpoint.py --workdir "$WORK" --arch '${{ inputs.arch }}' \
              > "${RUNNER_TEMP}/chromix-logs/checkpoint-identity-s7.json"
          fi
          bash build/posix/ci-parts.sh "$WORK" "$WORK/.snapshot-stage-7"
          echo "upload_snapshot=true" >> "$GITHUB_OUTPUT"

      - name: Verify handoff snapshot
        id: checkpoint
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        run: |
          set -euo pipefail
          SNAP="${RUNNER_TEMP}/chromix-build/.snapshot-stage-7"
          UPLOAD_IDENTITY="${RUNNER_TEMP}/chromix-logs/checkpoint-upload-identity-s7.json"
          LINUX157_UPLOAD=0
          if [ '${{ inputs.platform }}' = linux ]; then
            if [ "${CHROMIUM_VERSION:-}" = 157.0.8103.78 ]; then
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/linux157_source.py --phase checkpoint \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "${RUNNER_TEMP}/chromix-logs/checkpoint-upload-source-s7.json"
              CHROMIX_USE_UPSTREAM_CACHE=0 python3 tools/verify_linux157_upload.py \
                --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' > "$UPLOAD_IDENTITY"
              LINUX157_UPLOAD=1
            else
              python3 tools/verify_linux_checkpoint.py --workdir "${RUNNER_TEMP}/chromix-build" --arch '${{ inputs.arch }}' \
                > "$UPLOAD_IDENTITY"
            fi
          fi
          test -d "$SNAP/p1"
          if [ "$LINUX157_UPLOAD" = 1 ]; then
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_linux157_upload.py --archive-report "$UPLOAD_IDENTITY"
          else
            python3 tools/snapshot_volumes.py "$SNAP" |
              xargs -0 cat | zstd -d -T0 | python3 tools/verify_snapshot_tar.py
          fi

      - name: Upload tree part 1
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s7-attempt-${{ github.run_attempt }}-part1
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-7/p1/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 2
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s7-attempt-${{ github.run_attempt }}-part2
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-7/p2/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 3
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s7-attempt-${{ github.run_attempt }}-part3
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-7/p3/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload tree part 4
        if: ${{ !cancelled() && (steps.stage.outputs.upload_snapshot == 'true' || steps.runtime_checkpoint.outputs.upload_snapshot == 'true' || (inputs.platform == 'linux' && steps.linux_runtime_checkpoint.outputs.upload_snapshot == 'true')) && steps.checkpoint.outcome == 'success' }}
        continue-on-error: ${{ inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-tree-s7-attempt-${{ github.run_attempt }}-part4
          path: ${{ runner.temp }}/chromix-build/.snapshot-stage-7/p4/
          if-no-files-found: warn
          retention-days: ${{ inputs.platform == 'macos' && 14 || 3 }}
          compression-level: 0
      - name: Upload final bundle
        if: steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy != 'macos-compile-release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: always() && !(inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-logs-s7-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/chromix-logs/
            ${{ runner.temp }}/chromix-build/runtime-smoke-stage-7/
            ${{ runner.temp }}/chromix-build/src/out/Chromix/args.gn
            ${{ runner.temp }}/chromix-build/src/out/Default/args.gn
            ${{ runner.temp }}/chromix-build/src/.chromix-upstream-restored.json
            ${{ runner.temp }}/chromix-build/src/.chromix-restored-patches.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-*.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-in-progress
            ${{ runner.temp }}/chromix-build/linux157-failed.json
            ${{ runner.temp }}/chromix-build/linux157-compiled.json
            ${{ runner.temp }}/chromix-build/linux157-checkpoint-download.json
            ${{ runner.temp }}/chromix-build/linux157-pre-gn-origin/
            ${{ runner.temp }}/chromix-build/linux157-postgn-download.json
            ${{ runner.temp }}/chromix-build/linux157-postgn-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-origin/
            ${{ runner.temp }}/chromix-build/linux157-locale-download.json
            ${{ runner.temp }}/chromix-build/src/.chromix-linux157-locale-migration-in-progress
            ${{ runner.temp }}/chromix-build/upstream-cache-restore.json
            ${{ runner.temp }}/chromix-build/upstream-cache-preparation.json
            ${{ runner.temp }}/chromix-build/upstream-cache-ninja.json
            ${{ runner.temp }}/chromix-build/upstream-cache-import.json
            ${{ runner.temp }}/chromix-build/upstream-cache-plan.log
            ${{ runner.temp }}/chromix-build/upstream-reuse/
            ${{ runner.temp }}/chromix-build/upstream-object-cache.json
            ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/
            ${{ runner.temp }}/chromix-upstream/result.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload fingerprint source receipt
        if: steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy != 'macos-compile-release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}-fingerprint-source
          path: ${{ runner.temp }}/chromix-build/fingerprint-diagnostics/source-final.json
          if-no-files-found: error
          retention-days: 14

  posix-8:
    name: ${{ inputs.platform }}-${{ inputs.arch }} stage 8 (resume compile)
    needs: posix-7
    if: >-
      always() && inputs['max-stages'] >= 8 &&
      needs.posix-7.result == 'success' &&
      needs.posix-7.outputs.finished != 'true'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      snapshot_attempt: ${{ steps.snapshot_origin.outputs.attempt }}
    steps:
      - name: Record runner resources
        run: |
          set -euo pipefail
          echo "CHROMIX_JOB_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
          mkdir -p "${RUNNER_TEMP}/chromix-logs"
          {
            uname -a
            case "$(uname -s)" in
              Linux) getconf _NPROCESSORS_ONLN; free -h ;;
              Darwin) sysctl hw.ncpu hw.memsize ;;
            esac
            df -h
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/runner.log"

      - uses: actions/checkout@v4

      - name: Require exact mac157 ARM64 stage5 route
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.runner }}' = macos:arm64:macos-26
          test '${{ inputs.artifact }}:${{ inputs.max-stages }}' = chromix-mac157-arm64-stage5-resume:8
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_tree_stage }}:${{ inputs.resume_attempt }}:${{ inputs.resume_artifact_ids }}' = mac157-arm64-stage5:44567777209:5:1:14626292942
          test '${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}:${{ inputs.macos_compile_release }}' = fast:true:true
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' = false:false:false

      - name: Record snapshot producer attempt
        id: snapshot_origin
        run: echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Enable fixed unchanged mac156 Intel stage3 continuation
        if: inputs.resume_migration == 'mac156-x64-stage3'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage3' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel stage2 continuation
        if: inputs.resume_migration == 'mac156-x64-stage2'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage2' >> "$GITHUB_ENV"
      - name: Enable fixed mac157 ICU/UA source migration
        if: inputs.resume_migration == 'mac157-arm64-stage5'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac157-arm64-stage5' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 stage1 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage1'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage1' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 continuation
        if: inputs.resume_migration == 'mac156-arm64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-arm64-stage8' >> "$GITHUB_ENV"
      - name: Enable fixed unchanged mac156 Intel continuation
        if: inputs.resume_migration == 'mac156-x64-stage8'
        run: echo 'CHROMIX_UNCHANGED_RESUME=mac156-x64-stage8' >> "$GITHUB_ENV"

      - name: Free Linux disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /usr/lib/jvm \
            /usr/local/share/boost /usr/share/swift \
            /usr/lib/dotnet /usr/lib/google-cloud-sdk
          sudo docker system prune -af || true
          df -h

      # Match Chromium's install-build-deps; Go is pinned by setup-go below.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            apparmor-utils bison clang clang-format cmake curl flex g++ git gperf \
            libasound2-dev libatk1.0-dev libcups2-dev libdrm-dev libegl1-mesa-dev \
            libevent-dev libflac-dev libgbm-dev libglib2.0-dev libgtk-3-dev \
            libjpeg-dev libnss3-dev libopus-dev libpam0g-dev libpci-dev \
            libpipewire-0.3-dev libpulse-dev libspeechd-dev libudev-dev \
            libva-dev libvpx-dev libwebp-dev libx11-xcb-dev libxcb-dri3-dev \
            libxshmfence-dev libxslt1-dev libxss-dev libxtst-dev mesa-common-dev \
            ninja-build pkg-config python3-jinja2 python3-pyparsing \
            python3-setuptools python3-six rsync uuid-dev xz-utils yasm zip unzip \
            zstd patch file

      - name: Install restored-build Ninja v6
        if: runner.os == 'Linux' && inputs.use_upstream_cache
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)
              NINJA_ARCHIVE=ninja-linux.zip
              NINJA_SHA256=6f98805688d19672bd699fbbfa2c2cf0fc054ac3df1f0e6a47664d963d530255 ;;
            aarch64)
              NINJA_ARCHIVE=ninja-linux-aarch64.zip
              NINJA_SHA256=5c25c6570b0155e95fce5918cb95f1ad9870df5768653afe128db822301a05a1 ;;
            *) exit 1 ;;
          esac
          NINJA_DIR="$(mktemp -d "${RUNNER_TEMP}/chromix-ninja-v6.XXXXXX")"
          curl --fail --location --retry 3 --max-time 120 --max-filesize 2097152 \
            "https://github.com/ninja-build/ninja/releases/download/v1.12.1/${NINJA_ARCHIVE}" \
            -o "${NINJA_DIR}/ninja.zip"
          printf '%s  %s\n' "$NINJA_SHA256" "${NINJA_DIR}/ninja.zip" | sha256sum --check --strict
          unzip -q "${NINJA_DIR}/ninja.zip" ninja -d "$NINJA_DIR"
          rm "${NINJA_DIR}/ninja.zip"
          chmod +x "${NINJA_DIR}/ninja"
          test "$("${NINJA_DIR}/ninja" --version)" = 1.12.1
          printf '%s\n' "$NINJA_DIR" >> "$GITHUB_PATH"
      - name: Select compatible Xcode
        if: runner.os == 'macOS'
        run: bash build/macos/select-xcode.sh

      - name: Free macOS disk space
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          python3 build/macos/free-disk-space.py 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/disk-cleanup.log"

      - name: Inspect macOS toolchain
        if: runner.os == 'macOS'
        run: |
          {
            sw_vers
            xcode-select -p
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-version
            xcrun --sdk macosx --show-sdk-path
          } 2>&1 | tee "${RUNNER_TEMP}/chromix-logs/xcode.log"

      - name: Disable Spotlight indexing
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          volume=/System/Volumes/Data
          for attempt in 1 2 3; do
            if sudo mdutil -i off "$volume"; then
              echo "Requested indexing disable on $volume"
            fi
            if status=$(sudo mdutil -s "$volume"); then
              printf '%s\n' "$status"
              if printf '%s\n' "$status" | grep -Eq '^[[:space:]]*Indexing( and searching)? disabled\.[[:space:]]*$'; then
                exit 0
              fi
            fi
            if [ "$attempt" -lt 3 ]; then sleep 3; fi
          done
          echo "::error::Unable to verify Spotlight indexing is disabled on $volume"
          exit 1

      # Chromium supplies clang; Homebrew supplies the remaining build tools.
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja coreutils gpatch zstd
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false

      - name: Verify Go version
        run: |
          go version
          test "$(go env GOVERSION)" = go1.27.1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve platform Chromium version
        env:
          BUILD_PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          CHROMIUM_VERSION="$(python3 tools/platform_pins.py --platform "$BUILD_PLATFORM" --field ChromiumVersion)"
          echo "CHROMIUM_VERSION=$CHROMIUM_VERSION" >> "$GITHUB_ENV"
      - name: Verify complete Mac SDK contents
        if: runner.os == 'macOS' && inputs.use_upstream_cache
        run: python3 tools/inspect_macos_sdk.py --report "${RUNNER_TEMP}/chromix-logs/sdk-content.json"
      - name: Guard exact Linux157 compiled locale recovery
        if: inputs.linux157_locale_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.arch }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:x64:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}' = false:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64

      - name: Guard exact Linux157 post-GN recovery request
        if: inputs.linux157_post_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test '${{ inputs.linux157_pre_gn_recovery }}' = false
          test '${{ inputs.linux157_locale_recovery }}' = false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Guard exact Linux157 pre-GN recovery request
        if: inputs.linux157_pre_gn_recovery
        run: |
          set -euo pipefail
          test '${{ github.repository }}:${{ github.event_name }}:${{ github.ref }}' = xiaozhou26/Chromix:workflow_dispatch:refs/heads/main
          test '${{ inputs.platform }}:${{ inputs.build_profile }}:${{ inputs.use_upstream_cache }}' = linux:fast:false
          test "$CHROMIUM_VERSION" = 157.0.8103.78
          test '${{ inputs.resume_migration }}:${{ inputs.resume_run_id }}:${{ inputs.resume_artifact_ids }}' = ::
          test '${{ inputs.resume_attempt }}' = 1
          test "$(uname -m)" = x86_64
          case '${{ inputs.arch }}' in x64|arm64) ;; *) exit 1 ;; esac

      - name: Validate exact Linux157 fresh source route
        if: inputs.platform == 'linux' && env.CHROMIUM_VERSION == '157.0.8103.78'
        env:
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
        run: |
          set -euo pipefail
          case '${{ inputs.linux157_pre_gn_recovery }}:${{ inputs.linux157_post_gn_recovery }}:${{ inputs.linux157_locale_recovery }}' in
            true:false:false|false:true:false|false:false:true) ;;
            *) echo 'Select exactly one reviewed Linux157 recovery route' >&2; exit 1 ;;
          esac
          test '${{ inputs.resume_migration }}' = ''
          test '${{ inputs.resume_run_id }}' = ''
          test "$(uname -m)" = x86_64
          python3 tools/linux157_source.py --phase route --arch '${{ inputs.arch }}' \
            > "${RUNNER_TEMP}/chromix-logs/linux157-recipe.json"

      - name: Record exact mac156 handoff producer attempt
        if: inputs.resume_migration == 'mac157-arm64-stage5' || inputs.resume_migration == 'mac156-x64-stage3' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-x64-stage8'
        env:
          PRODUCER_ATTEMPT: ${{ needs.posix-7.outputs.snapshot_attempt }}
        run: echo "CHROMIX_PREVIOUS_ATTEMPT=$PRODUCER_ATTEMPT" >> "$GITHUB_ENV"
      - name: Download tree from previous stage
        if: success()
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact }}-tree-s7-attempt-${{ needs.posix-7.outputs.snapshot_attempt }}-part*
          merge-multiple: true
          path: ${{ runner.temp }}/chromix-restore

      # The pinned download cache is deliberately outside the tree snapshot;
      # re-warm it first so a resumed preparation does not redownload archives.
      - name: Restore pinned source downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/chromix-build/download_cache
          key: ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-${{ env.CHROMIUM_VERSION }}-${{ hashFiles('CHROMIUM_VERSION', 'CHROMIUM_LINUX_VERSION', 'CHROMIUM_MACOS_VERSION', 'build/ungoogled-revisions.psd1', 'tools/platform_pins.py', 'build/prepare-ungoogled.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ inputs.platform }}-${{ inputs.arch }}-downloads-v2-
      - name: Select compile parallelism
        run: python3 tools/build_resources.py --github-env

      - name: Run stage 8
        id: stage
        env:
          CHROMIX_BUILD_PROFILE: ${{ inputs.build_profile }}
          CHROMIX_LINUX157_PRE_GN_RECOVERY: ${{ inputs.linux157_pre_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_POST_GN_RECOVERY: ${{ inputs.linux157_post_gn_recovery && '1' || '0' }}
          CHROMIX_LINUX157_LOCALE_RECOVERY: ${{ inputs.linux157_locale_recovery && '1' || '0' }}
          CHROMIX_MACOS_COMPILE_RELEASE: ${{ inputs.platform == 'macos' && inputs.macos_compile_release && '1' || '0' }}
          # Mac runtime gates need 45m in addition to packaging/checkpoint reserve.
          CHROMIX_RESERVE_MINUTES: ${{ inputs.platform == 'macos' && '90' || inputs['max-stages'] == 1 && '15' || '45' }}
          CHROMIX_USE_UPSTREAM_CACHE: ${{ inputs.use_upstream_cache && '1' || '0' }}
          GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN || github.token }}
        run: |
          set -euo pipefail
          NOW_EPOCH="$(date +%s)"
          DEADLINE_EPOCH=$(( NOW_EPOCH + 300 * 60 ))
          JOB_DEADLINE_EPOCH=$(( CHROMIX_JOB_START_EPOCH + 330 * 60 ))
          if [ "$DEADLINE_EPOCH" -gt "$JOB_DEADLINE_EPOCH" ]; then
            DEADLINE_EPOCH="$JOB_DEADLINE_EPOCH"
          fi
          if build/posix/ci-stage-mac157-arm64-stage5.sh \
            --platform '${{ inputs.platform }}' --arch '${{ inputs.arch }}' \
            --workdir "${RUNNER_TEMP}/chromix-build" \
            --stage-index 8 --max-stages '${{ inputs['max-stages'] }}' --from-snapshot "${RUNNER_TEMP}/chromix-restore" \
            --deadline-epoch "$DEADLINE_EPOCH" \
            2>&1 | tee "${RUNNER_TEMP}/chromix-logs/stage-8.log"; then
            exit 0
          else
            # Capture both statuses before any command overwrites PIPESTATUS.
            codes=("${PIPESTATUS[@]}")
            if [ "${codes[0]}" -ne 0 ]; then exit "${codes[0]}"; fi
            exit "${codes[1]}"
          fi
      - name: Upload final bundle (compile-release)
        if: ${{ !cancelled() && steps.stage.outcome == 'success' && inputs.platform == 'macos' && steps.stage.outputs.finished == 'true' && steps.stage.outputs.release_policy == 'macos-compile-release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: |
            ${{ runner.temp }}/chromix-build/dist/${{ inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-arm64-stage8' || inputs.resume_migration == 'mac156-arm64-stage1' || inputs.resume_migration == 'mac157-arm64-stage5') && 'chromix-mac-arm64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/${{ (inputs.resume_migration == 'mac156-x64-stage8' || inputs.resume_migration == 'mac156-x64-stage2' || inputs.resume_migration == 'mac156-x64-stage3') && 'chromix-mac-x64' || inputs.artifact }}.zip
            ${{ runner.temp }}/chromix-build/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload fingerprint source receipt (compile-release)

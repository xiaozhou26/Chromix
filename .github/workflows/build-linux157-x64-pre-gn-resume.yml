name: build-linux157-x64-pre-gn-resume
run-name: Linux157 x64 exact stage1 44547858334 GN recovery

on:
  workflow_dispatch:
    inputs:
      compile_jobs:
        description: 'Ninja jobs; donor/attempt/source/profile are fixed by the reviewed manifest'
        type: string
        default: auto

permissions:
  actions: read
  contents: read

concurrency:
  group: linux157-x64-pre-gn-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resume:
    name: Linux157 x64 (exact prepared stage1 + GN repair)
    uses: ./.github/workflows/build-posix-github.yml
    with:
      platform: linux
      arch: x64
      runner: ubuntu-22.04
      artifact: chromix-linux-x64
      max-stages: 8
      build_profile: fast
      compile_jobs: ${{ inputs.compile_jobs || 'auto' }}
      use_upstream_cache: false
      linux157_pre_gn_recovery: true
    secrets: inherit

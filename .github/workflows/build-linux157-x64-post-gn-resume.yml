name: build-linux157-x64-post-gn-resume
run-name: Linux157 x64 latest post-GN 44567777792 libclang repair

on:
  workflow_dispatch:
    inputs:
      compile_jobs:
        description: 'Ninja jobs; latest post-GN donor, source, GN graph and repair are fixed'
        type: string
        default: auto

permissions:
  actions: read
  contents: read

concurrency:
  group: linux157-x64-post-gn-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resume:
    name: Linux157 x64 (latest post-GN tree + official libclang)
    uses: ./.github/workflows/build-posix-github.yml
    with:
      platform: linux
      arch: x64
      runner: ubuntu-22.04
      artifact: chromix-linux-x64
      max-stages: 8
      build_profile: fast
      compile_jobs: ${{ inputs.compile_jobs || 'auto' }}
      use_upstream_cache: false
      linux157_post_gn_recovery: true
    secrets: inherit

name: build-macos-arm64

on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Completed Mac ARM64 run whose exact checkpoint starts this new eight-stage build'
        type: string
        default: ''
      resume_tree_stage:
        description: 'Donor checkpoint stage (1-8)'
        type: string
        default: '7'
      resume_artifact_ids:
        description: 'Complete comma-separated artifact ID set recorded for the donor checkpoint'
        type: string
        default: ''
      resume_attempt:
        description: 'Exact attempt that uploaded the donor checkpoint'
        type: string
        default: '1'
      compile_jobs:
        description: 'Ninja jobs: auto uses CPU/memory limits, or a positive integer'
        type: string
        default: auto
      build_profile:
        description: 'ThinLTO optimization profile'
        type: choice
        options: [fast, release]
        default: fast
      build_mode:
        description: 'Staged snapshot/resume or a single job that must finish'
        type: choice
        options: [staged, single]
        default: staged
      use_upstream_cache:
        description: 'Require pinned full upstream source + out/Default reuse; false permits cold builds'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'build/*'
      - 'build/macos/**'
      - 'build/posix/**'
      - 'patches/**'
      - 'assets/fonts/**'
      - 'tools/*upstream_cache.py'
      - 'tools/upstream_object_cache.py'
      - 'tools/upstream_script_identity.py'
      - 'tools/apply_restored_patches.py'
      - 'tools/prepare_restored_build.py'
      - 'tools/restore_ninja.py'
      - 'tools/bootstrap_gn.py'
      - 'tools/macos_runtime.py'
      - 'tools/restored_reuse_evidence.py'
      - 'sdk/python/chromix/_binary.py'
      - 'tools/gen_posix_workflow.py'
      - 'tools/merge_gn_args.py'
      - 'tools/build_resources.py'
      - 'tools/fingerprint*'
      - 'tools/verify_patch_stack.py'
      - 'tools/device_p0_audit.py'
      - 'tools/canvas_chain_audit.py'
      - 'tools/collect_device.py'
      - 'tools/device_pool.py'
      - 'sdk/python/chromix/_device*.py'
      - 'sdk/python/chromix/device_pool.py'
      - 'sdk/python/chromix/_canvas_chain.py'
      - 'sdk/python/chromix/_render_integration.py'
      - 'sdk/python/chromix/*.js'
      - 'sdk/python/pyproject.toml'
      - '.github/workflows/build-macos-arm64.yml'
      - '.github/workflows/build-posix-github.yml'
      - 'tools/platform_pins.py'
      - 'CHROMIUM_MACOS_VERSION'
      - 'CHROMIUM_VERSION'
      - 'UNGOOGLED_VERSION'

permissions:
  actions: read
  contents: read

concurrency:
  group: build-macos-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS Apple Silicon (8-stage snapshot/resume)
    uses: ./.github/workflows/build-posix-github.yml
    with:
      platform: macos
      arch: arm64
      runner: macos-26
      artifact: chromix-mac-arm64
      max-stages: ${{ inputs.build_mode == 'single' && 1 || 8 }}
      build_profile: ${{ inputs.build_profile || 'fast' }}
      compile_jobs: ${{ inputs.compile_jobs || 'auto' }}
      resume_run_id: ${{ inputs.resume_run_id || '' }}
      resume_tree_stage: ${{ inputs.resume_tree_stage || '7' }}
      resume_attempt: ${{ inputs.resume_attempt || '1' }}
      resume_artifact_ids: ${{ inputs.resume_artifact_ids || '' }}
      use_upstream_cache: ${{ github.event_name != 'workflow_dispatch' || inputs.use_upstream_cache }}
    secrets: inherit

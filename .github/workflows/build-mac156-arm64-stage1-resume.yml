name: build-mac156-arm64-stage1-resume
run-name: macOS156 ARM64 exact stage1 continuation (logical 10..17)

on:
  workflow_dispatch:
    inputs:
      compile_jobs:
        description: 'Ninja jobs; latest stage1 donor and unchanged source/GN/PGO are fixed'
        type: string
        default: auto

permissions:
  actions: read
  contents: read

concurrency:
  group: mac156-arm64-stage1-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resume:
    if: github.ref == 'refs/heads/main'
    name: macOS156 ARM64 (read-only stage1 admission, logical 10..17)
    uses: ./.github/workflows/build-posix-github.yml
    with:
      platform: macos
      arch: arm64
      runner: macos-26
      artifact: chromix-mac156-arm64-stage1-resume
      max-stages: 8
      build_profile: fast
      compile_jobs: ${{ inputs.compile_jobs || 'auto' }}
      resume_migration: mac156-arm64-stage1
      resume_run_id: '42652225672'
      resume_tree_stage: '1'
      resume_attempt: '1'
      resume_artifact_ids: '13706643929,13707496932'
      use_upstream_cache: true
    secrets: inherit

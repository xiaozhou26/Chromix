name: build-mac155-arm64-stage8-resume
run-name: mac155 ARM64 donor 39104897472 attempt3 stage8 + logical stages 9..16

on:
  workflow_dispatch:
    inputs:
      compile_jobs:
        description: 'Ninja jobs: auto or a positive integer; donor source/GN identity is fixed'
        type: string
        default: auto

permissions:
  actions: read
  contents: read

concurrency:
  group: mac155-arm64-stage8-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resume:
    name: mac155 ARM64 (original stage8 + isolated continuation 1..8)
    uses: ./.github/workflows/build-posix-github.yml
    with:
      platform: macos
      arch: arm64
      runner: macos-15
      artifact: chromix-mac-arm64
      max-stages: 8
      build_profile: fast
      compile_jobs: ${{ inputs.compile_jobs || 'auto' }}
      resume_run_id: '39104897472'
      resume_tree_stage: '8'
      resume_attempt: '3'
      resume_artifact_ids: '12199650604'
      use_upstream_cache: true
    secrets: inherit

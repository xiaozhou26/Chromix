name: build-linux157-arm64-ua-resume
run-name: Linux157 ARM64 compiled stage3 44639133090 to logical stage4 UA repair

on:
  workflow_dispatch:
    inputs:
      compile_jobs:
        description: 'Ninja jobs; exact stage3 attempt1 donor and single0238 header addition are fixed'
        type: string
        default: auto

permissions:
  actions: read
  contents: read

concurrency:
  group: linux157-arm64-ua-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resume:
    name: Linux157 ARM64 (latest stage3 ICU-compiled tree, continue stage4)
    uses: ./.github/workflows/build-linux157-arm64-ua-stages.yml
    with:
      platform: linux
      arch: arm64
      runner: ubuntu-24.04
      artifact: chromix-linux-arm64
      max-stages: 8
      build_profile: fast
      compile_jobs: ${{ inputs.compile_jobs || 'auto' }}
      use_upstream_cache: false
      linux157_ua_recovery: true
    secrets: inherit

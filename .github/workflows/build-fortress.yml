name: build-fortress

# Native Chromium build on a self-hosted Windows runner (see docs/BUILD_NATIVE.md).
# A full from-scratch fetch is too large for GitHub-hosted runners.
#
# This workflow reuses the pre-seeded build tree at D:\Python\fortress\.fortress-build-win
# (source already at the pinned tag with patches applied) and resumes the ninja build,
# skipping the fetch/gclient-sync that trips on the LocalSystem runner's gsutil lock bug.
#
# Self-hosted runner labels: self-hosted, Windows, X64
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

env:
  FORTRESS_WORKDIR: 'D:\Python\fortress\.fortress-build-win'

jobs:
  build-windows:
    name: build Windows x64
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Build Fortress (native, resume)
        shell: powershell
        run: build\windows\build.ps1 -WorkDir "$env:FORTRESS_WORKDIR" -Resume

      - name: Package portable bundle
        shell: powershell
        run: |
          $out = "$env:FORTRESS_WORKDIR\chromium\src\out\Fortress"
          $dest = "$env:FORTRESS_WORKDIR\dist"
          build\windows\package-win.ps1 -Out $out -Dest $dest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tilion-fortress-win-x64
          path: ${{ env.FORTRESS_WORKDIR }}/dist/tilion-fortress-win-x64.zip
          if-no-files-found: error

      - name: Run stage 2
        id: stage
        shell: powershell
        run: build\windows\ci-stage.ps1 -StageIndex 2 -MaxStages 12 -FromArtifact
      - name: Upload restored reuse evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: upstream-reuse-win-x64-${{ github.job }}-attempt-${{ github.run_attempt }}
          path: |
            C:\c\chromix\upstream-reuse\baseline.json
            C:\c\chromix\upstream-reuse\result.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Ensure build tree snapshot
        if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.upload_parts != 'true' }}
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path C:\c\chromix | Out-Null
          . build\windows\ci-parts.ps1 -Root C:\c -PartsDir C:\parts -Mode Synced
      - name: Upload tree part 1
        if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tree-s2-attempt-${{ github.run_attempt }}-part1
          path: C:\parts\p1\*
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
      - name: Upload tree part 2
        if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: tree-s2-attempt-${{ github.run_attempt }}-part2
          path: C:\parts\p2\*
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
      - name: Upload tree part 3

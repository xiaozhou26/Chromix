  build-5:
    name: stage 5 (resume compile)
    needs: build-4
    if: ${{ always() && ((needs.build-4.result == 'success' && needs.build-4.outputs.finished != 'true') || (inputs.resume_run_id != '' && inputs.resume_stage == '5')) }}

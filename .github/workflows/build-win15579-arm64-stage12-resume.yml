# Generated by tools/gen_windows15579_arm64_stage12_workflow.py.
# Fixed donor only; twelve additional stages; native Windows11 ARM acceptance required.
name: build-win15579-arm64-stage12-resume
'on':
  workflow_dispatch:
    inputs:
      compile_jobs:
        description: Ninja jobs (auto or positive integer)
        type: string
        default: auto
run-name: "Windows155.79 ARM64 fixed stage12 \u2192 stages13\u201324"
permissions:
  contents: read
  actions: read
concurrency:
  group: build-win15579-arm64-stage12-resume-${{ github.ref }}
  cancel-in-progress: false
env:
  CHROMIX_BUILD_PROFILE: native
  CHROMIX_JOBS: ${{ inputs.compile_jobs || 'auto' }}
  CHROMIX_USE_UPSTREAM_CACHE: '1'
  CHROMIX_PREFER_UPSTREAM_CACHE: '0'
  DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
  DEPOT_TOOLS_METRICS: '0'
  DEPOT_TOOLS_COLLECT_METRICS: '0'
  CHROMIX_TARGET_ARCH: arm64
jobs:
  build-1:
    name: stage 13 (unchanged stage12 continuation)
    runs-on: windows-2022
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      snapshot_attempt: ${{ steps.snapshot_origin.outputs.attempt }}
    steps:
    - name: Record snapshot producer attempt
      shell: powershell
      run: '$ErrorActionPreference = ''Stop''

        Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "attempt=$env:GITHUB_RUN_ATTEMPT"

        Add-Content -LiteralPath $env:GITHUB_ENV -Value "CHROMIX_RESUME_STARTED=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())"'
      id: snapshot_origin
      working-directory: ${{ github.workspace }}
    - uses: actions/checkout@v4
      with:
        path: target
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout exact donor as data
      uses: actions/checkout@v4
      with:
        ref: 8454c240f86343ec283bdd10d1b5d778f6624e48
        path: donor
        fetch-depth: 0
        persist-credentials: false
        submodules: false
    - name: Verify generated continuation controller
      shell: powershell
      run: '$ErrorActionPreference = ''Stop''

        python -m pip install --disable-pip-version-check PyYAML==6.0.2

        if ($LASTEXITCODE -ne 0) { throw "workflow validation dependency installation failed" }

        python tools/gen_windows15579_arm64_stage12_workflow.py --check

        if ($LASTEXITCODE -ne 0) { throw "stale stage12 continuation workflow" }'
    - name: Free host cache space before snapshot download
      shell: powershell
      run: "$ErrorActionPreference = 'Stop'\nforeach ($path in @('C:\\Android', 'C:\\Program Files\\Android', 'C:\\Program\
        \ Files (x86)\\Android', 'C:\\ghcup', 'C:\\Miniconda3', 'C:\\ProgramData\\chocolatey\\cache')) {\n  if (Test-Path\
        \ -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue }\n}"
    - name: Verify native process-tree cleanup
      shell: powershell
      timeout-minutes: 5
      run: 'python -m pip install --disable-pip-version-check PyYAML==6.0.2

        if ($LASTEXITCODE -ne 0) { throw "process cleanup test dependency install failed" }

        python -m unittest tools.tests.test_ci_stage.InvokeTrackedRegressionTest tools.tests.test_ci_stage.InvokeTrackedPowerShellTest
        -v

        if ($LASTEXITCODE -ne 0) { throw "native process-tree cleanup regression failed" }

        '

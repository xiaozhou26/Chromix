        $budget = [Math]::Min(300, [Math]::Floor(325 - $elapsed))

        if ($budget -lt 60) { throw "insufficient restore/compile/snapshot budget" }

        build\windows\ci-stage.ps1 -StageIndex 13 -MaxStages 24 -FromArtifact -UseUpstreamCache -Arch arm64 -StageBudgetMinutes
        $budget -ResumeStage12DonorRepo "$env:GITHUB_WORKSPACE\donor"'
      id: stage
    - name: Upload restored reuse evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: upstream-reuse-win-arm64-${{ github.job }}-attempt-${{ github.run_attempt }}
        path: 'C:\c\chromix\upstream-reuse\baseline.json

          C:\c\chromix\upstream-reuse\result.json

          C:\c\chromix\upstream-cache-preparation.json

          '
        if-no-files-found: ignore
        retention-days: 7
    - name: Ensure build tree snapshot

      shell: powershell
      run: '$ErrorActionPreference = ''Stop''

        python tools/validate_windows15579_arm64_stage12_checkpoint.py --metadata --report "$env:RUNNER_TEMP\windows-snapshot.json"

        if ($LASTEXITCODE -ne 0) { throw "fixed stage12 donor rejected" }'
      env:
        GH_TOKEN: ${{ secrets.UPSTREAM_ACTIONS_TOKEN || github.token }}
    - name: Download only digest-pinned stage12 volumes
      shell: powershell
      run: '$ErrorActionPreference = ''Stop''

        python tools/download_windows_snapshot.py --manifest "$env:RUNNER_TEMP\windows-snapshot.json" --destination C:\restore

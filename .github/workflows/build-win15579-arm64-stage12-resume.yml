  build-12:
    name: stage 24 (unchanged stage12 continuation)
    needs: build-11
    if: ${{ always() && needs.build-11.result == 'success' && needs.build-11.outputs.finished != 'true' }}
    runs-on: windows-2022
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      snapshot_attempt: ${{ steps.snapshot_origin.outputs.attempt }}
    steps:
    - name: Record snapshot producer attempt
      shell: powershell
      run: '$ErrorActionPreference = ''Stop''

        Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "attempt=$env:GITHUB_RUN_ATTEMPT"

        Add-Content -LiteralPath $env:GITHUB_ENV -Value "CHROMIX_RESUME_STARTED=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())"'
      id: snapshot_origin
      working-directory: ${{ github.workspace }}
    - uses: actions/checkout@v4
      with:
        path: target
        fetch-depth: 0
        persist-credentials: false
    - name: Checkout exact donor as data
      uses: actions/checkout@v4
      with:
        ref: 8454c240f86343ec283bdd10d1b5d778f6624e48
        path: donor
        fetch-depth: 0
        persist-credentials: false
        submodules: false
    - name: Verify generated continuation controller
      shell: powershell
      run: '$ErrorActionPreference = ''Stop''

        python -m pip install --disable-pip-version-check PyYAML==6.0.2

        if ($LASTEXITCODE -ne 0) { throw "workflow validation dependency installation failed" }

        python tools/gen_windows15579_arm64_stage12_workflow.py --check

        if ($LASTEXITCODE -ne 0) { throw "stale stage12 continuation workflow" }'
    - name: Free host cache space before snapshot download
      shell: powershell
      run: "$ErrorActionPreference = 'Stop'\nforeach ($path in @('C:\\Android', 'C:\\Program Files\\Android', 'C:\\Program\
        \ Files (x86)\\Android', 'C:\\ghcup', 'C:\\Miniconda3', 'C:\\ProgramData\\chocolatey\\cache')) {\n  if (Test-Path\
        \ -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue }\n}"
    - name: Download tree from exact previous producer attempt
      uses: actions/download-artifact@v4
      with:
        pattern: win-arm64-tree-s23-attempt-${{ needs.build-11.outputs.snapshot_attempt }}-part*
        merge-multiple: true
        path: C:\restore
    - name: Select compile parallelism
      shell: powershell
      run: '$ErrorActionPreference = ''Stop''

        python tools/build_resources.py --github-env

        if ($LASTEXITCODE -ne 0) { throw "invalid compile parallelism" }'
    - name: Run stage 24
      shell: powershell
      run: '$ErrorActionPreference = ''Stop''

        $elapsed = ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() - [long]$env:CHROMIX_RESUME_STARTED) / 60

        $budget = [Math]::Min(300, [Math]::Floor(325 - $elapsed))

        if ($budget -lt 60) { throw "insufficient restore/compile/snapshot budget" }

        build\windows\ci-stage.ps1 -StageIndex 24 -MaxStages 24 -FromArtifact -UseUpstreamCache -Arch arm64 -StageBudgetMinutes
        $budget -ResumeStage12DonorRepo "$env:GITHUB_WORKSPACE\donor"'
      id: stage
    - name: Upload restored reuse evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: upstream-reuse-win-arm64-${{ github.job }}-attempt-${{ github.run_attempt }}

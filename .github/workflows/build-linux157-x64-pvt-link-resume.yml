name: build-linux157-x64-pvt-link-resume
run-name: Linux157 x64 compiled stage2 44712280809 to logical stage3 PVT link repair

on:
  workflow_dispatch:
    inputs:
      compile_jobs:
        description: 'Ninja jobs; exact stage2 donor and reviewed single-source233 link repair are fixed'
        type: string
        default: auto

permissions:
  actions: read
  contents: read

concurrency:
  group: linux157-x64-pvt-link-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resume:
    name: Linux157 x64 (latest stage2 compiled tree, continue stage3)
    uses: ./.github/workflows/build-linux157-x64-pvt-link-stages.yml
    with:
      platform: linux
      arch: x64
      runner: ubuntu-22.04
      artifact: chromix-linux-x64
      max-stages: 8
      build_profile: fast
      compile_jobs: ${{ inputs.compile_jobs || 'auto' }}
      use_upstream_cache: false
      linux157_pvt_link_recovery: true
    secrets: inherit

name: build-linux157-arm64-storage-resume
run-name: Linux157 ARM64 compiled stage5 44660206036 to logical stage6 Storage repair

on:
  workflow_dispatch:
    inputs:
      compile_jobs:
        description: 'Ninja jobs; exact stage5 attempt1 donor and reviewed Storage source repair are fixed'
        type: string
        default: auto

permissions:
  actions: read
  contents: read

concurrency:
  group: linux157-arm64-storage-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resume:
    name: Linux157 ARM64 (latest stage5 Storage-failed compiled tree, continue stage6)
    uses: ./.github/workflows/build-linux157-arm64-storage-stages.yml
    with:
      platform: linux
      arch: arm64
      runner: ubuntu-24.04
      artifact: chromix-linux-arm64
      max-stages: 8
      build_profile: fast
      compile_jobs: ${{ inputs.compile_jobs || 'auto' }}
      use_upstream_cache: false
      linux157_storage_recovery: true
    secrets: inherit

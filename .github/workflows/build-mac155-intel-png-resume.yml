name: build-mac155-intel-png-resume
run-name: mac155 intel compiled stage1 PNG recovery

on:
  workflow_dispatch:
    inputs:
      compile_jobs:
        description: 'Ninja jobs: auto or a positive integer; reviewed source migration and GN arguments are fixed'
        type: string
        default: auto

permissions:
  actions: read
  contents: read

concurrency:
  group: mac155-intel-png-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resume:
    name: mac155 intel (compiled donor + PNG migration 1..8)
    uses: ./.github/workflows/build-posix-github.yml
    with:
      platform: macos
      arch: x64
      runner: macos-15-intel
      artifact: chromix-mac-x64
      max-stages: 8
      build_profile: fast
      compile_jobs: ${{ inputs.compile_jobs || 'auto' }}
      resume_run_id: '39527807228'
      resume_tree_stage: '1'
      resume_attempt: '1'
      resume_artifact_ids: '12320702218,12320871982'
      use_upstream_cache: true
    secrets: inherit

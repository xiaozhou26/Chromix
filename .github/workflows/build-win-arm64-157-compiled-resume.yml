# Generated by tools/gen_windows_arm64_workflow.py; original ARM64 stage6 producer only.
name: build-win-arm64-157-compiled-resume
'on':
  workflow_dispatch:
    inputs:
      compile_jobs:
        type: string
        default: auto
run-name: build-win-arm64-157-compiled-resume
permissions:
  contents: read
  actions: read
concurrency:
  group: build-win-arm64-157-compiled-resume-${{ github.ref }}
  cancel-in-progress: false
env:
  CHROMIX_BUILD_PROFILE: native
  CHROMIX_TARGET_ARCH: arm64
  CHROMIX_JOBS: ${{ inputs.compile_jobs || 'auto' }}
  CHROMIX_USE_UPSTREAM_CACHE: '1'
  CHROMIX_PREFER_UPSTREAM_CACHE: '0'
  DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
  DEPOT_TOOLS_METRICS: '0'
  DEPOT_TOOLS_COLLECT_METRICS: '0'
jobs:
  build-7:
    name: Windows157 ARM64 compiled stage 7
    runs-on: windows-2022
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      snapshot_attempt: ${{ steps.snapshot_origin.outputs.attempt }}
    steps:
    - name: Record snapshot producer attempt
      id: snapshot_origin
      shell: powershell
      run: Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "attempt=$env:GITHUB_RUN_ATTEMPT"
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Restore and migrate original ARM64 stage6 checkpoint
      shell: powershell
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'python tools/windows157_arm64_compiled_resume.py --phase metadata --repo "$env:GITHUB_WORKSPACE" --report "$env:RUNNER_TEMP\compiled-origin.json"

        if ($LASTEXITCODE -ne 0) { throw ''Fixed compiled ARM64 stage6 donor metadata rejected'' }

        python tools/download_windows_snapshot.py --manifest "$env:RUNNER_TEMP\compiled-origin.json" --destination C:\restore
        --report "$env:RUNNER_TEMP\compiled-download.json"

        if ($LASTEXITCODE -ne 0) { throw ''Fixed compiled ARM64 stage6 tree download failed; no fresh fallback'' }

        & 7z.exe t C:\restore\tree.7z.001

        if ($LASTEXITCODE -ne 0) { throw ''Preserved tree archive verification failed'' }

        if (Test-Path C:\c\chromix) { throw ''Refusing to overwrite existing source/output'' }

        & 7z.exe x C:\restore\tree.7z.001 -oC:\c -y

        if ($LASTEXITCODE -ne 0) { throw ''Preserved tree restore failed'' }

        Remove-Item -LiteralPath C:\restore -Recurse -Force

        python tools/windows157_arm64_compiled_resume.py --phase migrate --repo "$env:GITHUB_WORKSPACE" --workdir C:\c\chromix
        --origin "$env:RUNNER_TEMP\compiled-origin.json" --download "$env:RUNNER_TEMP\compiled-download.json" --report "$env:RUNNER_TEMP\compiled-source.json"

        if ($LASTEXITCODE -ne 0) { throw ''Fixed compiled ARM64 stage6 source/phase admission failed'' }

        '
    - name: Verify native process-tree cleanup
      shell: powershell
      timeout-minutes: 5
      run: 'python -m pip install --disable-pip-version-check PyYAML==6.0.2

        if ($LASTEXITCODE -ne 0) { throw "process cleanup test dependency install failed" }

        python -m unittest tools.tests.test_ci_stage.InvokeTrackedRegressionTest tools.tests.test_ci_stage.InvokeTrackedPowerShellTest
        -v

        if ($LASTEXITCODE -ne 0) { throw "native process-tree cleanup regression failed" }

        '
    - name: Verify generated Windows ARM64 workflow
      shell: powershell
      timeout-minutes: 2
      run: 'python tools/gen_windows_arm64_workflow.py --check

        if ($LASTEXITCODE -ne 0) { throw "Windows workflow generation is stale" }'
    - name: Select compile parallelism
      shell: powershell
      run: python tools/build_resources.py --github-env
    - name: Run stage 7
      id: stage
      shell: powershell
      run: build\windows\ci-stage.ps1 -StageIndex 7 -MaxStages 12 -FromSynced -CompiledRecovery -Arch arm64
    - name: Ensure build tree snapshot
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.finished != 'true' }}
      shell: powershell
      run: "if ($env:UPLOAD_PARTS -ne 'true' -or $env:STAGE_OUTCOME -ne 'success') {\n  . build\\windows\\ci-parts.ps1 -Root\
        \ C:\\c -PartsDir C:\\parts -Mode Synced -Arch arm64\n}\nif (-not (Test-Path 'C:\\parts\\p1\\tree.7z.001')) { throw\
        \ 'No complete snapshot volume set' }"
      env:
        UPLOAD_PARTS: ${{ steps.stage.outputs.upload_parts }}
        STAGE_OUTCOME: ${{ steps.stage.outcome }}
      id: compiled_snapshot
    - name: Upload tree part 1
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.finished != 'true' && steps.compiled_snapshot.outcome
        == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: win-arm64-157-compiled-tree-s7-attempt-${{ github.run_attempt }}-part1
        path: C:\parts\p1\*
        if-no-files-found: warn
        retention-days: 14
        compression-level: 0
    - name: Upload tree part 2
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.finished != 'true' && steps.compiled_snapshot.outcome
        == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: win-arm64-157-compiled-tree-s7-attempt-${{ github.run_attempt }}-part2
        path: C:\parts\p2\*
        if-no-files-found: warn
        retention-days: 14
        compression-level: 0
    - name: Upload tree part 3
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.finished != 'true' && steps.compiled_snapshot.outcome
        == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: win-arm64-157-compiled-tree-s7-attempt-${{ github.run_attempt }}-part3
        path: C:\parts\p3\*
        if-no-files-found: warn
        retention-days: 14
        compression-level: 0
    - name: Upload tree part 4
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.finished != 'true' && steps.compiled_snapshot.outcome
        == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: win-arm64-157-compiled-tree-s7-attempt-${{ github.run_attempt }}-part4
        path: C:\parts\p4\*
        if-no-files-found: warn
        retention-days: 14
        compression-level: 0
    - name: Upload fingerprint diagnostics
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: fingerprint-win-arm64-${{ github.job }}-attempt-${{ github.run_attempt }}
        path: C:\c\chromix\fingerprint-diagnostics\
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload final bundle
      if: steps.stage.outputs.finished == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: win-arm64
        path: 'C:\c\dist\chromix-win-arm64.zip

          C:\c\dist\SHA256SUMS

          '
        if-no-files-found: error
        retention-days: 7
        compression-level: 0
    - name: Upload compiled migration evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: compiled-admission-${{ github.job }}-attempt-${{ github.run_attempt }}
        path: ${{ runner.temp }}/compiled-*.json
        if-no-files-found: ignore
        retention-days: 14
    - name: Upload final source receipt
      if: steps.stage.outputs.finished == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: chromix-win-arm64-source-receipt
        path: C:\c\dist\source-verification.json
        if-no-files-found: error
        retention-days: 7
    if: ${{ github.ref == 'refs/heads/main' }}

name: build-linux157-x64-ua-resume
run-name: Linux157 x64 latest compiled 44630942999 UA version-header repair

on:
  workflow_dispatch:
    inputs:
      compile_jobs:
        description: 'Ninja jobs; latest ICU-compiled donor and exact0238 header addition are fixed'
        type: string
        default: auto

permissions:
  actions: read
  contents: read

concurrency:
  group: linux157-x64-ua-resume-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resume:
    name: Linux157 x64 (latest ICU-compiled tree + UA header)
    uses: ./.github/workflows/build-linux157-x64-ua-stages.yml
    with:
      platform: linux
      arch: x64
      runner: ubuntu-22.04
      artifact: chromix-linux-x64
      max-stages: 8
      build_profile: fast
      compile_jobs: ${{ inputs.compile_jobs || 'auto' }}
      use_upstream_cache: false
      linux157_ua_recovery: true
    secrets: inherit

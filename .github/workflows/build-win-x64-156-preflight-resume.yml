      uses: actions/upload-artifact@v4
      with:
        name: fingerprint-win-x64-${{ github.job }}-attempt-${{ github.run_attempt }}
        path: C:\c\chromix\fingerprint-diagnostics\
        if-no-files-found: ignore
        retention-days: 7
    - name: Upload final bundle
      if: steps.stage.outputs.finished == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: win-x64
        path: 'C:\c\dist\chromix-win-x64.zip

          C:\c\dist\SHA256SUMS

          '
        if-no-files-found: error
        retention-days: 7
        compression-level: 0

# Generated by tools/gen_windows_arm64_workflow.py; fixed Windows156 precompile recovery only.
name: build-win-x64-156-preflight-resume
'on':
  workflow_dispatch:
    inputs:
      compile_jobs:
        type: string
        default: auto
run-name: build-win-x64-156-preflight-resume jobs=${{ inputs.compile_jobs }}
permissions:
  contents: read
  actions: read
concurrency:
  group: build-win-x64-156-preflight-resume-${{ github.ref }}
  cancel-in-progress: false
env:
  CHROMIX_BUILD_PROFILE: native
  CHROMIX_TARGET_ARCH: x64
  CHROMIX_JOBS: ${{ inputs.compile_jobs || 'auto' }}
  CHROMIX_USE_UPSTREAM_CACHE: '0'
  CHROMIX_PREFER_UPSTREAM_CACHE: '0'
  DEPOT_TOOLS_WIN_TOOLCHAIN: '0'
  DEPOT_TOOLS_METRICS: '0'
  DEPOT_TOOLS_COLLECT_METRICS: '0'
jobs:
  build-1:
    name: Windows156 x64 stage 1
    runs-on: windows-2022
    timeout-minutes: 355
    outputs:
      finished: ${{ steps.stage.outputs.finished }}
      snapshot_attempt: ${{ steps.snapshot_origin.outputs.attempt }}
    steps:
    - name: Record snapshot producer attempt
      id: snapshot_origin
      shell: powershell
      run: Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "attempt=$env:GITHUB_RUN_ATTEMPT"
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Require fixed main recovery
      shell: powershell
      run: if ($env:GITHUB_REF -cne 'refs/heads/main') { throw 'Fixed recovery requires main' }
    - name: Restore exact reviewed precompile donor
      shell: powershell
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'python tools/windows156_preflight_resume.py --phase metadata --arch x64 --repo "$env:GITHUB_WORKSPACE" --report
        "$env:RUNNER_TEMP\windows156-origin.json"

        if ($LASTEXITCODE -ne 0) { throw ''Fixed donor metadata/helper review failed; no cold fallback'' }

        python tools/download_windows_snapshot.py --manifest "$env:RUNNER_TEMP\windows156-origin.json" --destination C:\restore
        --report "$env:RUNNER_TEMP\windows156-download.json"

        if ($LASTEXITCODE -ne 0) { throw ''Fixed donor archive authentication failed'' }

        & 7z.exe t C:\restore\tree.7z.001

        if ($LASTEXITCODE -ne 0) { throw ''Preserved tree archive verification failed'' }

        if (Test-Path C:\c\chromix) { throw ''Refusing to overwrite existing source/output'' }

        & 7z.exe x C:\restore\tree.7z.001 -oC:\c -y

        if ($LASTEXITCODE -ne 0) { throw ''Preserved tree restore failed'' }

        Remove-Item -LiteralPath C:\restore -Recurse -Force

        build/windows/ensure-windows-sdk.ps1 -Arch x64 -ChromiumVersion 156.0.8078.79 -DownloadDir C:\c -Install

        if ($LASTEXITCODE -ne 0) { throw ''Pinned runtime source SDK provisioning failed'' }

        python tools/windows156_preflight_resume.py --phase verify --arch x64 --repo "$env:GITHUB_WORKSPACE" --workdir C:\c\chromix
        --origin "$env:RUNNER_TEMP\windows156-origin.json" --download "$env:RUNNER_TEMP\windows156-download.json" --report
        "$env:RUNNER_TEMP\windows156-preflight-source.json"

        if ($LASTEXITCODE -ne 0) { throw ''Unchanged source/GN/PGO verification failed; no cold fallback'' }

        $evidence = ''C:\c\chromix\fingerprint-diagnostics\preflight-resume''

        if (Test-Path $evidence) { throw ''Recovery evidence already exists'' }

        New-Item -ItemType Directory -Path $evidence | Out-Null

        Copy-Item "$env:RUNNER_TEMP\windows156-*.json" $evidence

        '
    - name: Verify native process-tree cleanup
      shell: powershell
      timeout-minutes: 5
      run: 'python -m pip install --disable-pip-version-check PyYAML==6.0.2

        if ($LASTEXITCODE -ne 0) { throw "process cleanup test dependency install failed" }

        python -m unittest tools.tests.test_ci_stage.InvokeTrackedRegressionTest tools.tests.test_ci_stage.InvokeTrackedPowerShellTest
        -v

        if ($LASTEXITCODE -ne 0) { throw "native process-tree cleanup regression failed" }

        '
    - name: Verify generated Windows ARM64 workflow
      shell: powershell
      timeout-minutes: 2
      run: 'python tools/gen_windows_arm64_workflow.py --check

        if ($LASTEXITCODE -ne 0) { throw "Windows workflow generation is stale" }'
    - name: Select compile parallelism
      shell: powershell
      run: python tools/build_resources.py --github-env
    - name: Run stage 1
      id: stage
      shell: powershell
      run: build\windows\ci-stage.ps1 -StageIndex 1 -MaxStages 12 -FreshNative -FromSynced
    - name: Ensure build tree snapshot
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.finished != 'true' }}
      shell: powershell
      run: "if ($env:UPLOAD_PARTS -ne 'true' -or $env:STAGE_OUTCOME -ne 'success') {\n  . build\\windows\\ci-parts.ps1 -Root\
        \ C:\\c -PartsDir C:\\parts -Mode Synced -Arch x64\n}\nif (-not (Test-Path 'C:\\parts\\p1\\tree.7z.001')) { throw\
        \ 'No complete snapshot volume set' }"
      env:
        UPLOAD_PARTS: ${{ steps.stage.outputs.upload_parts }}
        STAGE_OUTCOME: ${{ steps.stage.outcome }}
    - name: Upload tree part 1
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.finished != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: win-x64-156-tree-s1-attempt-${{ github.run_attempt }}-part1
        path: C:\parts\p1\*
        if-no-files-found: warn
        retention-days: 14
        compression-level: 0
    - name: Upload tree part 2
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.finished != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: win-x64-156-tree-s1-attempt-${{ github.run_attempt }}-part2
        path: C:\parts\p2\*
        if-no-files-found: warn
        retention-days: 14
        compression-level: 0
    - name: Upload tree part 3
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.finished != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: win-x64-156-tree-s1-attempt-${{ github.run_attempt }}-part3
        path: C:\parts\p3\*
        if-no-files-found: warn
        retention-days: 14
        compression-level: 0
    - name: Upload tree part 4
      if: ${{ always() && steps.stage.outputs.snapshot_safe == 'true' && steps.stage.outputs.finished != 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: win-x64-156-tree-s1-attempt-${{ github.run_attempt }}-part4
        path: C:\parts\p4\*
        if-no-files-found: warn
        retention-days: 14
        compression-level: 0
    - name: Upload fingerprint diagnostics
